<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground · KayPy</title>
<meta name="description" content="Write a KayPy game in your browser and press Run. No account, no install.">
<meta property="og:title" content="Playground · KayPy">
<meta property="og:description" content="Write a KayPy game in your browser and press Run. No account, no install.">
<meta property="og:image" content="../static/social.png">
<link rel="icon" href="../static/favicon.png">
<link rel="apple-touch-icon" href="../static/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">

<!-- PyIDE's own stylesheet, vendored. This page is a full-page PyIDE without
     the school in it, so it wears PyIDE's chrome rather than an imitation of
     it that drifts. It brings its own complete palette, which is why
     site.css is NOT loaded here: both define --bg, --line and --green, and
     whichever loaded second would win at random. play.css holds only the
     handful of rules this page needs on top. -->
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./play.css">

<script>
  /* Before first paint, so the page never flashes the wrong theme. PyIDE
     stores the same two keys; the playground keeps its own so a visitor's
     choice here does not reach into their school editor, or the reverse. */
  (function () {
    try {
      var saved = localStorage.getItem("kaypy-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
      var size = parseInt(localStorage.getItem("kaypy-code-size"), 10);
      if (size >= 11 && size <= 32) {
        document.documentElement.style.setProperty("--code-size", size + "px");
      }
    } catch (e) { /* storage blocked; the CSS default still applies */ }
  })();
</script>
</head>

<body>

<a class="skip" href="#editor">Skip to the editor</a>

<header class="bar">
  <a class="brand brandlink" href="../">
    <img class="logo-img" src="../static/creature.png" alt="" width="26" height="27">
    KayPy
  </a>

  <!-- Where PyIDE puts the project and author fields. There is nothing to
       name here — nothing is saved anywhere — so the room goes to getting
       back to the rest of the site. -->
  <nav class="meta site-nav" aria-label="Main"><a href="../">Home</a><a href="../start/">Get started</a><a href="../guide/">Guide</a><a href="../api/">API</a><a href="../tutorials/">Tutorials</a><a href="../play/" class="current">Playground</a></nav>

  <div class="actions">
    <button id="run" class="btn btn-run" disabled>
      <span class="btn-icon">▶</span><span id="run-label">Loading…</span>
    </button>
    <button id="stop" class="btn btn-stop" hidden>■ Stop</button>
    <button id="sprites-toggle" class="btn" aria-expanded="false">Sprites</button>
    <button id="export" class="btn btn-primary"
            title="Pack this game into one HTML file you can open or upload.">Download</button>
    <button id="reset" class="btn"
            title="Put the starter game back in the editor.">Start over</button>
    <button id="theme" class="btn btn-icon-only" type="button"
            title="Switch between light and dark" aria-label="Switch theme">◐</button>
  </div>
</header>

<main class="split">
  <section class="pane pane-editor">
    <div class="pane-head">
      <span>game.py</span>
      <span id="status" class="savestate" aria-live="polite"></span>
    </div>
    <div class="editor-wrap"><textarea id="editor"></textarea></div>
  </section>

  <section class="pane pane-right">
    <div id="stage" class="stage" hidden>
      <div class="pane-head"><span>Game</span></div>
      <div class="stage-frame">
        <canvas id="canvas" tabindex="0" width="800" height="600"></canvas>
      </div>
    </div>

    <div id="output-view" class="subpane">
      <div class="pane-head">
        <span>Output</span>
        <button id="clear" class="linkbtn">Clear</button>
      </div>
      <pre id="output" class="output"><span class="dim">Python is loading. This takes a few seconds the first time.</span>
</pre>
    </div>
  </section>

  <aside id="sprites" class="pane pane-sprites" hidden aria-label="Sprites and sounds">
    <div class="pane-head">
      <span>Sprites &amp; sounds</span>
      <button id="sprites-close" class="linkbtn">Close</button>
    </div>
    <div class="sprite-tools">
      <input id="sprite-search" class="field" type="search" placeholder="Search sprites">
    </div>
    <div class="sprite-scroll">
      <div id="images-section" class="sprite-section">
        <div class="sprite-subhead">Kaplay pack</div>
        <div id="sprite-grid" class="sprite-grid"><span class="dim">Loading…</span></div>
      </div>
      <div id="dungeon-section" class="sprite-section" hidden>
        <div class="sprite-subhead">Dungeon pack</div>
        <div id="dungeon-grid" class="sprite-grid"></div>
      </div>
      <div id="atlas-section" class="sprite-section" hidden>
        <div class="sprite-subhead">Sprite atlas</div>
        <div id="atlas-list"></div>
      </div>
      <p id="sprite-empty" class="dim sprite-empty" hidden>No sprite by that name.</p>
      <div id="sound-section" class="sprite-section">
        <div class="sprite-subhead">Sounds</div>
        <div id="sound-list" class="chip-row"></div>
      </div>
    </div>
    <p class="sprite-foot">Click a sprite to drop it into your code.</p>
  </aside>
</main>

<!-- The two paths the vendored modules read. Relative, so this works at a
     domain root, in a subdirectory, and from a local build. -->
<script>
  window.PyIDEPaths = {
    bundle: "../engine/kaypy_bundle.json",
    assets: "../assets/"
  };
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<!-- The same Pyodide PyIDE runs. test_playground.py fails if the two drift:
     the engine is vendored from PyIDE and was tested against that runtime. -->
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>

<!-- Same order as PyIDE's page. export.js before game.js: an export carries
     runtime.js's Python bootstrap inside it. -->
<script src="./zip.js"></script>
<script src="./runtime.js"></script>
<script src="./export.js"></script>
<script src="./game.js"></script>
<script src="./sprites.js"></script>
<script src="./complete.js"></script>
<script src="./play.js"></script>

</body>
</html>
