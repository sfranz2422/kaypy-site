y's DOM one) read it and do the rest.\n    \"\"\"\n\n    def __init__(self, text, choices=None, answer=None, link=None,\n                 button=\"OK\", placeholder=None, then=None, asks=False):\n        self.text = str(text)\n        self.choices = list(choices) if choices else None\n        self.answer = answer\n        self.link = link                 # (label, url) or None\n        self.button = button\n        self.placeholder = placeholder or \"\"\n        self.then = then\n\n        #: Is this a question? Set by ask(), false for say().\n        #\n        # WHY THIS IS RECORDED RATHER THAN WORKED OUT\n        #\n        # Both renderers used to decide what a panel looks like from the only\n        # thing they could see \u2014 whether it had choices:\n        #\n        #     if p.choices:  ...buttons...\n        #     else:          ...a text box...\n        #\n        # A say() has no choices, exactly like a short-answer ask(), so it got\n        # the short-answer layout: a real text field, which the player could\n        # type into, and whose contents finish() then threw away, because a\n        # say() handler is called with nothing. On the desktop the hint under\n        # it even read \"Type your answer, then press Enter.\" On a message.\n        #\n        # Two renderers guessing the same thing from the same missing fact is\n        # not a rendering bug twice, it is one missing field. So the panel\n        # says what it is, and nobody has to infer it.\n        self.asks = asks\n\n        self.typed = \"\"                  # short-answer box\n        self.hover = -1                  # which choice the mouse is over\n        self.done = False\n\n    # ---- what the answer means ------------------------------------------\n\n    def _is_correct(self, chosen_index, chosen_text):\n        \"\"\"Was that right? None when the panel never claimed to have a right\n        answer, which is different from being wrong.\"\"\"\n        if self.answer is None:\n            return None\n        if self.choices is not None:\n            if isinstance(self.answer, int):\n                return chosen_index == self.answer\n            # A string answer against choices: match the text, so a teacher\n            # can write answer=\"for\" instead of counting from zero.\n            return _same(chosen_text, self.answer)\n        if isinstance(self.answer, (list, tuple, set)):\n            return any(_same(chosen_text, a) for a in self.answer)\n        return _same(chosen_text, self.answer)\n\n    def finish(self, chosen_index=None, chosen_text=None):\n        \"\"\"Close the panel and hand the answer to the callback.\"\"\"\n        if self.done:\n            return\n        self.done = True\n        close()\n\n        if self.then is None:\n            return\n\n        # A say() has nothing to hand over. That used to be inferred from\n        # three negatives \u2014 no choices, no answer, nothing typed \u2014 which was\n        # the same guess the renderers were making, in a third place.\n        if not self.asks:\n            _call(self.then, None)\n            return\n\n        correct = self._is_correct(chosen_index, chosen_text)\n        value = chosen_text if correct is None else correct\n        _call(self.then, value)\n\n\ndef _same(a, b):\n    \"\"\"Two short answers that mean the same thing.\n\n    Case and outside spaces are ignored, because \"Paris\", \"paris \" and\n    \" Paris\" are the same answer from a fourteen-year-old and marking one of\n    them wrong teaches nothing about the subject.\n    \"\"\"\n    return str(a).strip().lower() == str(b).strip().lower()\n\n\ndef _call(fn, value):\n    \"\"\"Call the callback with the answer, or with nothing if it takes none.\n\n    A handler that ignores the answer is common and reasonable \u2014 `say()` has\n    none to give, and plenty of ask() handlers only care that the panel\n    closed. Requiring an unused parameter would be noise.\n    \"\"\"\n    if value is None:\n        try:\n            return fn()\n        except TypeError:\n            return fn(None)\n    try:\n        return fn(value)\n    except TypeError:\n        return fn()\n\n\n# ------------------------------------------------------------ the API\n\ndef say(text, link=None, button=\"OK\", then=None):\n    \"\"\"Pause the game and show a message.\n\n        say(\"You found the key!\")\n        say(\"I built this in 2023.\", link=(\"See the repo\", \"https://...\"))\n\n    `link` is a (label, url) pair. In a browser it is a real link; on a\n    desktop it opens your browser.\n    \"\"\"\n    def straight(fn):\n        _show(Panel(text, link=link, button=button, then=fn, asks=False))\n        return fn\n\n    if then is not None:\n        return straight(then)\n    if callable(text):\n        raise TypeError(\"say() needs some words: say(\\\"Well done!\\\")\")\n\n    # The panel goes up now, because `say(\"Saved!\")` on its own is a\n    # statement and has to show something. If a decorator follows, it gives\n    # this panel its handler rather than opening a second one.\n    #\n    # It used to open a second one. That was invisible while a new panel\n    # closed whatever was already up \u2014 the duplicate replaced the original\n    # and looked like one panel. With panels queueing instead, `@say(\"Hi\")`\n    # showed \"Hi\" twice, and the bug had been there all along.\n    shown = Panel(text, link=link, button=button, then=None, asks=False)\n    _show(shown)\n\n    def attach(fn):\n        shown.then = fn\n        return fn\n\n    return attach\n\n\ndef ask(question, choices=None, answer=None, placeholder=None, then=None):\n    \"\"\"Pause the game and ask something.\n\n        @ask(\"Which keyword starts a loop?\", [\"if\", \"for\", \"def\"], answer=1)\n        def checked(correct):\n            ...\n\n        @ask(\"What is your name?\")\n        def greeted(reply):\n            ...\n\n    With `choices`, it is multiple choice; without, it is a box to type in.\n    With `answer`, your function is told True or False; without, it is given\n    what was picked or typed.\n    \"\"\"\n    def register(fn):\n        _show(Panel(question, choices=choices, answer=answer,\n                    placeholder=placeholder, then=fn, asks=True))\n        return fn\n\n    if then is not None:\n        return register(then)\n    return register\n\n\ndef isShowing():\n    \"\"\"Is a panel up right now?\"\"\"\n    return _current is not None\n\n\ndef close():\n    \"\"\"Take the panel away and start the game again.\n\n    Rarely called by hand \u2014 answering does it \u2014 but a panel that cannot be\n    closed from code is one a game can get stuck behind.\n    \"\"\"\n    global _current\n    if _current is None:\n        return\n    _current = None\n    view = _views.pop(\"view\", None)\n    if view is not None:\n        view.destroy()\n\n    # The next one, if anybody is waiting. The game stays paused between\n    # them: resuming for a frame and pausing again would flash the game\n    # behind the panels, which reads as a bug.\n    if _queue:\n        _present(_queue.pop(0))\n        return\n\n    eng = _safe_engine()\n    if eng is not None:\n        eng.resume()\n\n\n_views = {}\n\n\ndef _safe_engine():\n    try:\n        return _engine()\n    except Exception:                                          # noqa: BLE001\n        return None\n\n\ndef _show(panel):\n    \"\"\"Put a panel up, or get in line behind the one that is.\"\"\"\n    if _current is not None:\n        _queue.append(panel)\n        return\n    _present(panel)\n\n\ndef _present(panel):\n    global _current\n    eng = _engine()\n    _current = panel\n    eng.pause()\n    _views[\"view\"] = _make_view(panel)\n\n\ndef _make_view(panel):\n    \"\"\"The renderer for wherever this is running.\"\"\"\n    if sys.platform == \"emscripten\":\n        from . import webpanel\n        return webpanel.DomView(panel)\n    return _DesktopView(panel)\n\n\n# ------------------------------------------------------- the desktop view\n\nPAD = 18\nLINE = 26\nCHOICE_H = 34\n\n\nclass _DesktopView:\n    \"\"\"The panel, drawn with pygame.\n\n    Plain rectangles and text on purpose: this has to look deliberate at\n    800x600 on a projector, and anything fancier is another thing to go wrong\n    in front of a class.\n    \"\"\"\n\n    def __init__(self, panel):\n        self.panel = panel\n        self.rects = []          # (pygame.Rect, index) for the choices\n        self.link_rect = None\n        self.button_rect = None\n\n    def destroy(self):\n        self.rects = []\n\n    # ---- input ----------------------------------------------------------\n\n    def handle(self, events):\n        p = self.panel\n        for e in events:\n            if e.type == pygame.KEYDOWN:\n                self._key(e)\n            elif e.type == pygame.MOUSEMOTION:\n                p.hover = self._choice_at(e.pos)\n            elif e.type == pygame.MOUSEBUTTONDOWN and e.button == 1:\n                self._click(e.pos)\n\n    def _key(self, e):\n        p = self.panel\n        if p.choices:\n            # 1, 2, 3... as well as clicking. A keyboard answer is faster for\n            # a whole class and works on a machine with no mouse.\n            if pygame.K_1 <= e.key <= pygame.K_9:\n                i = e.key - pygame.K_1\n                if i < len(p.choices):\n                    p.finish(i, p.choices[i])\n            return\n        # A say() has no box, so there is nothing to type into. Enter still\n        # closes it \u2014 that is the button.\n        if not p.asks:\n            if e.key in (pygame.K_RETURN, pygame.K_SPACE):\n                p.finish(None, None)\n            return\n        # A short answer: type into it.\n        if e.key == pygame.K_RETURN:\n            p.finish(None, p.typed)\n        elif e.key == pygame.K_BACKSPACE:\n            p.typed = p.typed[:-1]\n        elif e.unicode and e.unicode.isprintable():\n            p.typed += e.unicode\n\n    def _click(self, point):\n        p = self.panel\n        if self.link_rect and self.link_rect.collidepoint(point):\n            _open_link(p.link[1])\n            return\n        i = self._choice_at(point)\n        if i >= 0:\n            p.finish(i, p.choices[i])\n            return\n        if self.button_rect and self.button_rect.collidepoint(point):\n            p.finish(None, p.typed if p.asks and p.choices is None else None)\n\n    def _choice_at(self, point):\n        for rect, i in self.rects:\n            if rect.collidepoint(point):\n                return i\n        return -1\n\n    # ---- drawing --------------------------------------------------------\n\n    def draw(self, screen, engine):\n        p = self.panel\n        sw, sh = screen.get_size()\n        font = engine._get_font(24)\n        small = engine._get_font(20)\n\n        lines = _wrap(p.text, font, int(sw * 0.7) - PAD * 2)\n        body_h = len(lines) * LINE\n        rows = len(p.choices) if p.choices else 1\n        box_w = int(sw * 0.7)\n        box_h = PAD * 3 + body_h + rows * CHOICE_H + (LINE if p.link else 0)\n        box = pygame.Rect((sw - box_w) // 2, (sh - box_h) // 2, box_w, box_h)\n\n        # Dim the game rather than hide it: the point of pausing instead of\n        # changing scene is that the player can still see where they were.\n        veil = pygame.Surface((sw, sh), pygame.SRCALPHA)\n        veil.fill((0, 0, 0, 140))\n        screen.blit(veil, (0, 0))\n\n        pygame.draw.rect(screen, (250, 250, 252), box, border_radius=10)\n        pygame.draw.rect(screen, (60, 70, 90), box, width=2, border_radius=10)\n\n        y = box.top + PAD\n        for line in lines:\n            screen.blit(font.render(line, True, (20, 24, 34)), (box.left + PAD, y))\n            y += LINE\n\n        self.rects = []\n        self.link_rect = None\n        self.button_rect = None\n\n        if p.choices:\n            for i, choice in enumerate(p.choices):\n                r = pygame.Rect(box.left + PAD, y, box_w - PAD * 2, CHOICE_H - 6)\n                over = (p.hover == i)\n                pygame.draw.rect(screen, (225, 238, 225) if over else (240, 242, 246),\n                                 r, border_radius=6)\n                pygame.draw.rect(screen, (80, 150, 60) if over else (200, 206, 214),\n                                 r, width=2, border_radius=6)\n                label = \"%d.  %s\" % (i + 1, choice)\n                screen.blit(small.render(label, True, (20, 24, 34)),\n                            (r.left + 10, r.top + 6))\n                self.rects.append((r, i))\n                y += CHOICE_H\n        elif p.asks:\n            # A short answer: a box to type in.\n            r = pygame.Rect(box.left + PAD, y, box_w - PAD * 2, CHOICE_H - 6)\n            pygame.draw.rect(screen, (255, 255, 255), r, border_radius=6)\n            pygame.draw.rect(screen, (120, 140, 170), r, width=2, border_radius=6)\n            shown = p.typed or p.placeholder\n            colour = (20, 24, 34) if p.typed else (150, 158, 170)\n            screen.blit(small.render(shown + (\"|\" if p.typed else \"\"), True, colour),\n                        (r.left + 10, r.top + 6))\n            self.button_rect = r\n            y += CHOICE_H\n        else:\n            # A message: one button, and nothing to fill in.\n            label = p.button or \"OK\"\n            text_w = small.size(label)[0]\n            r = pygame.Rect(box.left + PAD, y, text_w + 36, CHOICE_H - 6)\n            pygame.draw.rect(screen, (80, 150, 60), r, border_radius=6)\n            screen.blit(small.render(label, True, (255, 255, 255)),\n                        (r.left + 18, r.top + 6))\n            self.button_rect = r\n            y += CHOICE_H\n\n        if p.link:\n            label, _url = p.link\n            surf = small.render(label, True, (40, 90, 200))\n            pos = (box.left + PAD, y)\n            screen.blit(surf, pos)\n            self.link_rect = pygame.Rect(pos, surf.get_size())\n            pygame.draw.line(screen, (40, 90, 200),\n                             (pos[0], pos[1] + surf.get_height()),\n                             (pos[0] + surf.get_width(), pos[1] + surf.get_height()))\n            y += LINE\n\n        if p.choices:\n            hint = \"Click an answer, or press its number.\"\n        elif p.asks:\n            hint = \"Type your answer, then press Enter.\"\n        else:\n            hint = \"Press Enter, or click %s.\" % (p.button or \"OK\")\n        screen.blit(small.render(hint, True, (110, 118, 132)),\n                    (box.left + PAD, box.bottom - LINE))\n\n\ndef _open_link(url):\n    \"\"\"Open a link from a panel.\n\n    On a desktop this hands the URL to the system browser. On the web the DOM\n    view uses a real <a> and never reaches here.\n    \"\"\"\n    try:\n        webbrowser.open(url)\n    except Exception:                                          # noqa: BLE001\n        # A machine with no browser configured, or a locked-down account.\n        # Not worth ending a game over.\n        print(\"Could not open %s\" % url, file=sys.stderr)\n\n\ndef _wrap(text, font, width):\n    \"\"\"Break text into lines that fit, on spaces.\"\"\"\n    out = []\n    for para in str(text).split(\"\\n\"):\n        words, line = para.split(), \"\"\n        for word in words:\n            trial = (line + \" \" + word).strip()\n            if font.size(trial)[0] <= width or not line:\n                line = trial\n            else:\n                out.append(line)\n                line = word\n        out.append(line)\n    return out or [\"\"]\n\n\n# ------------------------------------------------- what the engine calls\n\ndef handle_events(events):\n    \"\"\"Give the panel the input. True if it took it.\"\"\"\n    view = _views.get(\"view\")\n    if _current is None or view is None:\n        return False\n    view.handle(events)\n    return True\n\n\ndef draw(screen, engine):\n    \"\"\"Draw the panel over everything else, if there is one.\"\"\"\n    view = _views.get(\"view\")\n    if _current is None or view is None:\n        return\n    if hasattr(view, \"draw\"):\n        view.draw(screen, engine)\n\n\ndef reset():\n    \"\"\"Forget any panel. Called when a new engine starts, so a panel cannot\n    outlive the game that opened it \u2014 which is exactly what happens in a\n    browser IDE, where the page stays and the game is run again.\n\n    The queue goes with it. A question still waiting from the last run is not\n    a question about this one.\"\"\"\n    global _current\n    view = _views.pop(\"view\", None)\n    if view is not None:\n        try:\n            view.destroy()\n        except Exception:                                      # noqa: BLE001\n            pass\n    _current = None\n    _queue.clear()\n", "physics.py": "\"\"\"Gravity/integration and AABB collision \u2014 resolution and event firing.\n\nPhysical pushback only happens between two objects that BOTH have\nbody(): a wall (isStatic=True) or a heavy box (mass=n) blocks you, but\na coin or an enemy with only area() is a pass-through trigger, exactly\nas Lesson 3 sets it up. Collision *events* (onCollide/onCollideUpdate/\nonCollideEnd) fire for any two objects that both carry area(), whether\nor not either has a body.\n\"\"\"\nclass PhysicsSystem:\n    # A body is never allowed to travel more than this many pixels in one\n    # collision step; anything faster gets split into substeps (up to\n    # MAX_SUBSTEPS of them). Without this, a fast fall can clear a whole\n    # tile between one frame and the next and land underneath the floor\n    # having never overlapped it \u2014 and no amount of cleverness in\n    # _resolve can catch a collision that never happened. Frame times\n    # aren't ours to control (a browser tab that just lost focus, a slow\n    # machine, a breakpoint), so the fix has to be in how far one step is\n    # allowed to move things, not in hoping every frame is 16ms.\n    MAX_STEP_PX = 16.0\n    MAX_SUBSTEPS = 4\n\n    def __init__(self):\n        self.gravity = 0.0\n\n    def substeps_for(self, objs, dt):\n        \"\"\"How many substeps this frame needs to keep every body's\n        movement under MAX_STEP_PX.\"\"\"\n        worst = 0.0\n        for obj in objs:\n            if not (obj.has(\"body\") and obj.has(\"pos\")):\n                continue\n            body = obj.comp(\"body\")\n            if body.isStatic:\n                continue\n            vx = abs(body.vel.x)\n            vy = abs(body.vel.y) + abs(self.gravity) * dt\n            worst = max(worst, max(vx, vy) * dt)\n        if worst <= self.MAX_STEP_PX:\n            return 1\n        return min(self.MAX_SUBSTEPS, int(worst // self.MAX_STEP_PX) + 1)\n\n    def step(self, objs, dt):\n        for obj in objs:\n            if not (obj.has(\"body\") and obj.has(\"pos\")):\n                continue\n            body = obj.comp(\"body\")\n            body._pending_grounded = False\n            # Remember where this body was before it moved. _resolve reads\n            # it to work out which way the two came together \u2014 see\n            # _entry_axis_is_vertical.\n            body._prev_rect = obj.comp(\"area\").get_rect() if obj.has(\"area\") else None\n            if body.isStatic:\n                continue\n            if self.gravity:\n                body.vel.y += self.gravity * dt\n            pos = obj.comp(\"pos\")\n            pos.pos = pos.pos + body.vel * dt\n\n\nclass CollisionSystem:\n    # How far below itself a body looks for a floor.\n    #\n    # Resting on something is a TOUCH, not an overlap, and an overlap is the\n    # only thing collision resolution can see. So \"am I standing on\n    # something\" cannot be answered by \"did I get pushed out of something\n    # this frame\" \u2014 on any frame where the body does not sink into the floor,\n    # that answer is no, and the game is told the player is in mid-air.\n    #\n    # A frame of zero length does exactly that: nothing moves, so nothing\n    # overlaps, so nothing resolves. Natively it never comes up, because\n    # clock.tick(60) sleeps and dt is never zero. In a browser the clock is\n    # not paced, and it happens constantly \u2014 which is why a bean resting on\n    # the floor reported landing over and over, and why isGrounded() flicked\n    # false often enough to let a player jump again in mid-air.\n    #\n    # One pixel: far enough to cover the sub-pixel gap a float position\n    # leaves, not so far that hovering above a platform counts as standing\n    # on it.\n    GROUND_PROBE = 1.0\n\n    def __init__(self):\n        self._touching = {}  # obj id -> set of other obj ids currently overlapping\n\n    def step(self, objs):\n        area_objs = [o for o in objs if o.has(\"area\") and o.exists()]\n        n = len(area_objs)\n        rects = {o._id: o.comp(\"area\").get_rect() for o in area_objs}\n        seen_pairs = set()\n\n        for i in range(n):\n            a = area_objs[i]\n            ra = rects[a._id]\n            a_touch = self._touching.setdefault(a._id, set())\n            for j in range(i + 1, n):\n                b = area_objs[j]\n                rb = rects[b._id]\n                b_touch = self._touching.setdefault(b._id, set())\n                seen_pairs.add((a._id, b._id))\n\n                if ra.colliderect(rb):\n                    is_new = b._id not in a_touch\n                    if is_new:\n                        # The object-free onCollide(tagA, tagB, fn). Here\n                        # rather than on the objects, because neither object\n                        # in a bullets-and-enemies pair exists when the\n                        # handler is written.\n                        from .engine import _engine\n                        if _engine is not None:\n                            _engine.events.fire_tag_collision(a, b)\n                    for t in b.tags:\n                        a._fire(\"collide\" if is_new else \"collideUpdate\", t, b)\n                    for t in a.tags:\n                        b._fire(\"collide\" if is_new else \"collideUpdate\", t, a)\n                    a_touch.add(b._id)\n                    b_touch.add(a._id)\n\n                    if a.has(\"body\") and b.has(\"body\"):\n                        self._resolve(a, b, ra, rb)\n                        # rects moved; refresh cached copies for later pairs\n                        rects[a._id] = a.comp(\"area\").get_rect()\n                        rects[b._id] = b.comp(\"area\").get_rect()\n                        ra = rects[a._id]\n                else:\n                    if b._id in a_touch:\n                        for t in b.tags:\n                            a._fire(\"collideEnd\", t, b)\n                        for t in a.tags:\n                            b._fire(\"collideEnd\", t, a)\n                        a_touch.discard(b._id)\n                        b_touch.discard(a._id)\n\n        # drop bookkeeping for destroyed objects\n        live_ids = {o._id for o in area_objs}\n        for oid in list(self._touching):\n            if oid not in live_ids:\n                del self._touching[oid]\n\n        # Anything resting on something solid is grounded, whether or not it\n        # overlapped it this frame. See GROUND_PROBE.\n        solid = [o for o in area_objs if o.has(\"body\")]\n        fresh = {o._id: o.comp(\"area\").get_rect() for o in solid}\n        for obj in solid:\n            body = obj.comp(\"body\")\n            if body.isStatic:\n                continue\n            if body.vel.y < 0:\n                # On the way up. Passing within a pixel of a floor is not\n                # standing on it, and a body that has just jumped must not\n                # be handed a second jump on its way off the ground.\n                continue\n            mine = fresh[obj._id]\n            probe = mine.move(0, self.GROUND_PROBE)\n            for other in solid:\n                if other is obj:\n                    continue\n                theirs = fresh[other._id]\n                # Below, not merely touching: a wall alongside is not a\n                # floor, and something the body is already inside of is not\n                # one either.\n                if probe.colliderect(theirs) and theirs.top >= mine.bottom - 0.5:\n                    body._pending_grounded = True\n                    self._rest_on(obj, body, other)\n                    break\n\n        for obj in objs:\n            if obj.has(\"body\"):\n                b = obj.comp(\"body\")\n                b._apply_grounded(b._pending_grounded)\n\n    def _rest_on(self, obj, body, other):\n        \"\"\"Park a body that is standing on something, on the exact pixel.\n\n        THE BEAN THAT TWITCHED ON THE FLOOR\n\n        A bean standing perfectly still in a platformer jittered one pixel,\n        several times a second. Read off the canvas it was the identical run\n        of pixel rows, redrawn one row up, then back, then up again.\n\n        Every frame a resting body sinks a little \u2014 gravity x dt squared \u2014\n        and every frame the push-out lifts it back. Landing exactly where it\n        started would make that invisible, and it very nearly does: the\n        error is around a hundred-thousandth of a pixel. That is not a\n        rounding artefact of the maths, it is the width of a 32-bit float\n        near y=512, which is what pygame.FRect stores. The push-out is\n        computed from those rects, so it is right to about 1e-5 and no\n        better.\n\n        A hundred-thousandth of a pixel is nothing to a player and\n        everything to `int()`. Half the time the body settles at 512.00001\n        and draws on row 512; the other half it settles at 511.99999 and\n        draws on row 511. Nothing has moved. It is the same position\n        straddling a whole number, being read two different ways.\n\n        So the fix is to put the body exactly on the surface, so that a\n        body which is not moving holds one number exactly, frame after\n        frame, and the renderer has nothing to be undecided about.\n\n        \"Exactly\" has to mean exactly. Nudging the body by however far it\n        has strayed \u2014 `pos.y += gap` \u2014 sounds like the same thing and is\n        not: the nudge is computed from where the body currently is, so it\n        inherits that position's error and lands a hair off, in a slightly\n        different place each frame. Measured in the browser, that left a\n        resting bean alternating between 498.0 and 497.99999999999994. One\n        unit in the last place of a double, and `int()` calls it 497.\n\n        So the resting position is ASSIGNED rather than adjusted, and it is\n        computed only from things that do not change while the body sits\n        there \u2014 the surface's top edge, the body's own height and anchor.\n        The same inputs give the same bits, so the body holds one identical\n        double for as long as it stands still, and the pixel it draws on\n        cannot change no matter where the rounding boundary happens to sit.\n        \"\"\"\n\n        if body.vel.y > 0:\n            # A body parked on the floor should not be carrying fall speed.\n            # Game code reads vel.y, and gravity keeps adding to it on any\n            # frame too short to sink far enough to be pushed back out \u2014\n            # which in a browser, where the clock is not paced, happens in\n            # bursts. (This is not what stops the twitching. The snap is.)\n            body.vel.y = 0.0\n\n        if not obj.has(\"pos\"):\n            return\n        from .geometry import get_size, get_topleft, get_world_pos\n\n        height = get_size(obj)[1]\n        anchor_y = obj.comp(\"anchor\").anchor.y if obj.has(\"anchor\") else -1\n        # What get_topleft subtracts from the position to find the top edge.\n        offset = (anchor_y + 1) / 2 * height\n\n        # pos() is relative to a parent, if there is one.\n        parent_y = get_world_pos(obj.parent).y if obj.parent is not None else 0.0\n        resting = get_topleft(other).y - height + offset - parent_y\n\n        if abs(resting - obj.comp(\"pos\").pos.y) <= self.GROUND_PROBE:\n            obj.comp(\"pos\").pos.y = resting\n\n    @staticmethod\n    def _entry_axis_is_vertical(body_a, body_b, overlap_x, overlap_y) -> bool:\n        \"\"\"Which axis did these two actually come together on?\n\n        \"Push out along whichever axis overlaps least\" is the usual\n        shortcut, and it is wrong in exactly the case a platformer hits\n        constantly: a floor built out of separate tiles. Land on the seam\n        between two of them and the player overlaps each tile by only\n        half its width, while a single fast frame can bury it deeper than\n        that vertically. Both tiles then push sideways \u2014 in opposite\n        directions, so they cancel \u2014 and nobody pushes up, so the player\n        sinks through a floor that is plainly there. (Found exactly this\n        way: in the browser, where frames are less even than they are\n        natively, the bean fell through the level's floor while the same\n        code at a steady 60fps on the desktop never penetrated deeply\n        enough to trip it.)\n\n        Where the two were BEFORE this step settles it without guessing:\n        if they already lined up horizontally and have only now started\n        overlapping vertically, this is a landing (or a head bump), no\n        matter how deep it got in one frame. Only when the previous\n        positions say nothing useful \u2014 a spawn, a teleport, two objects\n        that were already inside each other \u2014 does it fall back to the\n        smallest-overlap guess.\n        \"\"\"\n        pa = getattr(body_a, \"_prev_rect\", None)\n        pb = getattr(body_b, \"_prev_rect\", None)\n        if pa is not None and pb is not None:\n            was_x = pa.right > pb.left and pa.left < pb.right\n            was_y = pa.bottom > pb.top and pa.top < pb.bottom\n            if was_x and not was_y:\n                return True\n            if was_y and not was_x:\n                return False\n        return overlap_y <= overlap_x\n\n    def _resolve(self, a, b, ra, rb):\n        body_a, body_b = a.comp(\"body\"), b.comp(\"body\")\n        if body_a.isStatic and body_b.isStatic:\n            return\n\n        overlap_x = min(ra.right, rb.right) - max(ra.left, rb.left)\n        overlap_y = min(ra.bottom, rb.bottom) - max(ra.top, rb.top)\n        if overlap_x <= 0 or overlap_y <= 0:\n            return\n\n        # Which one is on top / on the left has to be read off the two\n        # boxes, NOT off their pos(): pos() means different things to\n        # different objects. A plain tile's pos is its top-left corner,\n        # but anchor(\"bot\") \u2014 what a platformer character usually wants,\n        # so it can be placed by its feet \u2014 makes pos the BOTTOM edge. A\n        # bean standing on a tile then has the larger pos.y of the two,\n        # and comparing those two numbers concludes the tile is above the\n        # bean and pushes the bean DOWN, deeper in, every frame, until it\n        # is through the floor and falling forever. The rects come from\n        # geometry.get_world_rect(), which has already folded the anchor\n        # in, so they are directly comparable.\n        a_is_left = ra.centerx < rb.centerx\n        a_is_above = ra.centery < rb.centery\n\n        if body_a.isStatic:\n            share_a, share_b = 0.0, 1.0\n        elif body_b.isStatic:\n            share_a, share_b = 1.0, 0.0\n        else:\n            total = body_a.mass + body_b.mass\n            share_a = body_b.mass / total\n            share_b = body_a.mass / total\n\n        if not self._entry_axis_is_vertical(body_a, body_b, overlap_x, overlap_y):\n            depth = overlap_x\n            dx_a = -depth * share_a if a_is_left else depth * share_a\n            dx_b = depth * share_b if a_is_left else -depth * share_b\n            if a.has(\"pos\"):\n                a.comp(\"pos\").pos.x += dx_a\n            if b.has(\"pos\"):\n                b.comp(\"pos\").pos.x += dx_b\n        else:\n            depth = overlap_y\n            dy_a = -depth * share_a if a_is_above else depth * share_a\n            dy_b = depth * share_b if a_is_above else -depth * share_b\n            if a.has(\"pos\"):\n                a.comp(\"pos\").pos.y += dy_a\n            if b.has(\"pos\"):\n                b.comp(\"pos\").pos.y += dy_b\n            top, bot = (a, b) if a_is_above else (b, a)\n            top_body, bot_body = top.comp(\"body\"), bot.comp(\"body\")\n            if not top_body.isStatic:\n                if top_body.vel.y > 0:\n                    top_body.vel.y = 0\n                top_body._pending_grounded = True\n            if not bot_body.isStatic and bot_body.vel.y < 0:\n                bot_body.vel.y = 0\n", "raycast.py": "\"\"\"raycast(origin, direction): what does a straight line hit first?\n\n    hit = raycast(guard.pos, vec2(1, 0))\n    if hit and hit.obj.is_(\"player\"):\n        print(\"I see you\")\n\nLine of sight, a laser sight, a bullet that arrives instantly, \"is there\nfloor under me\", \"what did I click on\". All the same question: starting\nhere and going that way, what is the first thing in the way?\n\nReturns a `Hit` \u2014 `.obj`, `.point`, `.distance`, `.normal` \u2014 or `None` if\nthe ray reaches nothing. Only objects with `area()` can be hit, because an\narea() box is what kaypy means by \"solid enough to bump into\". Pass\n`exclude` a list of tags to ignore some of them:\n\n    raycast(guard.pos, facing, exclude=[\"enemy\"])   # walls stop me, guards don't\n\nHOW IT WORKS, AND THE TWO THINGS THAT GO WRONG\n\nEach box is tested with the slab method: work out when the ray enters and\nleaves the box's x range, and the same for y, and the ray is inside the box\nduring the overlap of those two spans. It is a handful of divisions and no\nloops, which matters when a dozen guards each cast a ray every frame.\n\nThe two ways it is usually got wrong are both about direction components of\nzero, and both produce a bug that only shows up on axis-aligned rays \u2014 which\nis to say, on exactly the rays a game actually casts:\n\n  * a ray pointing straight along an axis has one component zero, and the\n    slab maths divides by it. In IEEE floating point 1/0.0 is +inf rather\n    than an error, and the comparisons that follow work out correctly, so\n    the honest implementation is to let it happen rather than to add special\n    cases which have to be right. What does NOT work is 0/0, which is nan,\n    and nan silently fails every comparison it is in. So the origin sitting\n    exactly on a boundary is handled explicitly below.\n\n  * a ray that starts INSIDE a box. The entry time is then negative \u2014 the\n    box began before the ray did. Reporting that as a hit at a negative\n    distance puts the hit point behind the caster, and a guard standing in\n    a doorway sees through the door it is standing in. Here it counts as a\n    hit at distance zero, which is what \"I am touching this\" should mean.\n\nWHY IT TAKES A DIRECTION AND NOT A SECOND POINT\n\nBecause \"as far as it goes\" is the common case, and a length is awkward to\ninvent for it. For a ray between two points, subtract them \u2014 the direction\ndoes not have to be a unit vector, and `distance` is in pixels either way.\n\"\"\"\nfrom __future__ import annotations\n\nimport math\n\nfrom .vec2 import Vec2, vec2\n\n\nclass Hit:\n    \"\"\"What a ray ran into.\"\"\"\n\n    __slots__ = (\"obj\", \"point\", \"distance\", \"normal\")\n\n    def __init__(self, obj, point, distance, normal):\n        #: The game object that was hit.\n        self.obj = obj\n        #: Where, in world coordinates.\n        self.point = point\n        #: How far along the ray, in pixels.\n        self.distance = distance\n        #: Which way the surface faces \u2014 vec2(-1, 0) for the left side of a\n        #: box, and so on. What you bounce off.\n        self.normal = normal\n\n    def __repr__(self):\n        return (\"Hit(obj=%r, point=%r, distance=%.2f, normal=%r)\"\n                % (self.obj, self.point, self.distance, self.normal))\n\n\ndef _hit_box(ox, oy, dx, dy, rect, max_distance):\n    \"\"\"Where this ray meets this box, or None. Returns (distance, normal).\"\"\"\n    near = 0.0\n    far = max_distance if max_distance is not None else math.inf\n    normal_axis, normal_sign = None, 0.0\n\n    for axis in (0, 1):\n        o = ox if axis == 0 else oy\n        d = dx if axis == 0 else dy\n        lo = rect.left if axis == 0 else rect.top\n        hi = rect.right if axis == 0 else rect.bottom\n\n        if d == 0.0:\n            # Parallel to this pair of edges: it either never leaves the slab\n            # or never enters it. No division, and in particular no 0/0.\n            if o < lo or o > hi:\n                return None\n            continue\n\n        t1 = (lo - o) / d\n        t2 = (hi - o) / d\n        # The face the ray goes IN through always faces back along the ray:\n        # travelling right you arrive at a left-facing face, and travelling\n        # left at a right-facing one. That depends only on the direction, so\n        # swapping t1 and t2 below \u2014 which only puts them in order \u2014 must\n        # not touch it. (Negating it here instead passes every test with a\n        # rightward ray and gets every leftward one backwards.)\n        sign = -1.0 if d > 0 else 1.0\n        if t1 > t2:\n            t1, t2 = t2, t1\n\n        if t1 > near:\n            near = t1\n            normal_axis, normal_sign = axis, sign\n        if t2 < far:\n            far = t2\n        if near > far:\n            return None\n\n    if normal_axis is None:\n        # The origin is inside the box: nothing pushed `near` off zero.\n        return 0.0, Vec2(0, 0)\n\n    normal = (Vec2(normal_sign, 0) if normal_axis == 0\n              else Vec2(0, normal_sign))\n    return near, normal\n\n\ndef raycast(origin, direction, exclude=None, max_distance=None, ignore=None):\n    \"\"\"The first area() the ray hits, as a Hit, or None.\n\n    `ignore` is a list of particular objects to pass through, as against\n    `exclude`, which is tags. It exists for the commonest way to get a\n    surprising answer out of this function: casting from an object's own\n    position. The origin is then inside that object's own box, which is a\n    hit, at distance zero, before anything else \u2014 so a guard checking\n    whether it can see the player learns only that it can see itself.\n    \"\"\"\n    from .engine import current_engine\n    from .geometry import get_world_rect\n\n    origin = vec2(origin) if not isinstance(origin, Vec2) else origin\n    direction = vec2(direction) if not isinstance(direction, Vec2) else direction\n\n    length = direction.len()\n    if length == 0:\n        raise ValueError(\n            \"raycast(origin, direction) \u2014 the direction cannot be vec2(0, 0), \"\n            \"because a ray with no direction does not go anywhere.\\n\"\n            \"    raycast(player.pos, vec2(1, 0))      # to the right\\n\"\n            \"    raycast(a.pos, b.pos - a.pos)        # from a towards b\")\n    unit = Vec2(direction.x / length, direction.y / length)\n\n    if exclude is None:\n        skip = ()\n    elif isinstance(exclude, str):\n        skip = (exclude,)\n    else:\n        skip = tuple(exclude)\n\n    passthrough = set()\n    if ignore is not None:\n        passthrough = {id(o) for o in\n                       ([ignore] if not isinstance(ignore, (list, tuple, set))\n                        else ignore)}\n\n    engine = current_engine()\n    best = None\n    for obj in engine._objs:\n        if not (obj.exists() and obj.has(\"area\")):\n            continue\n        if id(obj) in passthrough:\n            continue\n        if skip and any(obj.is_(tag) for tag in skip):\n            continue\n        found = _hit_box(origin.x, origin.y, unit.x, unit.y,\n                         get_world_rect(obj), max_distance)\n        if found is None:\n            continue\n        distance, normal = found\n        if best is None or distance < best.distance:\n            best = Hit(obj,\n                       Vec2(origin.x + unit.x * distance,\n                            origin.y + unit.y * distance),\n                       distance, normal)\n    return best\n", "render.py": "\"\"\"Draws every live object each frame: sprite, rect, circle or text,\nin z-order, through the camera unless the object has fixed().\"\"\"\nimport pygame\nfrom .geometry import get_world_pos, get_size\n\n\nclass RenderSystem:\n    def draw(self, objs, screen, camera, debug_inspect=False, on_draw=()):\n        camera.begin_frame()\n        visible = [o for o in objs if o.exists() and _is_drawable(o)]\n        visible.sort(key=lambda o: o.comp(\"z\").z if o.has(\"z\") else 0)\n\n        for obj in visible:\n            self._draw_one(obj, screen, camera)\n\n        # onDraw handlers, after the objects and before the debug boxes, so a\n        # health bar sits over the game and the collision boxes sit over\n        # everything. The surface and camera are handed to the drawing module\n        # for exactly this long: drawRect() and friends refuse to run outside\n        # it, which turns \"my drawing never appeared\" into an error that says\n        # what to do.\n        if on_draw:\n            from . import drawing\n            from .callutil import call_flexible\n\n            drawing._begin(screen, camera)\n            try:\n                for fn in list(on_draw):\n                    call_flexible(fn)\n            finally:\n                drawing._end()\n\n        if debug_inspect:\n            for obj in objs:\n                if obj.exists() and obj.has(\"area\"):\n                    self._draw_debug_box(obj, screen, camera)\n\n    def _draw_one(self, obj, screen, camera):\n        world_pos = get_world_pos(obj)\n        w, h = get_size(obj)\n\n        if obj.has(\"anchor\"):\n            a = obj.comp(\"anchor\").anchor\n        else:\n            a = pygame_default_anchor()\n        offset_x = (a.x + 1) / 2 * w\n        offset_y = (a.y + 1) / 2 * h\n\n        surf = self._build_surface(obj, w, h)\n        if surf is None:\n            return\n\n        if obj.has(\"opacity\"):\n            op = obj.comp(\"opacity\").opacity\n            surf = surf.copy()\n            surf.set_alpha(max(0, min(255, int(op * 255))))\n\n        angle = obj.comp(\"rotate\").angle if obj.has(\"rotate\") else 0\n\n        if obj.has(\"fixed\"):\n            _blit(screen, surf, angle, (offset_x, offset_y),\n                  (world_pos.x, world_pos.y))\n        else:\n            # Camera zoom scales both the surface and the anchor offset,\n            # so the anchor point stays put on screen as you zoom.\n            zoom = camera.scale\n            if zoom.x != 1 or zoom.y != 1:\n                nw = max(int(surf.get_width() * zoom.x), 1)\n                nh = max(int(surf.get_height() * zoom.y), 1)\n                surf = pygame.transform.scale(surf, (nw, nh))\n            anchor_screen = camera.world_to_screen(world_pos)\n            _blit(screen, surf, angle,\n                  (offset_x * zoom.x, offset_y * zoom.y),\n                  (anchor_screen.x, anchor_screen.y))\n\n    def _build_surface(self, obj, w, h):\n        if obj.has(\"sprite\"):\n            surf = obj.comp(\"sprite\").current_surface()\n        elif obj.has(\"rect\"):\n            rc = obj.comp(\"rect\")\n            col = obj.comp(\"color\").color if obj.has(\"color\") else (255, 255, 255)\n            surf = pygame.Surface((max(int(w), 1), max(int(h), 1)), pygame.SRCALPHA)\n            pygame.draw.rect(\n                surf, col, surf.get_rect(), border_radius=int(rc.radius)\n            )\n        elif obj.has(\"circle\"):\n            col = obj.comp(\"color\").color if obj.has(\"color\") else (255, 255, 255)\n            r = obj.comp(\"circle\").radius\n            surf = pygame.Surface((max(int(w), 1), max(int(h), 1)), pygame.SRCALPHA)\n            pygame.draw.circle(surf, col, (int(r), int(r)), int(r))\n        elif obj.has(\"text\"):\n            col = obj.comp(\"color\").color if obj.has(\"color\") else (255, 255, 255)\n            surf = obj.comp(\"text\").render_surface(col)\n        else:\n            return None\n\n        if obj.has(\"scale\"):\n            sc = obj.comp(\"scale\").scale\n            nw = max(int(surf.get_width() * sc.x), 1)\n            nh = max(int(surf.get_height() * sc.y), 1)\n            surf = pygame.transform.scale(surf, (nw, nh))\n\n        if obj.has(\"outline\") and (obj.has(\"rect\") or obj.has(\"circle\")):\n            surf = surf.copy()\n            out = obj.comp(\"outline\")\n            if obj.has(\"circle\"):\n                r = min(surf.get_width(), surf.get_height()) // 2\n                pygame.draw.circle(\n                    surf, out.outlineColor, (surf.get_width() // 2, surf.get_height() // 2),\n                    r, width=out.outlineWidth\n                )\n            else:\n                pygame.draw.rect(surf, out.outlineColor, surf.get_rect(), width=out.outlineWidth)\n\n        return surf\n\n    def _draw_debug_box(self, obj, screen, camera):\n        rect = obj.comp(\"area\").get_rect()\n        if obj.has(\"fixed\"):\n            pygame.draw.rect(screen, (0, 255, 0), rect, width=1)\n        else:\n            from .vec2 import Vec2\n            tl_world = Vec2(rect.x, rect.y)\n            tl = camera.world_to_screen(tl_world)\n            w = rect.width * camera.scale.x\n            h = rect.height * camera.scale.y\n            pygame.draw.rect(\n                screen, (0, 255, 0), pygame.Rect(tl.x, tl.y, w, h), width=1\n            )\n\n\ndef _blit(screen, surf, angle, pivot, at):\n    \"\"\"Draw `surf` so that `pivot` lands on `at`, turned `angle` degrees.\n\n    `pivot` is a point inside the surface \u2014 the anchor \u2014 and `at` is where\n    that point belongs on screen. With no rotation this is one subtraction,\n    exactly what the code did before rotation existed.\n\n    With rotation it is the awkward bit, because `pygame.transform.rotate`\n    rotates about the surface's CENTRE and hands back a larger surface with\n    the image sitting inside it. Blitting that at the old top-left makes the\n    object drift in a circle as it turns \u2014 the classic symptom, and the\n    reason this is a named function rather than two inline lines.\n\n    So: rotate the offset from the centre to the pivot by the same angle,\n    and place the rotated surface's centre that far back from `at`. The\n    pivot then stays exactly put and the object turns about it.\n\n    Signs, which are easy to get backwards and are checked in\n    tests/test_rotate.py rather than reasoned about:\n\n      * `transform.rotate(surf, -angle)` \u2014 pygame turns a surface\n        anticlockwise for a positive angle, and kaypy's angle is clockwise.\n      * `Vector2.rotate(angle)` \u2014 a vector in screen coordinates, where y\n        points down, turns clockwise for a positive angle. Same direction as\n        the image, opposite sign, because one is measured in screen space\n        and the other in pygame's own.\n    \"\"\"\n    if not angle:\n        screen.blit(surf, (at[0] - pivot[0], at[1] - pivot[1]))\n        return\n\n    rotated = pygame.transform.rotate(surf, -angle)\n    off = pygame.math.Vector2(pivot[0] - surf.get_width() / 2,\n                              pivot[1] - surf.get_height() / 2).rotate(angle)\n    screen.blit(rotated,\n                rotated.get_rect(center=(at[0] - off.x, at[1] - off.y)))\n\n\ndef _is_drawable(obj):\n    return obj.has(\"sprite\") or obj.has(\"rect\") or obj.has(\"circle\") or obj.has(\"text\")\n\n\ndef pygame_default_anchor():\n    from .vec2 import Vec2\n    return Vec2(-1, -1)\n", "storage.py": "\"\"\"setData() and getData(): something that is still there next time.\n\n    best = getData(\"best_score\", 0)\n\n    if score > best:\n        setData(\"best_score\", score)\n\nA high score that survives closing the game is the difference between a\nproject a student shows someone once and a project they play again. It is\nalso the first time most of them meet the idea that a program can have\nmemory beyond its own run, which is worth a lesson on its own.\n\nWHERE IT ACTUALLY GOES\n\nOn a desktop, a file called `kaypy-data.json` next to the game script. A plain\nJSON file, deliberately: a student can open it, read it, and see their own\nscore in it \u2014 and delete it when they want to start over. A hidden file in an\napplication-support directory would be tidier and would teach nothing.\n\nIn a browser, the page's localStorage, keyed by the game's name. That is the\nsame place KAPLAY puts it.\n\nWHEN IT CANNOT WRITE\n\nIt gives up quietly and says so once. A read-only folder, a browser with\nstorage disabled, a private window \u2014 none of those are a reason for a game to\ncrash, and a student who cannot save a high score still has a game. What it\nnever does is pretend: getData() after a failed setData() returns what was\nreally stored, not what someone hoped was.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport os\nimport sys\n\nFILENAME = \"kaypy-data.json\"\n\n_cache = None        # the loaded dict, or None before the first read\n_complained = False  # so a failure is reported once, not every frame\n\n\ndef _web():\n    return sys.platform == \"emscripten\"\n\n\ndef _storage_key():\n    \"\"\"What a browser files this game's data under.\n\n    The script's own name, so two games served from one origin \u2014 which is\n    exactly what a school's editor does \u2014 do not overwrite each other's\n    scores.\n    \"\"\"\n    main = sys.modules.get(\"__main__\")\n    name = os.path.basename(getattr(main, \"__file__\", \"\") or \"game\")\n    return \"kaypy:\" + (os.path.splitext(name)[0] or \"game\")\n\n\ndef _path():\n    \"\"\"The file beside the game script, on a desktop.\"\"\"\n    main = sys.modules.get(\"__main__\")\n    where = getattr(main, \"__file__\", None)\n    folder = os.path.dirname(os.path.abspath(where)) if where else os.getcwd()\n    return os.path.join(folder, FILENAME)\n\n\ndef _warn(what, err):\n    global _complained\n    if _complained:\n        return\n    _complained = True\n    print(f\"note: could not {what} ({type(err).__name__}: {err}). \"\n          f\"The game carries on; scores just will not be remembered.\")\n\n\ndef _load():\n    global _cache\n    if _cache is not None:\n        return _cache\n\n    _cache = {}\n    try:\n        if _web():\n            import js\n\n            raw = js.localStorage.getItem(_storage_key())\n            if raw:\n                _cache = json.loads(str(raw))\n        elif os.path.isfile(_path()):\n            with open(_path()) as f:\n                _cache = json.load(f)\n    except Exception as err:                               # noqa: BLE001\n        # Includes a corrupt file. Starting from empty beats refusing to run:\n        # the worst case is a lost high score, and the best case is a game\n        # that stops being broken as soon as it saves again.\n        _warn(\"read your saved data\", err)\n        _cache = {}\n\n    if not isinstance(_cache, dict):\n        _cache = {}\n    return _cache\n\n\ndef _save():\n    try:\n        if _web():\n            import js\n\n            js.localStorage.setItem(_storage_key(), json.dumps(_cache))\n        else:\n            with open(_path(), \"w\") as f:\n                json.dump(_cache, f, indent=1)\n                f.write(\"\\n\")\n        return True\n    except Exception as err:                               # noqa: BLE001\n        _warn(\"save your data\", err)\n        return False\n\n\ndef setData(key, value):\n    \"\"\"Remember something under a name. Returns True if it was written.\"\"\"\n    try:\n        json.dumps(value)\n    except (TypeError, ValueError):\n        raise TypeError(\n            f\"setData({key!r}, ...) can only save numbers, text, True/False, \"\n            f\"None, and lists or dicts of those \u2014 not {type(value).__name__}. \"\n            f\"A game object cannot be saved; save what you need from it.\"\n        ) from None\n\n    _load()[str(key)] = value\n    return _save()\n\n\ndef getData(key, default=None):\n    \"\"\"What was remembered under that name, or `default` if nothing was.\"\"\"\n    return _load().get(str(key), default)\n\n\ndef _reset_for_tests():\n    \"\"\"Forget the cache, so a test can point at a different folder.\"\"\"\n    global _cache, _complained\n    _cache = None\n    _complained = False\n", "timers.py": "\"\"\"Kaplay's own timers (wait/loop) \u2014 tied to the frame loop, so they\npause and resume with the game, unlike Python's own time functions.\"\"\"\nfrom .callutil import call_flexible\n\n\nclass _Timer:\n    def __init__(self, delay, fn, repeat):\n        self.delay = delay\n        self.fn = fn\n        self.repeat = repeat\n        self.elapsed = 0.0\n        self.dead = False\n\n    def cancel(self):\n        self.dead = True\n\n\ndef _lerp(a, b, t):\n    \"\"\"Blend two values. Numbers, Vec2s and colour tuples all tween.\n\n    A tween is almost always moving one of those three, and requiring a\n    student to know which is which would be a worse lesson than the tween.\n    \"\"\"\n    from .vec2 import Vec2\n\n    if isinstance(a, Vec2) or isinstance(b, Vec2):\n        return Vec2(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t)\n    if isinstance(a, (tuple, list)):\n        return type(a)(x + (y - x) * t for x, y in zip(a, b))\n    return a + (b - a) * t\n\n\nclass Tween:\n    \"\"\"What `tween()` hands back: a handle on something still happening.\n\n    `.then(fn)` runs something after it, `.cancel()` stops it where it is,\n    `.finish()` jumps it to the end, and `.paused` holds it. All four are\n    Kaplay's own names, so its documentation applies.\n    \"\"\"\n\n    def __init__(self, start, end, duration, setter, ease):\n        self.start = start\n        self.end = end\n        self.duration = float(duration)\n        self.setter = setter\n        self.ease = ease\n        self.elapsed = 0.0\n        self.paused = False\n        self.dead = False\n        self._ends = []\n\n    def onEnd(self, fn):\n        self._ends.append(fn)\n        return self\n\n    #: Kaplay spells this `then`, and it chains.\n    then = onEnd\n\n    def cancel(self):\n        \"\"\"Stop it where it is. Nothing further is set and onEnd never runs.\"\"\"\n        self.dead = True\n\n    def finish(self):\n        \"\"\"Jump straight to the end value, and run the onEnd handlers.\"\"\"\n        if self.dead:\n            return\n        self.dead = True\n        self.setter(self.end)\n        self._fire()\n\n    def _fire(self):\n        for fn in self._ends:\n            call_flexible(fn)\n\n    def update(self, dt):\n        if self.dead or self.paused:\n            return\n        self.elapsed += dt\n        # A zero-length tween is an instant set, not a division by zero.\n        progress = 1.0 if self.duration <= 0 else min(self.elapsed / self.duration, 1.0)\n        self.setter(_lerp(self.start, self.end, self.ease(progress)))\n        if progress >= 1.0:\n            self.dead = True\n            # Land exactly on the end value. An eased curve can return\n            # 0.9999999 at t=1, and a sprite that stops one pixel short of\n            # where it was told to go is a bug nobody can see but everybody\n            # can feel.\n            self.setter(self.end)\n            self._fire()\n\n\nclass TimerManager:\n    def __init__(self):\n        self._timers = []\n        self._tweens = []\n\n    def wait(self, seconds, fn):\n        t = _Timer(seconds, fn, repeat=False)\n        self._timers.append(t)\n        return t\n\n    def loop(self, seconds, fn):\n        t = _Timer(seconds, fn, repeat=True)\n        self._timers.append(t)\n        return t\n\n    def tween(self, start, end, duration, setter, ease=None):\n        from .easings import easings as _easings\n\n        t = Tween(start, end, duration, setter, ease or _easings.linear)\n        self._tweens.append(t)\n        return t\n\n    def update(self, dt):\n        for t in list(self._timers):\n            if t.dead:\n                continue\n            t.elapsed += dt\n            if t.elapsed >= t.delay:\n                t.elapsed -= t.delay\n                if t.repeat:\n                    call_flexible(t.fn)\n                else:\n                    t.dead = True\n                    call_flexible(t.fn)\n        self._timers = [t for t in self._timers if not t.dead]\n\n        for t in list(self._tweens):\n            t.update(dt)\n        self._tweens = [t for t in self._tweens if not t.dead]\n\n    def clear(self):\n        self._timers.clear()\n        self._tweens.clear()\n\n\ndef wait(seconds, fn):\n    from .engine import current_engine\n    return current_engine().timers.wait(seconds, fn)\n\n\ndef loop(seconds, fn):\n    from .engine import current_engine\n    return current_engine().timers.loop(seconds, fn)\n", "vec2.py": "\"\"\"2D vector, matching Kaplay's vec2().\"\"\"\nfrom __future__ import annotations\nimport math\n\n\nclass Vec2:\n    __slots__ = (\"x\", \"y\")\n\n    def __init__(self, x=0.0, y=0.0):\n        self.x = float(x)\n        self.y = float(y)\n\n    def __repr__(self):\n        return f\"vec2({self.x:g}, {self.y:g})\"\n\n    def __iter__(self):\n        yield self.x\n        yield self.y\n\n    def __eq__(self, other):\n        if isinstance(other, Vec2):\n            return self.x == other.x and self.y == other.y\n        return NotImplemented\n\n    def __add__(self, other):\n        other = _coerce(other)\n        return Vec2(self.x + other.x, self.y + other.y)\n\n    def __sub__(self, other):\n        other = _coerce(other)\n        return Vec2(self.x - other.x, self.y - other.y)\n\n    def __mul__(self, scalar):\n        if isinstance(scalar, Vec2):\n            return Vec2(self.x * scalar.x, self.y * scalar.y)\n        return Vec2(self.x * scalar, self.y * scalar)\n\n    __rmul__ = __mul__\n\n    def __truediv__(self, scalar):\n        if isinstance(scalar, Vec2):\n            return Vec2(self.x / scalar.x, self.y / scalar.y)\n        return Vec2(self.x / scalar, self.y / scalar)\n\n    def __neg__(self):\n        return Vec2(-self.x, -self.y)\n\n    # Kaplay-style methods (camelCase, called as .sub()/.add()/.scale() too)\n    def add(self, other):\n        return self + other\n\n    def sub(self, other):\n        return self - other\n\n    def scale(self, s):\n        return self * s\n\n    def dot(self, other):\n        other = _coerce(other)\n        return self.x * other.x + self.y * other.y\n\n    def dist(self, other):\n        other = _coerce(other)\n        return math.hypot(self.x - other.x, self.y - other.y)\n\n    def len(self):\n        return math.hypot(self.x, self.y)\n\n    def unit(self):\n        length = self.len()\n        if length == 0:\n            return Vec2(0, 0)\n        return Vec2(self.x / length, self.y / length)\n\n    @classmethod\n    def fromAngle(cls, degrees):\n        \"\"\"A unit vector pointing `degrees` clockwise from the +x axis.\n\n        The partner to `rotate()`: an object at `angle` is facing\n        `Vec2.fromAngle(obj.angle)`, so thrusting a ship forward is\n\n            player.move(Vec2.fromAngle(player.angle) * SPEED)\n\n        rather than trigonometry in the middle of a lesson. Clockwise for the\n        same reason rotate() is \u2014 the screen's y axis points down \u2014 and it is\n        the exact inverse of `.angle()`, which is checked in tests/test_rotate.py.\n        \"\"\"\n        rad = math.radians(degrees)\n        return cls(math.cos(rad), math.sin(rad))\n\n    def angle(self, other=None):\n        if other is None:\n            return math.degrees(math.atan2(self.y, self.x))\n        other = _coerce(other)\n        return math.degrees(math.atan2(other.y - self.y, other.x - self.x))\n\n    def lerp(self, other, t):\n        other = _coerce(other)\n        return Vec2(self.x + (other.x - self.x) * t, self.y + (other.y - self.y) * t)\n\n    def clone(self):\n        return Vec2(self.x, self.y)\n\n    def to_tuple(self):\n        return (self.x, self.y)\n\n\ndef _coerce(v):\n    if isinstance(v, Vec2):\n        return v\n    if isinstance(v, (tuple, list)) and len(v) == 2:\n        return Vec2(v[0], v[1])\n    if isinstance(v, (int, float)):\n        return Vec2(v, v)\n    raise TypeError(f\"expected vec2-like, got {v!r}\")\n\n\n_UNSET = object()\n\n\ndef vec2(x=0.0, y=_UNSET):\n    \"\"\"KAPLAY's vec2(x, y). Also accepts vec2(vec2), vec2((x, y)), and vec2(n) for (n, n).\"\"\"\n    if isinstance(x, Vec2):\n        return Vec2(x.x, x.y)\n    if isinstance(x, (tuple, list)) and len(x) == 2:\n        return Vec2(x[0], x[1])\n    if y is _UNSET:\n        # single number: vec2(n) -> (n, n)\n        return Vec2(x, x)\n    return Vec2(x, y)\n", "webbuild.py": "#!/usr/bin/env python3\n\"\"\"Turn a kaypy game into a web page, in one command.\n\n    kaypy web game.py          (or: python webbuild.py game.py, in a checkout)\n\nThe result is **one HTML file**. Double-click it and the game plays: no\nserver, nothing installed, nothing unzipped. Upload that single file to\nitch.io, email it, put it on a school share \u2014 it is the whole game.\n\n    kaypy web game.py\n    -> web_build/game.html   (420 KB, say)\n\nWHAT IS INSIDE IT\n\nThe engine, the program, and every picture and sound the script names, all\ninlined. The script is read rather than run to work out which assets it uses,\nso nothing is carried that the game never loads.\n\nPyodide brings a Python interpreter and an in-memory filesystem, so the page\nwrites the engine and the assets into that filesystem as real files before the\nprogram starts. `import kaypy` is then an ordinary import and\n`pygame.image.load(\"images/bean.png\")` opens an ordinary file \u2014 which is why\nthe program goes in byte for byte, with no paths rewritten. The page itself is\nkaypy/web_page.html; it is worth reading if you want the details.\n\nTHE ONE THING IT FETCHES\n\nPyodide and pygame-ce, from a CDN, on first run. So the first load of a built\ngame wants an internet connection and takes a few seconds while Python starts;\nthe browser caches both afterwards. pygame-ce cannot be embedded even in\nprinciple \u2014 it is a compiled C extension and has to be the interpreter's own\nbuild of it.\n\nWHAT THIS REPLACED\n\nUntil now this ran pygbag, which produces a *folder*: an index.html that\nfetches a .apk archive at run time, plus a tarball and a favicon. That works\nwhen a web server is serving it, and not at all when someone double-clicks the\nindex.html, because a file:// page is not allowed to read the file next to it.\nSo a student who built a game could not open their own game without first\nstarting a web server.\n\nThree dependencies went with it: pygbag itself, ffmpeg (pygbag's build step\nrejects .wav outright, so every sound had to be converted to .ogg first), and\na build-time download of a WASM runtime from pygame-web.github.io.\n\nUseful flags, none of them usually needed:\n\n    --serve         also start a local server and print a URL, for testing\n                    across a network or in a browser that dislikes file://\n    --port 9000     which port to serve on (default: 8000)\n    --assets a b    carry these too, for files the script doesn't name\n                    outright (a path built at runtime, say)\n    --out FILE      write somewhere other than web_build/<name>.html\n    --title \"...\"   the browser tab's title (default: the script's name)\n\"\"\"\nfrom __future__ import annotations\nimport argparse\nimport ast\nimport base64\nimport json\nimport re\nimport socket\nimport subprocess\nimport sys\nfrom pathlib import Path\n\n# Where the engine itself lives. Under `pip install kaypy` this is inside\n# site-packages, not a repo checkout, which is why it is resolved from this\n# module rather than from a project directory.\nPKG_DIR = Path(__file__).resolve().parent\nPAGE_TEMPLATE = PKG_DIR / \"web_page.html\"\n\nPYODIDE_CDN = \"https://cdn.jsdelivr.net/pyodide/v314.0.6/full/\"\n\n# What counts as an asset worth carrying when it shows up as a string in the\n# game script.\nASSET_SUFFIXES = {\n    \".png\", \".jpg\", \".jpeg\", \".gif\", \".bmp\", \".webp\",\n    \".wav\", \".ogg\", \".mp3\", \".flac\",\n    \".ttf\", \".otf\", \".json\",\n}\n\n# Files inside the package that the browser has no use for. `starter/` is what\n# `kaypy new` hands a desktop user and would otherwise add megabytes of sprites\n# to every build, whether or not the game loads any of them.\nSKIP_DIRS = {\"starter\", \"__pycache__\"}\n\n\ndef default_out_file(stem: str) -> Path:\n    return Path.cwd() / \"web_build\" / (stem + \".html\")\n\n\n# ---------------------------------------------------------------- assets\n\ndef find_assets(game_script: Path) -> list[str]:\n    \"\"\"Every asset the script names, as the script spells it.\n\n    Reads the file rather than running it, and picks up any string literal\n    that looks like an asset path \u2014 which covers loadSprite's single path, its\n    list-of-frames form, loadSpriteAtlas's sheet and loadSound, without this\n    needing to know about any of them. Paths are kept exactly as written\n    (\"images/bean.png\", not an absolute path), because that spelling is what\n    the script passes to loadSprite at run time, and the copy has to land\n    where the script will look for it.\n    \"\"\"\n    try:\n        tree = ast.parse(game_script.read_text(), filename=str(game_script))\n    except SyntaxError as exc:\n        raise SystemExit(f\"{game_script} doesn't parse as Python: {exc}\")\n\n    base = game_script.parent\n    found: list[str] = []\n    for node in ast.walk(tree):\n        if not (isinstance(node, ast.Constant) and isinstance(node.value, str)):\n            continue\n        spelled = node.value\n        if Path(spelled).suffix.lower() not in ASSET_SUFFIXES:\n            continue\n        if spelled in found:\n            continue\n        if not (base / spelled).is_file():\n            continue\n        if \"..\" in Path(spelled).parts or Path(spelled).is_absolute():\n            print(f\"note: skipping {spelled} \u2014 only paths inside the script's own \"\n                  f\"folder can be carried; pass it with --assets if you need it\")\n            continue\n        found.append(spelled)\n    return found\n\n\n# ------------------------------------------------------------- the engine\n\ndef engine_files() -> dict[str, str]:\n    \"\"\"The kaypy package, as {path inside the package: source}.\n\n    Text, not bytes: every file in it is Python. The page writes each one\n    into Pyodide's filesystem so that a traceback through the engine names\n    kaypy/engine.py and a line number that exists, rather than pointing at\n    some string that was exec'd.\n    \"\"\"\n    files: dict[str, str] = {}\n    for path in sorted(PKG_DIR.rglob(\"*.py\")):\n        rel = path.relative_to(PKG_DIR)\n        if set(rel.parts) & SKIP_DIRS:\n            continue\n        files[str(rel).replace(\"\\\\\", \"/\")] = path.read_text()\n    return files\n\n\n# ------------------------------------------------------------- the page\n\ndef _js(value) -> str:\n    \"\"\"A JavaScript literal that cannot end the <script> block it sits in.\n\n    The HTML parser stops a script block at the first `<\/script`, wherever it\n    appears \u2014 inside a string literal, inside a comment, anywhere. It does not\n    know it is reading JavaScript. `<\\\\/` is identical to `<\/` in JavaScript\n    and invisible to the parser, so escaping it costs nothing and removes a\n    whole class of failure: a game whose engine silently spills onto the page\n    as visible text.\n    \"\"\"\n    return json.dumps(value).replace(\"<\/\", \"<\\\\/\")\n\n\ndef build_page(game_script: Path, extra_assets: list[Path], title: str | None,\n               size: tuple[int, int] = (800, 600)) -> tuple[str, list[str]]:\n    \"\"\"The whole game, as one HTML document.\"\"\"\n    if not PAGE_TEMPLATE.is_file():\n        raise SystemExit(\n            f\"the page template is missing from the installed package \"\n            f\"({PAGE_TEMPLATE}). A broken install \u2014 try `pip install \"\n            f\"--force-reinstall kaypy`.\"\n        )\n\n    used = find_assets(game_script)\n    assets: dict[str, str] = {}\n    for spelled in used:\n        assets[spelled] = base64.b64encode(\n            (game_script.parent / spelled).read_bytes()).decode(\"ascii\")\n\n    for src in extra_assets:\n        if not src.exists():\n            print(f\"warning: --assets path {src} does not exist, skipping\")\n            continue\n        for path in ([src] if src.is_file() else sorted(p for p in src.rglob(\"*\") if p.is_file())):\n            rel = path.name if src.is_file() else str(\n                Path(src.name) / path.relative_to(src)).replace(\"\\\\\", \"/\")\n            assets[rel] = base64.b64encode(path.read_bytes()).decode(\"ascii\")\n            if rel not in used:\n                used.append(rel)\n\n    slots = {\n        \"__TITLE__\": (title or game_script.stem).replace(\"&\", \"&amp;\")\n                                                .replace(\"<\", \"&lt;\")\n                                                .replace(\">\", \"&gt;\"),\n        \"__WIDTH__\": str(size[0]),\n        \"__HEIGHT__\": str(size[1]),\n        \"__PYODIDE__\": PYODIDE_CDN,\n        \"__ENGINE__\": _js(engine_files()),\n        \"__ASSETS__\": _js(assets),\n        \"__PROGRAM__\": _js(game_script.read_text()),\n    }\n\n    page = PAGE_TEMPLATE.read_text()\n    missing = [name for name in slots if name not in page]\n    if missing:\n        raise SystemExit(\"the page template has no %s slot \u2014 \"\n                         \"kaypy/web_page.html and this file disagree.\"\n                         % \", \".join(missing))\n\n    # ONE pass, not one replace() per slot.\n    #\n    # The engine carries this very file, and this very file contains the\n    # literal text \"__ASSETS__\" a few lines up. Filling the slots one at a\n    # time put the engine in first and then went looking for \"__ASSETS__\"\n    # again \u2014 finding the mention inside webbuild.py's own source and\n    # replacing it with the game's assets, halfway through a Python string\n    # inside a JSON string. The page still looked plausible and the JSON no\n    # longer parsed.\n    #\n    # A single pass cannot do that: what goes in is never looked at again.\n    return re.sub(\"|\".join(slots), lambda m: slots[m.group(0)], page), used\n\n\n# Every name that starts the engine. One, today \u2014 but the set stays, and so\n# does the test that compares it against what the package exports.\n#\n# A name missing here does not fail loudly: the call simply is not recognised,\n# the export falls back to 800x600, and the build reports success. The wrong\n# canvas turns up on itch.io. That was nearly shipped once, when kaypy() was\n# added and this still said kaplay, so the guard is worth more than the line\n# it saves.\nINIT_NAMES = frozenset({\"kaypy\"})\n\n\ndef read_size(game_script: Path) -> tuple[int, int]:\n    \"\"\"The width and height the script asks kaypy() for.\n\n    Only so the canvas starts at the right size instead of resizing visibly on\n    the first frame. Read off the syntax tree, never run; anything it cannot\n    work out (a variable, a computed value) falls back to kaypy's own default,\n    which is what the engine would use anyway.\n    \"\"\"\n    width, height = 800, 600\n    try:\n        tree = ast.parse(game_script.read_text())\n    except SyntaxError:\n        return width, height\n    for node in ast.walk(tree):\n        if (isinstance(node, ast.Call) and isinstance(node.func, ast.Name)\n                and node.func.id in INIT_NAMES):\n            for kw in node.keywords:\n                if isinstance(kw.value, ast.Constant) and isinstance(kw.value.value, int):\n                    if kw.arg == \"width\":\n                        width = kw.value.value\n                    elif kw.arg == \"height\":\n                        height = kw.value.value\n    return width, height\n\n\n# ---------------------------------------------------------------- serve\n\ndef pick_port(preferred: int) -> int:\n    for port in range(preferred, preferred + 10):\n        with socket.socket() as s:\n            try:\n                s.bind((\"127.0.0.1\", port))\n                return port\n            except OSError:\n                continue\n    raise SystemExit(f\"ports {preferred}-{preferred + 9} are all busy \u2014 pass --port\")\n\n\ndef serve(page: Path, preferred_port: int):\n    \"\"\"Serve the built file, for the cases where opening it directly won't do.\n\n    Opening the file is the normal way \u2014 it is one document and it fetches\n    nothing but Python. A server is still worth having for two cases: trying\n    the game on a phone or another machine on the same network, and browsers\n    or extensions configured to treat file:// pages harshly.\n    \"\"\"\n    port = pick_port(preferred_port)\n    print(\"\\n\" + \"=\" * 62)\n    print(f\"  Your game is running at:  http://127.0.0.1:{port}/{page.name}\")\n    print(\"=\" * 62)\n    print(\"\\nPress Ctrl-C here when you're done.\\n\")\n    try:\n        subprocess.run(\n            [sys.executable, \"-m\", \"http.server\", str(port),\n             \"--directory\", str(page.parent)],\n            check=False,\n        )\n    except KeyboardInterrupt:\n        pass\n    print(f\"\\nServer stopped. Your game is still at:\\n    {page}\")\n\n\n# ----------------------------------------------------------------- main\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(\n        description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter\n    )\n    ap.add_argument(\"game_script\", type=Path, help=\"the kaypy game .py file to put on the web\")\n    ap.add_argument(\"--out\", type=Path, default=None,\n                    help=\"output file [default: web_build/<game script name>.html]\")\n    ap.add_argument(\"--title\", default=None, help=\"the browser tab's title\")\n    ap.add_argument(\"--assets\", nargs=\"*\", type=Path, default=[],\n                    help=\"extra files/folders to carry, for assets the script doesn't spell out\")\n    ap.add_argument(\"--serve\", action=\"store_true\",\n                    help=\"also start a local server and print a URL\")\n    ap.add_argument(\"--port\", type=int, default=8000,\n                    help=\"port for --serve [default: 8000]\")\n    args = ap.parse_args(argv)\n\n    game_script = args.game_script.resolve()\n    if not game_script.is_file():\n        raise SystemExit(f\"no such game script: {game_script}\")\n\n    out = (args.out or default_out_file(game_script.stem)).resolve()\n    out.parent.mkdir(parents=True, exist_ok=True)\n\n    page, used = build_page(game_script, [p.resolve() for p in args.assets],\n                            args.title, read_size(game_script))\n    out.write_text(page)\n\n    print(f\"Built {game_script.name} as one file:\\n    {out}\")\n    print(f\"    {len(page) / 1024:.0f} KB, including {len(used)} asset\"\n          f\"{'' if len(used) == 1 else 's'}\")\n    if used:\n        print(f\"    carried: {', '.join(used)}\")\n    else:\n        print(\"    no asset files named in the script \u2014 if it does load some, \"\n              \"pass --assets\")\n\n    if args.serve:\n        serve(out, args.port)\n        return 0\n\n    print(\"\\nDouble-click it to play. The first run needs the internet, for\")\n    print(\"Python itself; after that the browser has it cached.\")\n    print(\"To publish: upload that one file to itch.io as an HTML project.\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n", "webpanel.py": "\"\"\"The panel, as real HTML over the canvas.\n\nOnly imported in a browser \u2014 panel.py picks between this and its own pygame\ndrawing by looking at sys.platform. On a desktop this module is never loaded\nat all, so `import js` at the top would be a crash there; it is imported\ninside the class for that reason.\n\nWHY BOTHER, WHEN THE PYGAME ONE ALREADY WORKS\n\nBecause everything a browser gives a panel for free is exactly what a panel\nneeds and a canvas cannot do:\n\n    text you can select, and a screen reader can read\n    a real <a>, which middle-clicks and opens in a new tab\n    a real <input>, with the phone keyboard, autocorrect off, and paste\n    text that reflows and stays sharp when the page is zoomed\n\nDrawn on a canvas, every one of those is gone. For a message in a game that\nwould be a fair trade; for a question a student has to answer, and a link a\nvisitor is meant to follow, it is not.\n\nWHERE IT ATTACHES\n\nOver the canvas, positioned with fixed coordinates taken from the canvas's\nown bounding box, and appended to <body> rather than next to the canvas.\n\nThat is deliberate. kaypy runs in three different pages \u2014 its own export,\nPyIDE, and the site's playground \u2014 and they agree on exactly one thing: a\n<canvas id=\"canvas\">, because SDL insists on that id. They do not agree on\nwhat is around it, and PyIDE *replaces* the canvas element on every run. An\noverlay parented to the canvas, or to whatever happens to contain it, would\nbe at the mercy of all that. A fixed box on <body>, measured from the canvas\neach time it is shown, is not.\n\"\"\"\nfrom __future__ import annotations\n\nCSS = \"\"\"\n.kaypy-panel-veil {\n  position: fixed; z-index: 2147483000;\n  display: flex; align-items: center; justify-content: center;\n  background: rgba(0, 0, 0, .55);\n  font: 16px/1.5 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n}\n.kaypy-panel {\n  background: #fafafc; color: #141821;\n  border-radius: 12px; padding: 20px 22px;\n  width: min(70%, 520px); max-height: 80%; overflow-y: auto;\n  box-shadow: 0 10px 40px rgba(0, 0, 0, .45);\n}\n.kaypy-panel p { margin: 0 0 14px; white-space: pre-wrap; }\n.kaypy-panel button.kaypy-choice {\n  display: block; width: 100%; text-align: left;\n  font: inherit; margin: 0 0 8px; padding: 9px 12px;\n  border: 2px solid #c8ced6; border-radius: 7px;\n  background: #f0f2f6; color: inherit; cursor: pointer;\n}\n.kaypy-panel button.kaypy-choice:hover,\n.kaypy-panel button.kaypy-choice:focus-visible {\n  border-color: #50963c; background: #e1eedd; outline: none;\n}\n.kaypy-panel input.kaypy-text {\n  width: 100%; font: inherit; padding: 9px 12px; margin-bottom: 10px;\n  border: 2px solid #7890aa; border-radius: 7px; background: #fff; color: inherit;\n}\n.kaypy-panel .kaypy-go {\n  font: inherit; font-weight: 600; padding: 9px 18px;\n  border: 0; border-radius: 7px; cursor: pointer;\n  background: #50963c; color: #fff;\n}\n.kaypy-panel a { color: #2b5fc8; }\n.kaypy-panel .kaypy-hint { margin: 12px 0 0; font-size: 13px; color: #6b7280; }\n\"\"\"\n\n\nclass DomView:\n    \"\"\"A panel built out of real elements.\"\"\"\n\n    def __init__(self, panel):\n        import js                                              # noqa: PLC0415\n\n        self.js = js\n        self.panel = panel\n        self.veil = None\n        self._build()\n\n    # ---- building --------------------------------------------------------\n\n    def _build(self):\n        js = self.js\n        doc = js.document\n        p = self.panel\n\n        self._install_css()\n\n        veil = doc.createElement(\"div\")\n        veil.className = \"kaypy-panel-veil\"\n        self._place(veil)\n\n        box = doc.createElement(\"div\")\n        box.className = \"kaypy-panel\"\n        box.setAttribu
