<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Dash</title>
<!--
  A kaypy game, as one file.

  Everything the game needs is in this document: the engine, the program, and
  every picture and sound it loads. Nothing is fetched except Python itself.
  Open it by double-clicking; no server, no install.

  HOW IT FITS IN ONE FILE

  Below are four JavaScript strings — the engine as JSON, the assets as
  base64, the program, and the page's own boot code. Pyodide brings a Python
  interpreter AND an in-memory filesystem, so the boot code writes those
  strings into that filesystem as real files. By the time the program runs
  there is a package on sys.path and a directory of PNGs, none of which exist
  on any disk. `import kaypy` is an ordinary import and
  `pygame.image.load("images/bean.png")` opens an ordinary file.

  That is why the program below is byte for byte what was written. Nothing is
  rewritten to point at inlined data, because the data is already sitting at
  the path the program names.

  WHAT IS NOT IN HERE

  Pyodide and pygame-ce, both from a CDN. So the first run needs the internet
  and takes a few seconds; the browser caches them afterwards. pygame-ce could
  not be embedded even in principle — it is a compiled C extension and has to
  be the interpreter's own build of it.
-->
<style>

  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { text-align: center; padding: 16px; max-width: 100%; }
  canvas { max-width: 100%; max-height: 90vh; background: #000;
           border-radius: 6px; image-rendering: pixelated; }
  #status { padding: 24px; color: var(--dim); }
  /* Only ever shown when the game has actually failed. Nothing else appears
     below the canvas — a published game should be the game and nothing else.
     See the note by setStdout() for where print() goes instead. */
  #error { display: none; white-space: pre-wrap; text-align: left;
           margin: 16px auto 0; padding: 16px; border-radius: 6px;
           font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
           color: var(--err-fg); background: var(--err-bg);
           max-width: 90vw; max-height: 40vh; overflow: auto; }
</style>

<script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
<script>
var ENGINE = {"__init__.py": "\"\"\"from kaypy import * \u2014 every name here is KAPLAY's own name, in\nKAPLAY's own order, with KAPLAY's own arguments. The KAPLAY documentation\nand every KAPLAY example on the internet applies to what you write here;\nonly the language underneath (real, native Python, via pygame-ce) is new.\n\nkaypy is an independent project and is not affiliated with, endorsed by, or\nproduced by the KAPLAY team. It matches their API deliberately, because that\nis what makes their documentation useful to a Python class \u2014 but it is a\nseparate implementation, and its bugs are its own.\n\"\"\"\nfrom .vec2 import vec2, Vec2\nfrom .engine import Engine, current_engine, rand, randi, choose\nfrom .debugmod import debug\nfrom .easings import easings\nfrom .helpers import (time, destroy, destroyAll, isKeyDown, rgb, lerp,\n                      clamp, chance, wave, deg2rad, rad2deg,\n                      RED, GREEN, BLUE, YELLOW, MAGENTA, CYAN, WHITE, BLACK)\nfrom .level import addLevel, Level\nfrom .kaboom import addKaboom\n\n# ---- components ---------------------------------------------------------\nfrom .comps.pos import pos\nfrom .comps.sprite import sprite\nfrom .comps.shapes import rect, circle, text\nfrom .comps.area import area\nfrom .comps.body import body\nfrom .comps.transform import (anchor, scale, rotate, color, opacity, outline,\n                              z, fixed)\nfrom .comps.state import state\nfrom .comps.move import move, offscreen, tile\nfrom .comps.health import health\nfrom .comps.lifespan import lifespan\nfrom .comps.follow import follow\nfrom .comps.sentry import sentry\nfrom .raycast import raycast\n\n# ---- drawing straight to the screen, and remembering things -------------\nfrom .drawing import (drawRect, drawCircle, drawLine, drawLines, drawText,\n                      drawSprite)\nfrom .storage import setData, getData\nfrom .panel import say, ask, isShowing, close\nfrom .callutil import register_or_decorate\n\n__all__ = [\n    \"kaypy\",\n    \"loadSprite\", \"loadSpriteAtlas\", \"loadSound\",\n    \"setGravity\", \"setBackground\",\n    \"add\", \"get\", \"addLevel\", \"addKaboom\",\n    \"pos\", \"sprite\", \"rect\", \"circle\", \"text\", \"area\", \"body\",\n    \"anchor\", \"scale\", \"rotate\", \"color\", \"opacity\", \"outline\", \"z\", \"fixed\",\n    \"move\", \"offscreen\", \"tile\", \"state\", \"health\", \"lifespan\", \"follow\",\n    \"sentry\",\n    \"onUpdate\", \"onKeyDown\", \"onKeyPress\", \"onKeyRelease\", \"onClick\",\n    \"onMouseDown\", \"onMousePress\", \"onMouseRelease\", \"onMouseMove\",\n    \"isMouseDown\", \"isMousePressed\", \"isMouseReleased\", \"isMouseMoved\",\n    \"mouseDeltaPos\",\n    \"onDraw\", \"drawRect\", \"drawCircle\", \"drawLine\", \"drawLines\",\n    \"drawText\", \"drawSprite\",\n    \"setData\", \"getData\",\n    \"wait\", \"loop\", \"tween\", \"easings\", \"onCollide\",\n    \"scene\", \"go\",\n    \"width\", \"height\", \"center\", \"dt\", \"vec2\", \"Vec2\",\n    \"pause\", \"resume\", \"isPaused\",\n    \"say\", \"ask\", \"isShowing\", \"close\",\n    \"rand\", \"randi\", \"choose\", \"chance\", \"lerp\", \"clamp\", \"wave\",\n    \"time\", \"destroy\", \"destroyAll\", \"isKeyDown\", \"rgb\",\n    \"RED\", \"GREEN\", \"BLUE\", \"YELLOW\", \"MAGENTA\", \"CYAN\", \"WHITE\", \"BLACK\",\n    \"raycast\",\n    \"deg2rad\", \"rad2deg\",\n    \"mousePos\", \"toWorld\",\n    \"setCamPos\", \"setCamScale\", \"shake\",\n    \"play\",\n    \"debug\",\n    \"run\",\n]\n\n\ndef kaypy(width=800, height=600, background=(0, 0, 0), joystick=False):\n    \"\"\"Starts the engine. It has to come first, before anything else.\n\n    `joystick=True` puts a d-pad and two buttons on the screen for playing\n    with a thumb. They hold the arrow keys, `space` and `z`, so every game\n    already written works on a phone without changing. Pass a list to choose\n    what the two buttons send: `joystick=[\"space\", \"x\"]`.\n    \"\"\"\n    return Engine(width=width, height=height, background=background,\n                  joystick=joystick)\n\n\n\n# ---- loading -------------------------------------------------------------\n\ndef loadSprite(name, path, sliceX=1, sliceY=1, anims=None):\n    return current_engine().assets.loadSprite(name, path, sliceX=sliceX, sliceY=sliceY, anims=anims)\n\n\ndef loadSpriteAtlas(path, atlas):\n    return current_engine().assets.loadSpriteAtlas(path, atlas)\n\n\ndef loadSound(name, path):\n    return current_engine().assets.loadSound(name, path)\n\n\ndef setGravity(n):\n    current_engine().setGravity(n)\n\n\ndef setBackground(r=0, g=None, b=None):\n    \"\"\"The background colour, in any spelling rgb() accepts.\n\n    The engine method was widened first and this wrapper was not, so\n    setBackground(BLUE) still raised \"missing 2 required positional\n    arguments\" \u2014 a public function is only as wide as its narrowest layer.\n    \"\"\"\n    current_engine().setBackground(r, g, b)\n\n\n# ---- making things --------------------------------------------------------\n\ndef add(comp_list):\n    return current_engine().add(comp_list)\n\n\ndef get(tag):\n    return current_engine().get(tag)\n\n\n# ---- events ----------------------------------------------------------------\n\ndef onUpdate(*args):\n    \"\"\"onUpdate(fn) / onUpdate(tag, fn), or as a decorator:\n\n        @onUpdate                 # every frame\n        @onUpdate(\"enemy\")        # every frame, once per tagged object\n    \"\"\"\n    if len(args) == 2:\n        tag, fn = args\n        return register_or_decorate(fn, lambda f: current_engine().events.on_update(tag, f))\n    if len(args) == 1 and callable(args[0]):\n        return current_engine().events.on_update(args[0])\n    if len(args) == 1:\n        tag = args[0]\n        return register_or_decorate(None, lambda f: current_engine().events.on_update(tag, f))\n    raise TypeError(\"onUpdate() takes a function, or a tag and a function\")\n\n\ndef onKeyDown(key, fn=None):\n    return register_or_decorate(fn, lambda f: current_engine().events.on_key_down(key, f))\n\n\ndef onKeyPress(key, fn=None):\n    return register_or_decorate(fn, lambda f: current_engine().events.on_key_press(key, f))\n\n\ndef onKeyRelease(key, fn=None):\n    return register_or_decorate(fn, lambda f: current_engine().events.on_key_release(key, f))\n\n\ndef onClick(fn=None):\n    return register_or_decorate(fn, lambda f: current_engine().events.on_click(f))\n\n\n# ---- mouse ---------------------------------------------------------------\n#\n# Every one takes a button name, or leaves it out for the left one \u2014 which is\n# the button a student means nine times in ten, and the only one on a lot of\n# trackpads.\n\ndef onMouseDown(button=None, fn=None):\n    \"\"\"Every frame a mouse button is held.\"\"\"\n    if callable(button):                 # onMouseDown(fn) \u2014 left button\n        button, fn = None, button\n    return register_or_decorate(\n        fn, lambda f: current_engine().events.on_mouse_down(button, f))\n\n\ndef onMousePress(button=None, fn=None):\n    \"\"\"Once, when a mouse button goes down.\"\"\"\n    if callable(button):\n        button, fn = None, button\n    return register_or_decorate(\n        fn, lambda f: current_engine().events.on_mouse_press(button, f))\n\n\ndef onMouseRelease(button=None, fn=None):\n    \"\"\"Once, when a mouse button comes back up.\"\"\"\n    if callable(button):\n        button, fn = None, button\n    return register_or_decorate(\n        fn, lambda f: current_engine().events.on_mouse_release(button, f))\n\n\ndef onMouseMove(fn=None):\n    \"\"\"Whenever the mouse moves.\"\"\"\n    return register_or_decorate(\n        fn, lambda f: current_engine().events.on_mouse_move(f))\n\n\ndef isMouseDown(button=None):\n    \"\"\"Is that mouse button held down right now?\"\"\"\n    return current_engine().events.is_mouse_down(button)\n\n\ndef isMousePressed(button=None):\n    \"\"\"Did it go down this frame?\"\"\"\n    return current_engine().events.is_mouse_pressed(button)\n\n\ndef isMouseReleased(button=None):\n    \"\"\"Did it come up this frame?\"\"\"\n    return current_engine().events.is_mouse_released(button)\n\n\ndef isMouseMoved():\n    \"\"\"Did the mouse move this frame?\"\"\"\n    return current_engine().events.is_mouse_moved()\n\n\ndef mouseDeltaPos():\n    \"\"\"How far the mouse moved this frame, as a vec2.\"\"\"\n    dx, dy = current_engine().events.mouse_delta()\n    return Vec2(dx, dy)\n\n\ndef onDraw(fn=None):\n    \"\"\"Draw straight to the screen, after the game objects.\n\n    The only place drawRect(), drawLine(), drawText() and the rest will run \u2014\n    see kaypy/drawing.py for why.\n    \"\"\"\n    def register(f):\n        current_engine().events.draw_handlers.append(f)\n        return f\n\n    return register_or_decorate(fn, register)\n\n\ndef wait(seconds, fn=None):\n    return register_or_decorate(fn, lambda f: current_engine().timers.wait(seconds, f))\n\n\ndef loop(seconds, fn=None):\n    return register_or_decorate(fn, lambda f: current_engine().timers.loop(seconds, f))\n\n\ndef onCollide(tag_a, tag_b, fn=None):\n    \"\"\"Every time anything tagged `tag_a` touches anything tagged `tag_b`.\n\n        onCollide(\"bullet\", \"enemy\", lambda b, e: (b.destroy(), e.destroy()))\n\n        @onCollide(\"player\", \"spike\")\n        def hurt(player, spike):\n            go(\"gameover\")\n\n    The object-free form of `obj.onCollide(tag, fn)`, for when the pair\n    matters and neither object is one you are holding \u2014 bullets and enemies\n    that both appear and vanish while the game runs. The handler is given\n    both objects, in the order the tags were named.\n\n    Registered against objects as they appear, so it covers ones created\n    later, which is the whole reason to prefer it over wiring each bullet up\n    as it is made.\n    \"\"\"\n    from .callutil import register_or_decorate\n\n    def register(f):\n        current_engine().events.on_collide_tags(tag_a, tag_b, f)\n        return f\n\n    return register_or_decorate(fn, register)\n\n\ndef tween(start, end, duration, setter, ease=None):\n    \"\"\"Change a value smoothly over time.\n\n        tween(100, 600, 0.5, lambda x: setattr(box.pos, \"x\", x))\n        tween(1.0, 0.0, 1.0, fade).then(lambda: print(\"gone\"))\n        tween(box.pos, target, 0.8, move_box, easings.easeOutBounce)\n\n    Works on numbers, on vec2 positions and on colour tuples. The fifth\n    argument is the shape of the motion \u2014 see `easings`; without one it moves\n    at a flat rate, which is the one motion that looks like nothing.\n\n    Not a decorator, unlike the events: the function it takes is a setter that\n    receives each value along the way, not a handler that runs once.\n    \"\"\"\n    return current_engine().timers.tween(start, end, duration, setter, ease)\n\n\n# ---- scenes -----------------------------------------------------------------\n\ndef scene(name, fn=None):\n    \"\"\"scene(name, fn), or as a decorator:\n\n        @scene(\"game\")\n        def build_game(): ...\n    \"\"\"\n    def register(f):\n        current_engine().scene(name, f)\n        return f\n    return register_or_decorate(fn, register)\n\n\ndef go(name, *args):\n    current_engine().go(name, *args)\n\n\n# ---- useful values ------------------------------------------------------\n\ndef width():\n    return current_engine().width()\n\n\ndef height():\n    return current_engine().height()\n\n\ndef center():\n    return current_engine().center()\n\n\ndef dt():\n    return current_engine().dt()\n\n\n# ---- pause ---------------------------------------------------------------\n\ndef pause():\n    \"\"\"Freeze the game, leaving the picture up.\n\n    Timers, physics, collisions and every onUpdate stop. The frame is still\n    drawn, so the game sits there behind whatever you put on top of it, and\n    key handlers still run \u2014 which is what lets a pause menu un-pause itself.\n    \"\"\"\n    current_engine().pause()\n\n\ndef resume():\n    \"\"\"Start the game moving again.\"\"\"\n    current_engine().resume()\n\n\ndef isPaused():\n    \"\"\"Is the game frozen right now?\"\"\"\n    return current_engine().isPaused()\n\n\ndef mousePos():\n    return current_engine().mousePos()\n\n\ndef toWorld(pos_):\n    return current_engine().toWorld(pos_)\n\n\ndef setCamPos(pos_):\n    current_engine().setCamPos(pos_)\n\n\ndef setCamScale(n):\n    current_engine().setCamScale(n)\n\n\ndef shake(n=8):\n    current_engine().shake(n)\n\n\ndef play(name, loop=False, paused=False, volume=1.0):\n    from .engine import SoundHandle\n    engine = current_engine()\n    if name not in engine.assets.sounds:\n        raise KeyError(f\"no sound called {name!r} \u2014 loadSound(\\\"{name}\\\", ...) first\")\n    return SoundHandle(engine.assets.sounds[name], loop=loop, paused=paused, volume=volume)\n\n\ndef run():\n    \"\"\"Not part of the Kaplay API \u2014 the loop starts on its own once your\n    script finishes. Exposed only so 'kaypy run game.py'-style tooling\n    (or a script that wants to be explicit) has something to call.\"\"\"\n    current_engine().run()\n", "assets.py": "\"\"\"Sprite / sound loading: loadSprite, loadSpriteAtlas, loadSound.\n\nKaplay's own troubleshooting note applies here too: \"the sprite is\ninvisible but the game runs\" almost always means a bad path, and\n\"every frame is half one pose and half the next\" means sliceX doesn't\nmatch the sheet. We raise clear errors for the first and let the second\nhappen silently (cutting a rectangle of nothing without complaint),\nexactly as Kaplay's own guide describes.\n\"\"\"\nfrom __future__ import annotations\nimport os\nimport sys\nimport pygame\n\n\nclass SpriteAsset:\n    def __init__(self, frames, anims=None, frame_size=None):\n        self.frames = frames  # list[pygame.Surface]\n        self.anims = anims or {}  # name -> {\"from\",\"to\",\"speed\",\"loop\"} or int\n        self.frame_size = frame_size or (frames[0].get_width(), frames[0].get_height())\n\n\ndef _load_image(path):\n    if not os.path.isfile(path):\n        raise FileNotFoundError(\n            f\"loadSprite/loadSpriteAtlas: no such file {path!r} \u2014 \"\n            f\"check the path (the two sprite packs live in separate \"\n            f\"folders; a dungeon sprite is not under images/)\"\n        )\n    return pygame.image.load(path).convert_alpha()\n\n\ndef _slice_surface(surface, slice_x, slice_y):\n    w = surface.get_width() // slice_x\n    h = surface.get_height() // slice_y\n    frames = []\n    for row in range(slice_y):\n        for col in range(slice_x):\n            rect = pygame.Rect(col * w, row * h, w, h)\n            frame = pygame.Surface((w, h), pygame.SRCALPHA)\n            frame.blit(surface, (0, 0), rect)\n            frames.append(frame)\n    return frames, (w, h)\n\n\ndef _normalize_anims(anims):\n    out = {}\n    for name, spec in (anims or {}).items():\n        if isinstance(spec, int):\n            out[name] = {\"from\": spec, \"to\": spec, \"speed\": 1, \"loop\": False}\n        else:\n            out[name] = {\n                \"from\": spec.get(\"from\", 0),\n                \"to\": spec.get(\"to\", 0),\n                \"speed\": spec.get(\"speed\", 10),\n                \"loop\": spec.get(\"loop\", False),\n            }\n    return out\n\n\nclass AssetManager:\n    def __init__(self):\n        self.sprites: dict[str, SpriteAsset] = {}\n        self.sounds: dict[str, \"pygame.mixer.Sound\"] = {}\n        self._atlas_cache: dict[str, \"pygame.Surface\"] = {}\n\n    def loadSprite(self, name, path, sliceX=1, sliceY=1, anims=None):\n        if isinstance(path, (list, tuple)):\n            frames = [_load_image(p) for p in path]\n            frame_size = (frames[0].get_width(), frames[0].get_height())\n        else:\n            surface = _load_image(path)\n            if sliceX > 1 or sliceY > 1:\n                frames, frame_size = _slice_surface(surface, sliceX, sliceY)\n            else:\n                frames = [surface]\n                frame_size = (surface.get_width(), surface.get_height())\n        self.sprites[name] = SpriteAsset(frames, _normalize_anims(anims), frame_size)\n        return self.sprites[name]\n\n    def loadSpriteAtlas(self, path, atlas):\n        if path not in self._atlas_cache:\n            self._atlas_cache[path] = _load_image(path)\n        sheet = self._atlas_cache[path]\n        for name, spec in atlas.items():\n            x, y = spec[\"x\"], spec[\"y\"]\n            w, h = spec[\"width\"], spec[\"height\"]\n            region = pygame.Surface((w, h), pygame.SRCALPHA)\n            region.blit(sheet, (0, 0), pygame.Rect(x, y, w, h))\n            slice_x = spec.get(\"sliceX\", 1)\n            slice_y = spec.get(\"sliceY\", 1)\n            if slice_x > 1 or slice_y > 1:\n                frames, frame_size = _slice_surface(region, slice_x, slice_y)\n            else:\n                frames = [region]\n                frame_size = (w, h)\n            self.sprites[name] = SpriteAsset(\n                frames, _normalize_anims(spec.get(\"anims\")), frame_size\n            )\n        return self.sprites\n\n    def loadSound(self, name, path):\n        if sys.platform == \"emscripten\":\n            # If a sibling .ogg is sitting next to the .wav, prefer it in the\n            # browser, so a script never needs an if-web branch just to pick a\n            # file extension.\n            #\n            # Plain uncompressed PCM .wav \u2014 which is what every sound in the\n            # lessons is, and what most tools write by default \u2014 plays fine in\n            # the browser, so this is no longer something a game has to do.\n            # It used to be: the old pygbag build step rejected .wav outright,\n            # so `kaypy web` converted every one to .ogg with ffmpeg first.\n            # That is gone, along with the ffmpeg dependency. What remains is\n            # a preference, for the compressed formats that genuinely are\n            # chancy in a WASM SDL2-mixer (ADPCM, \u00b5-law, mp3): put an .ogg\n            # beside the .wav and the browser quietly gets the better one.\n            ogg_path = os.path.splitext(path)[0] + \".ogg\"\n            if os.path.isfile(ogg_path):\n                path = ogg_path\n        if not os.path.isfile(path):\n            raise FileNotFoundError(f\"loadSound: no such file {path!r}\")\n        try:\n            self.sounds[name] = pygame.mixer.Sound(path)\n        except pygame.error:\n            self.sounds[name] = None  # audio device unavailable (headless/CI)\n        return self.sounds[name]\n\n    def get_sprite(self, name) -> SpriteAsset:\n        if name not in self.sprites:\n            raise KeyError(\n                f\"no sprite called {name!r} \u2014 loadSprite(\\\"{name}\\\", ...) \"\n                f\"must run before it is used\"\n            )\n        return self.sprites[name]\n", "callutil.py": "\"\"\"Kaplay callbacks can ignore arguments they don't want: onKeyDown hands\nthe key that was pressed, but `lambda: ...` takes nothing and works\nanyway, exactly as `() => ...` does in JavaScript. If you *do* want the\nargument, `lambda key: ...` gets it.\"\"\"\nimport inspect\n\n_sig_cache = {}\n\n\ndef register_or_decorate(fn, register):\n    \"\"\"Let one event function serve as both a callback and a decorator.\n\n        onKeyPress(\"space\", jump)     # hand it a function\n        @onKeyPress(\"space\")          # or put it above one\n        def jump(): ...\n\n    Kaplay's own form is the first one, and it stays the form every\n    Kaplay example and doc page translates into directly. The second\n    exists because a lambda can only hold one expression, and working\n    around that teaches bad habits: `lambda: p.jump() if p.isGrounded()\n    else None` has an `else None` that does nothing and exists purely to\n    satisfy a conditional expression, and `lambda: setattr(p, \"pos\", v)`\n    reaches for setattr only because a lambda can't assign. With a\n    decorator, both are just ordinary indented code \u2014 and the handler\n    gets a name, so it shows up in tracebacks as `jump` rather than\n    `<lambda>`.\n\n    `register` does the actual work and returns the function; this only\n    decides whether to call it now or hand back something that will.\n    \"\"\"\n    if fn is not None:\n        return register(fn)\n\n    def decorator(f):\n        register(f)\n        return f          # leave the name bound to the function itself\n\n    return decorator\n\n\ndef call_flexible(fn, *args):\n    n = _sig_cache.get(fn)\n    if n is None:\n        try:\n            params = inspect.signature(fn).parameters.values()\n            has_varargs = any(p.kind == p.VAR_POSITIONAL for p in params)\n            n = len(args) if has_varargs else sum(\n                1 for p in params\n                if p.kind in (p.POSITIONAL_ONLY, p.POSITIONAL_OR_KEYWORD)\n            )\n        except (TypeError, ValueError):\n            n = len(args)\n        _sig_cache[fn] = n\n    return fn(*args[:n])\n", "camera.py": "\"\"\"The camera: where the world is looked at from, and how big it looks.\n\nTHE SCALE IS A VECTOR, NOT A NUMBER\n\n    setCamScale(2)                 twice as big, both ways\n    setCamScale(vec2(2, 0.4))      twice as wide and squashed flat\n\nA single number is the common case and stays the common case \u2014 it simply\nmeans the same amount on both axes. Two lets the world be stretched: a\nletterboxed cutscene, a squash as something lands, a deliberately wrong\naspect ratio for a dream sequence.\n\nKeeping one number internally and a second \"scaleY\" beside it was the other\noption, and it is the one that rots: every place that multiplies by the\nscale has to remember there are two of them, and the places that forget are\nthe ones nobody looks at \u2014 the debug boxes, the text size, the mouse\nposition. Storing a Vec2 means the type itself carries the reminder, and\nanything that does arithmetic on it gets both axes or fails loudly.\n\"\"\"\nfrom .vec2 import Vec2, vec2\n\n\ndef _as_scale(value):\n    \"\"\"A scale as a Vec2, from a number or a vec2.\"\"\"\n    if isinstance(value, Vec2):\n        s = Vec2(value.x, value.y)\n    elif isinstance(value, (tuple, list)) and len(value) == 2:\n        s = vec2(*value)\n    elif isinstance(value, (int, float)):\n        s = Vec2(value, value)\n    else:\n        raise TypeError(\n            \"setCamScale(%r) \u2014 the scale is a number, or a vec2 for a \"\n            \"different amount on each axis.\\n\"\n            \"    setCamScale(2)                 # twice as big\\n\"\n            \"    setCamScale(vec2(2, 0.4))      # wide and squashed\"\n            % (value,))\n    if s.x == 0 or s.y == 0:\n        raise ValueError(\n            \"setCamScale(%r) \u2014 a scale of zero makes the world infinitely \"\n            \"small, and everything after it divides by zero. Use a small \"\n            \"number instead.\" % (value,))\n    return s\n\n\nclass Camera:\n    def __init__(self, width, height):\n        self.width = width\n        self.height = height\n        self.pos = Vec2(width / 2, height / 2)\n        self.scale = Vec2(1.0, 1.0)\n        self.shake_amount = 0.0\n        self._frame_shake_offset = Vec2(0, 0)\n\n    def setPos(self, pos):\n        self.pos = Vec2(pos.x, pos.y)\n\n    def setScale(self, n):\n        self.scale = _as_scale(n)\n\n    def shake(self, amount=8):\n        self.shake_amount = amount\n\n    def begin_frame(self):\n        \"\"\"Called once per frame by the render system: decays shake and\n        freezes this frame's random offset so every object drawn this\n        frame shakes together.\"\"\"\n        if self.shake_amount <= 0:\n            self._frame_shake_offset = Vec2(0, 0)\n            return\n        import random\n        a = self.shake_amount\n        self._frame_shake_offset = Vec2(random.uniform(-a, a), random.uniform(-a, a))\n        self.shake_amount *= 0.9\n        if self.shake_amount < 0.2:\n            self.shake_amount = 0\n\n    def world_to_screen(self, world_pos: Vec2) -> Vec2:\n        center = Vec2(self.width / 2, self.height / 2)\n        # Vec2 * Vec2 multiplies componentwise, so this is the same line it\n        # was when the scale was a number \u2014 and it stretches correctly.\n        return (world_pos - self.pos) * self.scale + center + self._frame_shake_offset\n\n    def screen_to_world(self, screen_pos) -> Vec2:\n        if not isinstance(screen_pos, Vec2):\n            screen_pos = Vec2(screen_pos[0], screen_pos[1])\n        center = Vec2(self.width / 2, self.height / 2)\n        return (screen_pos - center) / self.scale + self.pos\n", "cli.py": "\"\"\"The `kaypy` command.\n\n    kaypy new mygame      make a folder with a working game and its assets\n    kaypy web game.py     build that game as a web page and serve it\n\nBoth exist because a pip install has no repo to stand in. `kaypy new` is\nwhat gets a student from `pip install kaypy` to something moving on\nscreen without hunting for sprite files, and `kaypy web` is the same\nbuild tool the checkout calls `webbuild.py`.\n\"\"\"\nfrom __future__ import annotations\nimport argparse\nimport shutil\nimport sys\nfrom pathlib import Path\n\nSTARTER = Path(__file__).resolve().parent / \"starter\"\n\n# ---------------------------------------------------------------- sounds\n# The three lesson sounds are 2.6 MB, and they used to sit inside the wheel.\n# That made every `pip install kaypy` anywhere in the world 1.36 MB, of which\n# 92 KB was the engine and the rest was mostly one background.wav \u2014 paid for\n# by everybody, used by the one lesson that plays audio.\n#\n# So they are fetched when a game folder is made, and the install stays small.\n# Everything a game needs to *run* still ships in the package: the starter\n# game, every sprite, the dungeon atlas. The starter game plays no sound at\n# all, so a failed fetch costs a student nothing until Lesson 8, and\n# `kaypy sounds` picks them up later.\nSOUNDS = (\"background.wav\", \"ding.wav\", \"screech.wav\")\nSOUND_URL = (\"https://raw.githubusercontent.com/sfranz2422/kaypy/\"\n             \"{ref}/examples/sounds/{name}\")\nSOUND_TIMEOUT = 30\n\n\ndef _sound_refs():\n    \"\"\"Which refs to fetch from, most specific first.\n\n    Pinning to the release tag means an old kaypy keeps fetching the assets it\n    was published with, rather than whatever main happens to hold. Both `v0.2.0`\n    and `0.2.0` are tried because the tag is whatever the GitHub release is\n    called, and the publish workflow accepts either \u2014 it compares\n    `${GITHUB_REF_NAME#v}` against pyproject's version, so the `v` is optional\n    there and would be easy to leave off here by accident.\n\n    `main` is last, and is what actually answers today for a version whose tag\n    does not exist. A miss costs one 404 and nothing else.\n    \"\"\"\n    try:\n        from importlib.metadata import version\n        v = version(\"kaypy\")\n        return [\"v\" + v, v, \"main\"]\n    except Exception:\n        return [\"main\"]\n\n\ndef fetch_sounds(dest: Path, quiet: bool = False):\n    \"\"\"Download the lesson sounds into dest/sounds/. Never raises.\n\n    Returns (fetched, missing) so the caller can say something useful. A\n    student on a school network that blocks GitHub gets a clear sentence and a\n    game that still runs, not a traceback.\n    \"\"\"\n    import urllib.error\n    import urllib.request\n\n    out = dest / \"sounds\"\n    out.mkdir(parents=True, exist_ok=True)\n    fetched, missing = [], []\n\n    for name in SOUNDS:\n        target = out / name\n        if target.is_file() and target.stat().st_size > 0:\n            fetched.append(name)\n            continue\n        for ref in _sound_refs():\n            try:\n                url = SOUND_URL.format(ref=ref, name=name)\n                with urllib.request.urlopen(url, timeout=SOUND_TIMEOUT) as r:\n                    data = r.read()\n                if not data:\n                    continue\n                # Write beside, then move: a half-written wav that looks like a\n                # real file is worse than no file, because the next run skips it.\n                tmp = target.with_suffix(target.suffix + \".part\")\n                tmp.write_bytes(data)\n                tmp.replace(target)\n                fetched.append(name)\n                break\n            except (urllib.error.URLError, OSError, ValueError):\n                continue\n        else:\n            missing.append(name)\n\n    if not quiet:\n        if fetched and not missing:\n            print(\"Fetched %d sounds (%.1f MB).\"\n                  % (len(fetched),\n                     sum((out / n).stat().st_size for n in fetched) / 1e6))\n        elif missing:\n            print(\"Could not fetch %s \u2014 no internet, or GitHub is blocked here.\"\n                  % \", \".join(missing))\n            print(\"The game still runs; it plays no sound. When you reach the \"\n                  \"audio lesson, run:  kaypy sounds \" + dest.name)\n    return fetched, missing\n\n\ndef cmd_new(args) -> int:\n    dest = Path(args.name).resolve()\n    if dest.exists() and any(dest.iterdir()):\n        print(f\"{dest} already exists and isn't empty \u2014 pick another name, \"\n              f\"or delete it first.\")\n        return 1\n    if not STARTER.is_dir():\n        print(\"this kaypy install has no starter files in it, which shouldn't \"\n              \"happen \u2014 reinstall, or copy a game from the project's examples/.\")\n        return 1\n\n    shutil.copytree(\n        STARTER, dest, dirs_exist_ok=True,\n        # `sounds` is listed for the benefit of a working copy, not a pip\n        # install: the wheel has no such directory, but a clone from before\n        # the sounds moved out still does, and copying 2.6 MB of it would\n        # quietly undo the point of fetching them.\n        ignore=shutil.ignore_patterns(\"__pycache__\", \"*.pyc\", \"sounds\"),\n    )\n\n    here = Path.cwd()\n    try:\n        shown = dest.relative_to(here)\n    except ValueError:\n        shown = dest\n\n    print(f\"Created {shown}/ \u2014 a game, and the sprites to build on.\\n\")\n    fetch_sounds(dest)\n    print(\"\\nTry it:\\n\")\n    print(f\"    cd {shown}\")\n    print(\"    python game.py\\n\")\n    print(\"Arrow keys to move, space to jump. Then open game.py and change it.\")\n    print(f\"To put it on the web instead:  kaypy web game.py\")\n    return 0\n\n\ndef cmd_sounds(args) -> int:\n    \"\"\"Fetch the lesson sounds into a game folder that hasn't got them.\n\n    Its own command because the fetch during `kaypy new` can fail for reasons\n    that have nothing to do with the student \u2014 a school network, a flaky\n    morning \u2014 and the answer to that should be one short command, not a\n    reinstall.\n    \"\"\"\n    dest = Path(args.folder).resolve()\n    if not dest.is_dir():\n        print(f\"No folder at {dest} \u2014 make one first with:  kaypy new \"\n              f\"{Path(args.folder).name}\")\n        return 1\n    _, missing = fetch_sounds(dest)\n    return 1 if missing else 0\n\n\ndef cmd_web(args) -> int:\n    from . import webbuild\n    # webbuild parses its own arguments, so hand it the ones meant for it.\n    sys.argv = [\"kaypy web\"] + args.rest\n    webbuild.main()\n    return 0\n\n\ndef main(argv=None) -> int:\n    parser = argparse.ArgumentParser(\n        prog=\"kaypy\",\n        description=\"kaypy \u2014 a real-Python game engine with Kaplay's API.\",\n    )\n    sub = parser.add_subparsers(dest=\"command\")\n\n    p_new = sub.add_parser(\"new\", help=\"create a new game folder, ready to run\")\n    p_new.add_argument(\"name\", help=\"folder to create, e.g. mygame\")\n    p_new.set_defaults(func=cmd_new)\n\n    p_sounds = sub.add_parser(\n        \"sounds\", help=\"fetch the lesson sounds into an existing game folder\")\n    p_sounds.add_argument(\"folder\", nargs=\"?\", default=\".\",\n                          help=\"the game folder (default: this one)\")\n    p_sounds.set_defaults(func=cmd_sounds)\n\n    p_web = sub.add_parser(\n        \"web\", help=\"build a game as one self-contained HTML file\",\n        add_help=False,\n    )\n    p_web.add_argument(\"rest\", nargs=argparse.REMAINDER,\n                       help=\"the game file, plus any webbuild options\")\n    p_web.set_defaults(func=cmd_web)\n\n    args = parser.parse_args(argv)\n    if not getattr(args, \"command\", None):\n        parser.print_help()\n        return 1\n    return args.func(args)\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n", "comps/__init__.py": "", "comps/area.py": "\"\"\"area(): the collision box. Both objects in a collision need one \u2014\nan object without area() is invisible to collision, and that's the\nsingle most common reason a collision \"doesn't work\".\"\"\"\nfrom ..gameobj import Comp\n\n\nclass AreaComp(Comp):\n    id = \"area\"\n\n    def add(self, obj):\n        self._obj = obj\n\n    def get_rect(self):\n        from ..geometry import get_world_rect\n        return get_world_rect(self._obj)\n\n    def isHovering(self) -> bool:\n        from ..engine import current_engine\n        mx, my = current_engine().mousePos()\n        return self.get_rect().collidepoint(mx, my)\n\n\ndef area():\n    return AreaComp()\n", "comps/body.py": "\"\"\"body(): makes an object respond to physics. isStatic=True makes it a\nwall \u2014 solid, and never moved by anything. mass=n makes it heavy but\nstill pushable. Gives .jump(), .isGrounded(), .onGround().\"\"\"\nfrom ..gameobj import Comp\nfrom ..vec2 import Vec2\n\n\nclass BodyComp(Comp):\n    id = \"body\"\n\n    def __init__(self, isStatic=False, mass=1, jumpForce=800):\n        self.isStatic = isStatic\n        self.mass = mass\n        self.jumpForce = jumpForce\n        self.vel = Vec2(0, 0)\n        self._grounded = False\n        self._pending_grounded = False\n        self._ground_handlers = []\n\n    def add(self, obj):\n        self._obj = obj\n\n    def jump(self, force=None):\n        if force is None:\n            force = self.jumpForce\n        self.vel.y = -force\n        self._grounded = False\n\n    def isGrounded(self) -> bool:\n        return self._grounded\n\n    def onGround(self, fn=None):\n        from ..callutil import register_or_decorate\n\n        def register(f):\n            self._ground_handlers.append(f)\n            return f\n\n        return register_or_decorate(fn, register)\n\n    def _apply_grounded(self, value: bool):\n        was = self._grounded\n        self._grounded = value\n        if value and not was:\n            for fn in self._ground_handlers:\n                fn()\n\n\ndef body(isStatic=False, mass=1, jumpForce=800):\n    return BodyComp(isStatic=isStatic, mass=mass, jumpForce=jumpForce)\n", "comps/follow.py": "\"\"\"follow(obj): keep this object where another one is.\n\n    bar = add([rect(40, 6), pos(0, 0), color(220, 60, 60),\n               follow(enemy, offset=vec2(-4, -30))])\n\nA health bar over an enemy, a name over a player, an arrow pointing at the\nthing you are meant to go to next. The follower is placed on the target every\nframe, so it does not matter how the target moved \u2014 walked, jumped, fell,\ngot shoved by a collision, or was picked up and put somewhere by one line of\ncode. It is simply there.\n\n    pet = add([sprite(\"ghosty\"), pos(0, 0), follow(player, speed=180)])\n\nWith `speed`, it chases instead: it moves toward the target at that many\npixels per second and arrives when it arrives. That is the difference between\na health bar and a pet, and it is one keyword.\n\nWHY THIS RUNS AFTER PHYSICS AND ALMOST NOTHING ELSE DOES\n\nA component's update() runs before the physics step, which is right for\nnearly everything: you decide what an object is trying to do, and then the\nengine works out where everything actually ended up.\n\nA follower is the exception, because its whole job is to agree with where\nanother object ended up. Reading the target's position before physics reads\nlast frame's. Standing still that is invisible; on a player halfway through a\njump at 800 px/s it is thirteen pixels, so the health bar sits correct while\nthe player walks and slides off them the moment they jump. That is a bug\nwhich looks like a rendering problem, appears only sometimes, and is very\nhard to see in a position readout.\n\nSo follow() sets `wants_late`, and the engine gives it a second pass after\ncollision has finished. Nothing else in kaypy needs one, and a game with no\nfollowers never makes the pass at all.\n\nWHAT HAPPENS WHEN THE TARGET IS DESTROYED\n\nThe follower stops where it is, and goes on existing. It does not vanish and\nit does not fall back to the origin \u2014 either of which would be a mysterious\nthing to watch happen. If a health bar should die with its enemy, destroy it\nwhere the enemy is destroyed:\n\n    @enemy.onCollide(\"bullet\")\n    def hit(bullet):\n        enemy.destroy()\n        bar.destroy()\n\nwhich says what it means in the one place it is true.\n\"\"\"\nfrom ..gameobj import Comp, GameObj\nfrom ..vec2 import vec2, Vec2\n\n\nclass FollowComp(Comp):\n    id = \"follow\"\n    wants_late = True\n\n    def __init__(self, obj, offset=None, speed=None):\n        if not isinstance(obj, GameObj):\n            raise TypeError(\n                \"follow(%r) \u2014 follow() takes a game object to follow, the one \"\n                \"add() gave back.\\n\"\n                \"    player = add([sprite(\\\"bean\\\"), pos(100, 100)])\\n\"\n                \"    add([sprite(\\\"ghosty\\\"), pos(0, 0), follow(player)])\"\n                % (obj,))\n        if not obj.has(\"pos\"):\n            raise ValueError(\n                \"follow() was given an object with no pos() \u2014 there is \"\n                \"nowhere to follow it to. Add pos() to it.\")\n        if speed is not None and speed <= 0:\n            raise ValueError(\n                \"follow(speed=%r) \u2014 speed is how fast to chase, in pixels per \"\n                \"second, so it must be above zero. Leave it out to stick to \"\n                \"the target exactly.\" % (speed,))\n\n        self.obj = obj\n        self.speed = speed\n        if offset is None:\n            self.offset = vec2(0, 0)\n        elif isinstance(offset, Vec2):\n            self.offset = Vec2(offset.x, offset.y)\n        else:\n            self.offset = vec2(*offset)\n\n    def add(self, obj):\n        self._obj = obj\n        if not obj.has(\"pos\"):\n            raise ValueError(\n                \"follow() needs a pos() on the object doing the following \u2014 \"\n                \"that is what it moves. Add pos() alongside it.\")\n\n    def late_update(self, obj):\n        target = self.obj\n        if target is None or not target.exists():\n            # Stop where it is. See the note at the top of this file.\n            return\n\n        from ..geometry import get_world_pos\n\n        want = get_world_pos(target) + self.offset\n        # pos() is relative to a parent, if the follower has one, so a\n        # world-space target has to come back into the parent's frame or the\n        # follower lands at double the parent's offset.\n        if obj.parent is not None:\n            want = want - get_world_pos(obj.parent)\n\n        place = obj.comp(\"pos\")\n        if self.speed is None:\n            place.pos = Vec2(want.x, want.y)\n        else:\n            place.moveTo(want, self.speed)\n\n\ndef follow(obj, offset=None, speed=None):\n    return FollowComp(obj, offset=offset, speed=speed)\n", "comps/health.py": "\"\"\"health(): hit points, and something to do when they run out.\n\n    enemy = add([sprite(\"ogre\"), pos(300, 200), area(), health(3), \"enemy\"])\n\n    @enemy.onDeath\n    def died():\n        addKaboom(enemy.pos)\n        enemy.destroy()\n\nWHY IT IS A COMPONENT AND NOT JUST A NUMBER\n\n`enemy.hp = 3` works, and for one enemy it is simpler. It stops working at\nthe third place that takes a point off, because now three separate lines have\nto remember to check whether it reached zero \u2014 and the one that forgets is the\nenemy that survives at -2 hit points and cannot be killed.\n\n`hurt()` is one place. Death is one event. That is the whole argument.\n\"\"\"\nfrom ..gameobj import Comp\n\n\nclass HealthComp(Comp):\n    id = \"health\"\n\n    def __init__(self, hp, maxHP=None):\n        if hp is None:\n            raise TypeError(\"health() needs a number of hit points, e.g. health(3)\")\n        self.hp = hp\n        self.maxHP = maxHP if maxHP is not None else hp\n        self._hurt_handlers = []\n        self._heal_handlers = []\n        self._death_handlers = []\n\n    def add(self, obj):\n        self._obj = obj\n\n    # ---- changing it --------------------------------------------------\n\n    def setHP(self, value):\n        \"\"\"Set hit points directly. Fires onDeath if this takes it to zero.\"\"\"\n        was = self.hp\n        self.hp = min(value, self.maxHP)\n        if self.hp <= 0 < was:\n            self._fire(self._death_handlers)\n\n    def hurt(self, amount=1):\n        \"\"\"Take damage. Fires onHurt, and onDeath if it reaches zero.\"\"\"\n        if amount < 0:\n            raise ValueError(\n                f\"hurt({amount}) \u2014 to add hit points use heal({-amount})\")\n        was = self.hp\n        self.hp = self.hp - amount\n        self._fire(self._hurt_handlers, amount)\n        # Strictly \"crossed zero this time\", so a second hit on something\n        # already dead does not hold a second funeral for it.\n        if self.hp <= 0 < was:\n            self._fire(self._death_handlers)\n\n    def heal(self, amount=1):\n        \"\"\"Get hit points back, never above maxHP. Fires onHeal.\"\"\"\n        if amount < 0:\n            raise ValueError(\n                f\"heal({amount}) \u2014 to take hit points away use hurt({-amount})\")\n        before = self.hp\n        self.hp = min(self.hp + amount, self.maxHP)\n        gained = self.hp - before\n        if gained:\n            self._fire(self._heal_handlers, gained)\n\n    def isAlive(self):\n        return self.hp > 0\n\n    # ---- being told about it ------------------------------------------\n\n    def onHurt(self, fn=None):\n        return self._register(self._hurt_handlers, fn)\n\n    def onHeal(self, fn=None):\n        return self._register(self._heal_handlers, fn)\n\n    def onDeath(self, fn=None):\n        \"\"\"When hit points reach zero. It does NOT destroy the object \u2014 an\n        enemy may want to play a death animation, drop a coin, or respawn.\"\"\"\n        return self._register(self._death_handlers, fn)\n\n    def _register(self, where, fn):\n        from ..callutil import register_or_decorate\n\n        def register(f):\n            where.append(f)\n            return f\n\n        return register_or_decorate(fn, register)\n\n    def _fire(self, handlers, *args):\n        from ..callutil import call_flexible\n\n        for fn in list(handlers):\n            call_flexible(fn, *args)\n\n\ndef health(hp, maxHP=None):\n    return HealthComp(hp, maxHP)\n", "comps/lifespan.py": "\"\"\"lifespan(): destroy this after a few seconds.\n\n    add([sprite(\"bullet\"), pos(player.pos), move(0, -400), lifespan(2)])\n\nBullets, explosions, damage numbers, footprints. Anything that appears, does\nits job, and should stop existing without anyone having to remember it.\n\n`wait(2, lambda: b.destroy())` does the same thing and is what this replaces.\nThe difference is where it lives: the lifespan belongs to the bullet, next to\nits sprite and its speed, rather than in a timer somewhere else that refers\nback to it. When the bullet is destroyed early \u2014 it hit something \u2014 the\nlifespan goes with it, while a stray wait() would still be holding the object\nalive until it fired into nothing.\n\n    lifespan(1, fade=0.5)\n\nfades the last half-second out instead of vanishing mid-air, which is most of\nwhat makes an explosion look finished rather than interrupted. Fading needs an\nopacity() on the object; without one the object simply disappears at the end,\nand says so once rather than every frame.\n\"\"\"\nfrom ..gameobj import Comp\n\n\nclass LifespanComp(Comp):\n    id = \"lifespan\"\n\n    def __init__(self, seconds, fade=0):\n        if seconds is None or seconds < 0:\n            raise ValueError(\n                f\"lifespan({seconds!r}) \u2014 give it a number of seconds, e.g. lifespan(2)\")\n        if fade < 0:\n            raise ValueError(f\"lifespan(fade={fade!r}) cannot be negative\")\n        self.seconds = seconds\n        self.fade = min(fade, seconds)\n        self._left = seconds\n        self._warned = False\n\n    def add(self, obj):\n        self._obj = obj\n\n    def update(self, obj):\n        from ..engine import current_engine\n\n        self._left -= current_engine().dt()\n\n        if self._left <= 0:\n            obj.destroy()\n            return\n\n        if self.fade and self._left < self.fade:\n            if obj.has(\"opacity\"):\n                obj.comp(\"opacity\").opacity = max(0.0, self._left / self.fade)\n            elif not self._warned:\n                # Once, not sixty times a second \u2014 and it keeps running,\n                # because a bullet that vanishes abruptly is still a bullet\n                # that went away, which is what was asked for.\n                self._warned = True\n                print(\"note: lifespan(fade=...) needs an opacity() component \"\n                      \"to fade \u2014 add opacity(1) to this object, or drop the \"\n                      \"fade argument.\")\n\n\ndef lifespan(seconds, fade=0):\n    return LifespanComp(seconds, fade)\n", "comps/move.py": "\"\"\"move(dir, speed): drifts an object in a straight line forever.\noffscreen(destroy=True): cleans it up once it leaves the screen.\ntile(isObstacle=): marks an object as occupying a square on a grid.\"\"\"\nfrom ..gameobj import Comp\nfrom ..vec2 import vec2, Vec2\n\n\nclass MoveComp(Comp):\n    id = \"move\"\n\n    def __init__(self, direction, speed):\n        if isinstance(direction, Vec2):\n            self.direction = direction.unit()\n        else:\n            self.direction = vec2(*direction).unit()\n        self.speed = speed\n\n    def add(self, obj):\n        self._obj = obj\n\n    def update(self, obj):\n        if obj.has(\"pos\"):\n            obj.comp(\"pos\").move(self.direction * self.speed)\n\n\ndef move(direction, speed):\n    return MoveComp(direction, speed)\n\n\nclass OffscreenComp(Comp):\n    id = \"offscreen\"\n\n    def __init__(self, destroy=False, distance=64):\n        self.destroy = destroy\n        self.distance = distance\n\n    def add(self, obj):\n        self._obj = obj\n\n    def update(self, obj):\n        from ..engine import current_engine\n        from ..geometry import get_world_pos\n        engine = current_engine()\n        p = get_world_pos(obj)\n        d = self.distance\n        if (p.x < -d or p.x > engine.width() + d or\n                p.y < -d or p.y > engine.height() + d):\n            if self.destroy:\n                obj.destroy()\n\n\ndef offscreen(destroy=False, distance=64):\n    return OffscreenComp(destroy=destroy, distance=distance)\n\n\nclass TileComp(Comp):\n    id = \"tile\"\n\n    def __init__(self, isObstacle=False):\n        self.isObstacle = isObstacle\n\n    def add(self, obj):\n        self._obj = obj\n\n\ndef tile(isObstacle=False):\n    return TileComp(isObstacle=isObstacle)\n", "comps/pos.py": "from ..gameobj import Comp\nfrom ..vec2 import vec2, Vec2\n\n\nclass PosComp(Comp):\n    id = \"pos\"\n\n    def __init__(self, x=0, y=0):\n        if isinstance(x, Vec2):\n            self.pos = Vec2(x.x, x.y)\n        else:\n            self.pos = vec2(x, y)\n\n    def move(self, dx, dy=None):\n        \"\"\"Move by a velocity in pixels PER SECOND (scaled by dt each frame).\"\"\"\n        engine = self._engine_ref()\n        dt = engine.dt() if engine else 0.0\n        if dy is None and isinstance(dx, Vec2):\n            self.pos = self.pos + dx * dt\n        else:\n            self.pos = self.pos + vec2(dx, dy) * dt\n\n    def moveTo(self, target, speed=None):\n        \"\"\"Move toward target. With speed, moves at that rate (px/s);\n        without, jumps straight there.\"\"\"\n        if isinstance(target, (tuple, list)):\n            target = vec2(*target)\n        elif not isinstance(target, Vec2):\n            target = vec2(target, 0)\n        if speed is None:\n            self.pos = Vec2(target.x, target.y)\n            return\n        engine = self._engine_ref()\n        dt = engine.dt() if engine else 0.0\n        direction = target - self.pos\n        dist = direction.len()\n        step = speed * dt\n        if dist <= step or dist == 0:\n            self.pos = Vec2(target.x, target.y)\n        else:\n            self.pos = self.pos + direction.unit() * step\n\n    def _engine_ref(self):\n        from ..engine import current_engine\n        return current_engine()\n\n    def add(self, obj):\n        self._obj = obj\n\n\ndef pos(x=0, y=0):\n    return PosComp(x, y)\n", "comps/sentry.py": "\"\"\"sentry(\"player\"): notice when something comes into view.\n\n    guard = add([\n        sprite(\"ghosty\"), pos(400, 300), area(),\n        sentry(\"player\", direction=vec2(1, 0), fieldOfView=70,\n               range=260, lineOfSight=True),\n    ])\n\n    @guard.onObjectsSpotted\n    def seen(objects):\n        say(\"Hey! Stop right there.\")\n\nA guard with a torch, a turret, a security camera, a fish that notices\ncrumbs. The component answers one question every so often \u2014 *which of the\nthings I care about can I see right now?* \u2014 and tells you when the answer\nstops being empty.\n\nWHAT COUNTS AS SEEING\n\nThree tests, each of which can be left out:\n\n    direction + fieldOfView   a cone. Without them it looks all ways.\n    range                     how far. Without it, forever.\n    lineOfSight               walls stop it. Without it, they do not.\n\n`fieldOfView` is the whole width of the cone in degrees, so 90 means 45\neither side of `direction`, and 360 is everywhere. If the object also has\n`rotate()`, leaving `direction` out means it looks wherever it is facing \u2014\nturn the guard and the cone turns with it.\n\nRANGE IS NOT KAPLAY'S, AND IS HERE ANYWAY\n\nKAPLAY's sentry has no distance at all: a guard facing right can see you on\nthe far side of a scrolling level, through the whole rest of the game. That\nis a reasonable default for a library and a bad one for the first stealth\ngame somebody writes, where the interesting question is always *how close\ncan I get*. Leave `range` out and it behaves exactly as KAPLAY's does, so\ntheir examples still mean what they say.\n\nWHY onObjectsSpotted FIRES ON THE EDGE\n\nIt is called when the sentry goes from seeing nothing to seeing something,\nnot on every frame it can see you \u2014 which would be sixty alarms a second\nand sixty lines of dialogue on top of each other. Go out of sight and come\nback and it fires again. `.spotted` is the current list, for the frames in\nbetween:\n\n    if guard.spotted:\n        chase(guard.spotted[0])\n\nCHECKING SIXTY TIMES A SECOND IS USUALLY WASTE\n\nEvery check walks the candidates, and with `lineOfSight` casts a ray at\neach. A dozen guards doing that every frame is real work in a browser, to\nanswer a question that has not changed in 16 milliseconds. So\n`checkFrequency` is how many times a second to look, defaulting to ten \u2014\na tenth of a second late to notice an intruder is not something a player\ncan perceive, and it is six times less work.\n\"\"\"\nfrom ..gameobj import Comp, GameObj\nfrom ..vec2 import Vec2, vec2\n\n\nclass SentryComp(Comp):\n    id = \"sentry\"\n\n    def __init__(self, candidates, direction=None, fieldOfView=None,\n                 range=None, lineOfSight=False, raycastExclude=None,\n                 checkFrequency=10):\n        if isinstance(candidates, (str, GameObj)):\n            candidates = [candidates]\n        elif not (callable(candidates) or isinstance(candidates, (list, tuple))):\n            raise TypeError(\n                \"sentry(%r) \u2014 say what to look for: a tag, a game object, a \"\n                \"list of either, or a function returning a list.\\n\"\n                \"    sentry(\\\"player\\\")\\n\"\n                \"    sentry([player, dog])\" % (candidates,))\n        self.candidates = candidates\n\n        if fieldOfView is not None and not 0 < fieldOfView <= 360:\n            raise ValueError(\n                \"sentry(fieldOfView=%r) \u2014 the field of view is the whole \"\n                \"width of the cone in degrees, so it goes from just above 0 \"\n                \"to 360 (all the way round).\" % (fieldOfView,))\n        if range is not None and range <= 0:\n            raise ValueError(\n                \"sentry(range=%r) \u2014 the range is how far it can see, in \"\n                \"pixels, so it must be above zero. Leave it out to see \"\n                \"forever.\" % (range,))\n        if checkFrequency <= 0:\n            raise ValueError(\n                \"sentry(checkFrequency=%r) \u2014 that is how many times a second \"\n                \"to look, so it must be above zero.\" % (checkFrequency,))\n\n        self.direction = None if direction is None else _as_direction(direction)\n        self.fieldOfView = fieldOfView\n        self.range = range\n        self.lineOfSight = lineOfSight\n        self.raycastExclude = raycastExclude\n        self.checkFrequency = checkFrequency\n\n        #: What it can see, as of the last check.\n        self.spotted = []\n        self._handlers = []\n        self._since = 0.0\n\n    # ---- what the object is facing ----------------------------------------\n\n    @property\n    def directionAngle(self):\n        \"\"\"Where it is looking, in degrees. None means all ways.\"\"\"\n        d = self._facing()\n        return None if d is None else d.angle()\n\n    def _facing(self):\n        if self.direction is not None:\n            return self.direction\n        obj = getattr(self, \"_obj\", None)\n        if obj is not None and obj.has(\"rotate\"):\n            # No explicit direction: look wherever the object is turned.\n            return Vec2.fromAngle(obj.comp(\"rotate\").angle)\n        return None\n\n    # ---- the three tests ---------------------------------------------------\n\n    def isWithinFieldOfView(self, obj, direction=None, fieldOfView=None):\n        \"\"\"Is obj inside the cone? Ignores range and walls.\"\"\"\n        import math\n        from ..geometry import get_world_pos\n\n        facing = _as_direction(direction) if direction is not None else self._facing()\n        view = self.fieldOfView if fieldOfView is None else fieldOfView\n        if facing is None or view is None or view >= 360:\n            return True\n\n        me = get_world_pos(self._obj)\n        to = get_world_pos(obj) - me\n        if to.len() == 0:\n            return True\n        # The angle between two directions, the short way round \u2014 a guard\n        # facing 350 degrees looking at something at 10 degrees is 20 apart,\n        # not 340, and getting that wrong makes a cone that works except\n        # when it straddles zero.\n        gap = abs(_wrap180(to.angle() - facing.angle()))\n        return gap <= view / 2.0\n\n    def hasLineOfSight(self, obj):\n        \"\"\"Is there nothing solid between us?\"\"\"\n        from ..geometry import get_world_pos\n        from ..raycast import raycast\n\n        me = get_world_pos(self._obj)\n        to = get_world_pos(obj) - me\n        if to.len() == 0:\n            return True\n\n        exclude = list(self.raycastExclude or ())\n        # Ignoring itself is not optional: the ray starts inside the\n        # sentry's own area(), so without this every sentry with a collision\n        # box discovers that the first thing in its line of sight is itself,\n        # and can never see anything.\n        hit = raycast(me, to, exclude=exclude or None, ignore=[self._obj])\n        if hit is None:\n            # Nothing at all in the way \u2014 including the target, if it has no\n            # area(). Seeing something that cannot be hit by a ray is the\n            # right answer: the wall is what blocks sight, not the player.\n            return True\n        return hit.obj is obj or hit.distance >= to.len()\n\n    def _visible(self, obj):\n        from ..geometry import get_world_pos\n        if obj is self._obj or not obj.exists() or not obj.has(\"pos\"):\n            return False\n        if self.range is not None:\n            if get_world_pos(self._obj).dist(get_world_pos(obj)) > self.range:\n                return False\n        if not self.isWithinFieldOfView(obj):\n            return False\n        if self.lineOfSight and not self.hasLineOfSight(obj):\n            return False\n        return True\n\n    # ---- who to look at ----------------------------------------------------\n\n    def _candidates(self):\n        from ..engine import current_engine\n        items = self.candidates\n        if callable(items):\n            items = items()\n        out = []\n        for item in items:\n            if isinstance(item, str):\n                out.extend(current_engine().get(item))\n            elif isinstance(item, GameObj):\n                out.append(item)\n        return out\n\n    # ---- the loop ----------------------------------------------------------\n\n    def add(self, obj):\n        self._obj = obj\n\n    def update(self, obj):\n        from ..engine import current_engine\n\n        interval = 1.0 / self.checkFrequency\n        self._since += current_engine().dt()\n        if self._since < interval:\n            return\n        # Subtract the interval rather than zeroing, so the leftover carries\n        # into the next one. Zeroing loses it, and the loss compounds: at\n        # sixty frames a second, six frames of 1/60 come to 0.09999999999,\n        # just under a tenth, so every check waits a seventh frame and\n        # `checkFrequency=10` quietly runs at eight and a half.\n        self._since -= interval\n        if self._since > interval:\n            # A long frame \u2014 a stalled tab, a slow machine \u2014 is one check,\n            # not a queue of them to catch up on.\n            self._since = 0.0\n\n        was = bool(self.spotted)\n        self.spotted = [o for o in self._candidates() if self._visible(o)]\n        if self.spotted and not was:\n            for fn in list(self._handlers):\n                fn(self.spotted)\n\n    def onObjectsSpotted(self, fn=None):\n        \"\"\"Run something when it starts seeing what it is looking for.\"\"\"\n        from ..callutil import register_or_decorate\n\n        def register(f):\n            self._handlers.append(f)\n            return f\n\n        return register_or_decorate(fn, register)\n\n\ndef _as_direction(value):\n    \"\"\"A direction as a Vec2, from a Vec2, a tuple, or an angle in degrees.\"\"\"\n    if isinstance(value, Vec2):\n        return value.unit()\n    if isinstance(value, (tuple, list)) and len(value) == 2:\n        return vec2(*value).unit()\n    if isinstance(value, (int, float)):\n        return Vec2.fromAngle(value)\n    raise TypeError(\n        \"sentry(direction=%r) \u2014 a direction is a vec2 or an angle in \"\n        \"degrees.\\n\"\n        \"    direction=vec2(1, 0)   # looking right\\n\"\n        \"    direction=90           # looking down\" % (value,))\n\n\ndef _wrap180(degrees):\n    \"\"\"The same angle, expressed between -180 and 180.\"\"\"\n    return (degrees + 180.0) % 360.0 - 180.0\n\n\ndef sentry(candidates, direction=None, fieldOfView=None, range=None,\n           lineOfSight=False, raycastExclude=None, checkFrequency=10):\n    return SentryComp(candidates, direction=direction, fieldOfView=fieldOfView,\n                      range=range, lineOfSight=lineOfSight,\n                      raycastExclude=raycastExclude,\n                      checkFrequency=checkFrequency)\n", "comps/shapes.py": "\"\"\"Drawable shape/text components: rect(), circle(), text().\nThese hold data only \u2014 the RenderSystem does the actual drawing so\nz-ordering, camera transform, anchor and scale stay in one place.\"\"\"\nfrom ..gameobj import Comp\n\n\nclass RectComp(Comp):\n    id = \"rect\"\n\n    def __init__(self, width, height, radius=0):\n        self.width = width\n        self.height = height\n        self.radius = radius\n\n    def size(self):\n        return (self.width, self.height)\n\n\ndef rect(width, height, radius=0):\n    return RectComp(width, height, radius)\n\n\nclass CircleComp(Comp):\n    id = \"circle\"\n\n    def __init__(self, radius):\n        self.radius = radius\n\n    def size(self):\n        d = self.radius * 2\n        return (d, d)\n\n\ndef circle(radius):\n    return CircleComp(radius)\n\n\nclass TextComp(Comp):\n    id = \"text\"\n\n    def __init__(self, text_str=\"\", size=22, width=None):\n        self.text = text_str\n        self.textSize = size\n        self.width = width\n        self._font_cache_key = None\n        self._surf_cache = None\n        self._surf_cache_key = None\n\n    def render_surface(self, color=(255, 255, 255)):\n        from ..engine import current_engine\n        import pygame\n        font = current_engine()._get_font(self.textSize)\n        key = (self.text, self.textSize, self.width, color)\n        if self._surf_cache_key == key:\n            return self._surf_cache\n        if self.width:\n            surf = _wrap_text(font, self.text, self.width, color)\n        else:\n            surf = font.render(self.text, True, color)\n        self._surf_cache_key = key\n        self._surf_cache = surf\n        return surf\n\n    def size(self):\n        return self.render_surface().get_size()\n\n\ndef _wrap_text(font, text_str, max_width, color):\n    import pygame\n    words = text_str.split(\" \")\n    lines = []\n    current = \"\"\n    for word in words:\n        trial = (current + \" \" + word).strip()\n        if font.size(trial)[0] > max_width and current:\n            lines.append(current)\n            current = word\n        else:\n            current = trial\n    if current:\n        lines.append(current)\n    if not lines:\n        lines = [\"\"]\n    line_surfs = [font.render(line, True, color) for line in lines]\n    total_h = sum(s.get_height() for s in line_surfs)\n    total_w = max((s.get_width() for s in line_surfs), default=0)\n    out = pygame.Surface((max(total_w, 1), max(total_h, 1)), pygame.SRCALPHA)\n    y = 0\n    for s in line_surfs:\n        out.blit(s, (0, y))\n        y += s.get_height()\n    return out\n\n\ndef text(text_str=\"\", size=22, width=None):\n    return TextComp(text_str, size=size, width=width)\n", "comps/sprite.py": "import pygame\nfrom ..gameobj import Comp\n\n\nclass SpriteComp(Comp):\n    id = \"sprite\"\n\n    def __init__(self, name, anim=None, frame=None):\n        self.spriteName = name\n        self.flipX = False\n        self.flipY = False\n        self._asset = None\n        self._frame_override = frame\n        self._cur_anim = None\n        self._anim_spec = None\n        self._anim_frame_idx = 0\n        self._anim_timer = 0.0\n        self._anim_done = False\n        self._pending_initial_anim = anim\n        self._frame_cache = {}\n\n    def add(self, obj):\n        from ..engine import current_engine\n        self._asset = current_engine().assets.get_sprite(self.spriteName)\n        if self._frame_override is None:\n            self._anim_frame_idx = 0\n        if self._pending_initial_anim:\n            self.play(self._pending_initial_anim)\n\n    def play(self, name):\n        \"\"\"Restarts the animation from its first frame \u2014 calling it every\n        frame while a key is held gives a character stuck on frame 0.\"\"\"\n        spec = self._asset.anims.get(name)\n        if spec is None:\n            raise KeyError(\n                f\"sprite {self.spriteName!r} has no animation called {name!r}\"\n            )\n        self._cur_anim = name\n        self._anim_spec = spec\n        self._anim_frame_idx = spec[\"from\"]\n        self._anim_timer = 0.0\n        self._anim_done = False\n\n    def curAnim(self):\n        return self._cur_anim\n\n    def update(self, obj):\n        if self._cur_anim is None or self._anim_done:\n            return\n        from ..engine import current_engine\n        dt = current_engine().dt()\n        spec = self._anim_spec\n        speed = spec.get(\"speed\") or 10\n        step = 1.0 / speed\n        self._anim_timer += dt\n        while self._anim_timer >= step:\n            self._anim_timer -= step\n            if self._anim_frame_idx >= spec[\"to\"]:\n                if spec.get(\"loop\"):\n                    self._anim_frame_idx = spec[\"from\"]\n                else:\n                    self._anim_done = True\n                    break\n            else:\n                self._anim_frame_idx += 1\n\n    def current_surface(self):\n        idx = self._frame_override if self._frame_override is not None else self._anim_frame_idx\n        frames = self._asset.frames\n        idx = max(0, min(idx, len(frames) - 1))\n        key = (idx, self.flipX, self.flipY)\n        cached = self._frame_cache.get(key)\n        if cached is not None:\n            return cached\n        surf = frames[idx]\n        if self.flipX or self.flipY:\n            surf = pygame.transform.flip(surf, self.flipX, self.flipY)\n        self._frame_cache[key] = surf\n        return surf\n\n    def size(self):\n        return self._asset.frame_size\n\n\ndef sprite(name, anim=None, frame=None):\n    return SpriteComp(name, anim=anim, frame=frame)\n", "comps/state.py": "\"\"\"state(): gives an object a mode (idle, attack, move...) and different\nbehaviour in each \u2014 how nearly all simple game AI is written.\"\"\"\nfrom ..gameobj import Comp\n\n\nclass StateComp(Comp):\n    id = \"state\"\n\n    def __init__(self, start, states):\n        self.states = list(states)\n        if start not in self.states:\n            raise ValueError(f\"state() start {start!r} not in {self.states!r}\")\n        self._state = start\n        self._enter_handlers = {}\n        self._update_handlers = {}\n        self._entered_once = False\n\n    def add(self, obj):\n        self._obj = obj\n\n    def onStateEnter(self, name, fn=None):\n        from ..callutil import register_or_decorate\n        self._check(name)\n\n        def register(f):\n            self._enter_handlers.setdefault(name, []).append(f)\n            return f\n\n        return register_or_decorate(fn, register)\n\n    def onStateUpdate(self, name, fn=None):\n        from ..callutil import register_or_decorate\n        self._check(name)\n\n        def register(f):\n            self._update_handlers.setdefault(name, []).append(f)\n            return f\n\n        return register_or_decorate(fn, register)\n\n    def enterState(self, name):\n        self._check(name)\n        self._state = name\n        for fn in self._enter_handlers.get(name, []):\n            fn()\n\n    def state_name(self):\n        return self._state\n\n    def update(self, obj):\n        if not self._entered_once:\n            # fire the starting state's onStateEnter handlers once, the\n            # first frame this object exists.\n            self._entered_once = True\n            for fn in self._enter_handlers.get(self._state, []):\n                fn()\n        for fn in self._update_handlers.get(self._state, []):\n            fn()\n\n    def _check(self, name):\n        if name not in self.states:\n            raise ValueError(f\"{name!r} is not one of this object's states {self.states!r}\")\n\n\ndef state(start, states):\n    return StateComp(start, states)\n", "comps/transform.py": "\"\"\"Small appearance/behavior components: anchor, scale, rotate, color,\nopacity, outline, z, fixed().\"\"\"\nfrom ..gameobj import Comp\nfrom ..helpers import rgb\nfrom ..vec2 import Vec2, vec2\n\n_ANCHOR_NAMES = {\n    \"topleft\": (-1, -1), \"top\": (0, -1), \"topright\": (1, -1),\n    \"left\": (-1, 0), \"center\": (0, 0), \"right\": (1, 0),\n    \"botleft\": (-1, 1), \"bot\": (0, 1), \"botright\": (1, 1),\n}\n\n\nclass AnchorComp(Comp):\n    id = \"anchor\"\n\n    def __init__(self, value):\n        self.anchor = self._resolve(value)\n\n    def _resolve(self, value):\n        if isinstance(value, str):\n            if value not in _ANCHOR_NAMES:\n                raise ValueError(f\"unknown anchor name {value!r}\")\n            x, y = _ANCHOR_NAMES[value]\n            return Vec2(x, y)\n        if isinstance(value, Vec2):\n            return value\n        raise TypeError(\n            \"anchor() takes a name like anchor(\\\"center\\\") or an offset \"\n            \"vec2(x, y) between -1 and 1 \u2014 not a screen position\"\n        )\n\n\ndef anchor(value):\n    return AnchorComp(value)\n\n\nclass ScaleComp(Comp):\n    id = \"scale\"\n\n    def __init__(self, x=1, y=None):\n        if y is None:\n            y = x\n        self.scale = Vec2(x, y)\n\n\ndef scale(x=1, y=None):\n    return ScaleComp(x, y)\n\n\nclass RotateComp(Comp):\n    \"\"\"rotate(degrees) \u2014 turn the object, clockwise, about its anchor.\n\n    Clockwise because the screen's y axis points down, so a positive angle\n    turns the way a clock does, which is what anyone drawing on a screen\n    expects. Asteroids is the reason this exists: a ship that cannot turn\n    is not a ship.\n\n    The **collision box does not turn with it**, deliberately. It stays the\n    upright rectangle the object would have had at angle 0, which is what\n    Kaplay does too. A rotating box whose hitbox rotated with it would grow\n    and shrink twice a revolution, so an asteroid spinning on the spot would\n    catch the player at some angles and not others \u2014 a bug nobody would ever\n    guess at from the symptom.\n    \"\"\"\n\n    id = \"rotate\"\n\n    def __init__(self, angle=0):\n        self.angle = angle\n\n    def rotateBy(self, degrees):\n        \"\"\"Turn by this much more. `obj.rotateBy(180 * dt())` in onUpdate.\"\"\"\n        self.angle += degrees\n        return self.angle\n\n    def rotateTo(self, degrees):\n        \"\"\"Face exactly this way.\"\"\"\n        self.angle = degrees\n        return self.angle\n\n\ndef rotate(angle=0):\n    return RotateComp(angle)\n\n\nclass ColorComp(Comp):\n    id = \"color\"\n\n    def __init__(self, r=255, g=None, b=None):\n        self.color = rgb(r, g, b)\n\n\ndef color(r=255, g=None, b=None):\n    \"\"\"A colour, in any of the spellings rgb() accepts.\n\n    `color(255, 128, 0)`, `color(\"#ff8800\")`, `color(200)` for a grey, and\n    `color(RED)` all work, because this hands its arguments straight to\n    rgb(). Before that it took three numbers only, so `color(RED)` quietly\n    set red to a tuple \u2014 the constants would have been useless in the one\n    place a beginner would reach for them first.\n\n    THE DEFAULTS HAD TO CHANGE TOO\n    \n    Handing the arguments to rgb() is not enough on its own. While this read\n    `color(r=255, g=255, b=255)`, `color(200)` still arrived at rgb() as\n    (200, 255, 255) \u2014 rgb()'s \"one number is a grey\" rule could never fire,\n    because g and b were never missing. The defaults are None here for the\n    same reason they are None there.\n\n    One behaviour changed on the way: `color(255, 128)` used to return\n    (255, 128, 255), silently inventing a blue nobody asked for. It now\n    raises the same sentence rgb() has always raised.\n    \"\"\"\n    return ColorComp(r, g, b)\n\n\nclass OpacityComp(Comp):\n    id = \"opacity\"\n\n    def __init__(self, n=1.0):\n        self.opacity = n\n\n\ndef opacity(n=1.0):\n    return OpacityComp(n)\n\n\nclass OutlineComp(Comp):\n    id = \"outline\"\n\n    def __init__(self, width=1, color=(0, 0, 0)):\n        self.outlineWidth = width\n        self.outlineColor = rgb(color)\n\n\ndef outline(width=1, color=(0, 0, 0)):\n    \"\"\"An outline, in any spelling rgb() accepts.\n\n    A tuple already worked here, so outline(2, GREEN) was fine before this.\n    Going through rgb() is for the other spellings \u2014 outline(2, \"#ff8800\")\n    and outline(2, 200) \u2014 so that every place a colour goes takes the same\n    set of forms. One name behaving differently from the rest is the sort of\n    thing a student reads as \"I did it wrong\".\n    \"\"\"\n    return OutlineComp(width, color)\n\n\nclass ZComp(Comp):\n    id = \"z\"\n\n    def __init__(self, z=0):\n        self.z = z\n\n\ndef z(value=0):\n    return ZComp(value)\n\n\nclass FixedComp(Comp):\n    \"\"\"Marks an object as ignoring the camera (stays put on screen).\"\"\"\n    id = \"fixed\"\n\n    def __init__(self):\n        self.fixed = True\n\n\ndef fixed():\n    return FixedComp()\n", "debugmod.py": "\"\"\"debug.inspect = True draws every collision box on screen (or press F1\nwhile the game is running).\"\"\"\n\n\nclass _Debug:\n    def __init__(self):\n        self.inspect = False\n\n\ndebug = _Debug()\n", "drawing.py": "\"\"\"Drawing straight to the screen, without making a game object for it.\n\n    @onDraw\n    def health_bar():\n        drawRect(pos=vec2(20, 20), width=200, height=16, color=rgb(60, 0, 0),\n                 fixed=True)\n        drawRect(pos=vec2(20, 20), width=2 * player.hp, height=16,\n                 color=rgb(220, 40, 40), fixed=True)\n\nWHY THIS EXISTS\n\nEverything else in kaypy is a game object: it has a position, it persists, it\ncollides, it is destroyed. That is the right shape for a player, a coin, a\nplatform \u2014 and the wrong shape for a health bar, an aim line from the player\nto the cursor, a grid behind a puzzle, or a circle showing an explosion's\nradius. Those are not *things in the world*; they are marks on the screen for\none frame.\n\nWithout this, a student builds them out of game objects anyway \u2014 creating and\ndestroying a rectangle every frame, or making one and hunting for every place\nits width has to be updated. Both work. Both teach the wrong lesson about what\na game object is for.\n\nWHEN THEY CAN BE CALLED\n\nOnly from inside an `onDraw` handler, because only then is there a frame being\ndrawn. Called anywhere else they raise and say so, rather than silently doing\nnothing \u2014 a drawing that never appears is among the least debuggable things a\nbeginner can write.\n\nWORLD SPACE OR SCREEN SPACE\n\nBy default these draw in *world* space: they move with the camera, exactly\nlike game objects do, so a marker drawn at an enemy's position stays on the\nenemy. Pass `fixed=True` for screen space, which is what you want for a HUD \u2014\nthe same distinction `fixed()` makes for game objects.\n\"\"\"\nfrom __future__ import annotations\n\nimport pygame\n\nfrom .vec2 import Vec2\n\n#: Set by RenderSystem for the length of the draw phase, cleared after. A\n#: tuple of (surface, camera), or None when no frame is being drawn.\n_target = None\n\n\ndef _begin(screen, camera):\n    global _target\n    _target = (screen, camera)\n\n\ndef _end():\n    global _target\n    _target = None\n\n\ndef _surface(who):\n    if _target is None:\n        raise RuntimeError(\n            f\"{who}() can only be called while a frame is being drawn \u2014 put it \"\n            f\"inside an onDraw handler:\\n\"\n            f\"    @onDraw\\n\"\n            f\"    def hud():\\n\"\n            f\"        {who}(...)\"\n        )\n    return _target\n\n\ndef _place(pos, fixed, camera):\n    \"\"\"A world (or screen) position, as pixels on the surface.\n\n    The zoom that comes back is a Vec2, because the camera can be scaled a\n    different amount on each axis. Sizes with a width and a height use both\n    of
