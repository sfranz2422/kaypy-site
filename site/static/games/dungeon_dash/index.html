te(\"role\", \"dialog\")\n        box.setAttribute(\"aria-modal\", \"true\")\n        # A <div> cannot take focus without this, so focus() below would do\n        # nothing, the event target would stay <body>, and the number-key\n        # shortcut would quietly stop working.\n        box.setAttribute(\"tabindex\", \"-1\")\n\n        para = doc.createElement(\"p\")\n        # textContent, never innerHTML. The text comes from a game, and a\n        # game's text comes from wherever the person who wrote it got it.\n        # Nothing in a panel is worth an injection bug.\n        para.textContent = p.text\n        box.appendChild(para)\n\n        if p.choices:\n            for i, choice in enumerate(p.choices):\n                b = doc.createElement(\"button\")\n                b.className = \"kaypy-choice\"\n                b.type = \"button\"\n                b.textContent = \"%d.  %s\" % (i + 1, choice)\n                b.addEventListener(\"click\", _handler(\n                    lambda _e, i=i: self._answered(i, p.choices[i])))\n                box.appendChild(b)\n        elif p.asks:\n            # A short answer: a real <input>, with the phone keyboard and\n            # paste, which is most of the reason this renderer exists.\n            field = doc.createElement(\"input\")\n            field.className = \"kaypy-text\"\n            field.type = \"text\"\n            field.placeholder = p.placeholder or \"\"\n            field.setAttribute(\"autocomplete\", \"off\")\n            field.setAttribute(\"autocapitalize\", \"off\")\n            box.appendChild(field)\n            self.field = field\n\n            go = doc.createElement(\"button\")\n            go.className = \"kaypy-go\"\n            go.type = \"button\"\n            go.textContent = p.button or \"OK\"\n            go.addEventListener(\"click\", _handler(\n                lambda _e: self._answered(None, self.field.value)))\n            box.appendChild(go)\n        else:\n            # A message: one button and nothing to fill in. It used to get\n            # the branch above \u2014 a text box on a line of dialogue, which the\n            # player could type into and which was then thrown away.\n            go = doc.createElement(\"button\")\n            go.className = \"kaypy-go\"\n            go.type = \"button\"\n            go.textContent = p.button or \"OK\"\n            go.addEventListener(\"click\", _handler(\n                lambda _e: self._answered(None, None)))\n            box.appendChild(go)\n\n        if p.link:\n            label, url = p.link\n            wrap = doc.createElement(\"p\")\n            a = doc.createElement(\"a\")\n            a.textContent = label\n            a.href = url\n            # A link out of a game goes to a new tab. Replacing the page\n            # would take the game with it, and the player's progress.\n            a.target = \"_blank\"\n            a.rel = \"noopener noreferrer\"\n            wrap.appendChild(a)\n            box.appendChild(wrap)\n\n        hint = doc.createElement(\"p\")\n        hint.className = \"kaypy-hint\"\n        if p.choices:\n            hint.textContent = \"Click an answer, or press its number.\"\n        elif p.asks:\n            hint.textContent = \"Type your answer, then press Enter.\"\n        else:\n            hint.textContent = \"Press Enter, or click %s.\" % (p.button or \"OK\")\n        box.appendChild(hint)\n\n        veil.appendChild(box)\n        doc.body.appendChild(veil)\n        self.veil = veil\n\n        # The canvas has the keyboard while a game is running, so without\n        # this the first thing typed goes to the game, not the panel.\n        try:\n            (self.field if (p.asks and not p.choices) else box).focus()\n        except Exception:                                      # noqa: BLE001\n            pass\n\n        self._on_resize = _handler(lambda _e: self._place(self.veil))\n        js.window.addEventListener(\"resize\", self._on_resize)\n        js.window.addEventListener(\"scroll\", self._on_resize)\n\n        # Keys, intercepted at the window, in the CAPTURE phase.\n        #\n        # This is the whole reason typing into the box works at all. SDL, in\n        # a browser, puts its own key listeners on `document` and calls\n        # preventDefault() on them, so that arrow keys and space drive the\n        # game instead of scrolling the page. It never takes them off. A\n        # cancelled keydown still *fires* \u2014 which is why clicking a choice or\n        # pressing \"2\" worked \u2014 but the browser's default action for it does\n        # not happen, and typing a character into an <input> IS that default\n        # action. So the box stayed empty while everything else worked.\n        #\n        # Capture runs outermost-first: window, then document. Listening here\n        # gets the event before SDL does, and stopPropagation() means SDL's\n        # document listener never runs and never cancels anything. The\n        # default action then happens normally and the character appears.\n        #\n        # Note it does NOT call preventDefault() itself \u2014 that would be the\n        # same bug with a different author.\n        self._on_key = _handler(self._key_capture)\n        for kind in (\"keydown\", \"keyup\", \"keypress\"):\n            js.window.addEventListener(kind, self._on_key, True)\n\n    def _install_css(self):\n        doc = self.js.document\n        if doc.getElementById(\"kaypy-panel-css\"):\n            return\n        style = doc.createElement(\"style\")\n        style.id = \"kaypy-panel-css\"\n        style.textContent = CSS\n        doc.head.appendChild(style)\n\n    def _place(self, veil):\n        \"\"\"Sit exactly over the canvas, wherever it currently is.\"\"\"\n        canvas = self.js.document.getElementById(\"canvas\")\n        if canvas is None:\n            # No canvas to cover: fill the window rather than vanish.\n            veil.style.inset = \"0\"\n            return\n        r = canvas.getBoundingClientRect()\n        veil.style.left = \"%fpx\" % r.left\n        veil.style.top = \"%fpx\" % r.top\n        veil.style.width = \"%fpx\" % r.width\n        veil.style.height = \"%fpx\" % r.height\n\n    # ---- input -----------------------------------------------------------\n\n    def _key_capture(self, event):\n        \"\"\"Every key, before SDL can cancel it.\n\n        Only keys aimed at the panel are taken. A key pressed with the game\n        focused is left alone: the game is paused and its handlers are not\n        running anyway, and swallowing those would break a page that has\n        anything else on it \u2014 PyIDE has an editor two inches away.\n        \"\"\"\n        if self.veil is None:\n            return\n\n        target = getattr(event, \"target\", None)\n        try:\n            inside = bool(self.veil.contains(target))\n        except Exception:                                      # noqa: BLE001\n            inside = False\n\n        # The canvas and <body> count too. A panel is modal, and the player\n        # may well have clicked the game before the question appeared \u2014 SDL\n        # keeps the canvas focused \u2014 so keys arriving from there belong to\n        # the panel. What is deliberately NOT taken is a key aimed at some\n        # other field on the page: PyIDE has a code editor two inches away,\n        # and swallowing its keystrokes would be far worse than this bug.\n        elsewhere = False\n        try:\n            name = (getattr(target, \"tagName\", \"\") or \"\").upper()\n            elsewhere = name in (\"BODY\", \"CANVAS\", \"HTML\", \"\")\n        except Exception:                                      # noqa: BLE001\n            elsewhere = False\n\n        if not (inside or elsewhere):\n            return\n\n        # SDL must not see this one.\n        event.stopPropagation()\n\n        if getattr(event, \"type\", \"\") != \"keydown\":\n            return\n\n        p = self.panel\n        key = getattr(event, \"key\", \"\")\n        if p.choices:\n            if len(key) == 1 and key.isdigit():\n                i = int(key) - 1\n                if 0 <= i < len(p.choices):\n                    self._answered(i, p.choices[i])\n        elif not p.asks:\n            if key in (\"Enter\", \" \"):\n                self._answered(None, None)\n        elif key == \"Enter\":\n            self._answered(None, self.field.value)\n\n    def _answered(self, index, text):\n        self.panel.finish(index, text)\n\n    # ---- taking it away --------------------------------------------------\n\n    def destroy(self):\n        js = self.js\n        try:\n            js.window.removeEventListener(\"resize\", self._on_resize)\n            js.window.removeEventListener(\"scroll\", self._on_resize)\n            for kind in (\"keydown\", \"keyup\", \"keypress\"):\n                js.window.removeEventListener(kind, self._on_key, True)\n        except Exception:                                      # noqa: BLE001\n            pass\n        if self.veil is not None:\n            try:\n                self.veil.remove()\n            except Exception:                                  # noqa: BLE001\n                pass\n            self.veil = None\n        # Whatever had the keyboard before, the canvas should have it again,\n        # or the game is running and not listening.\n        try:\n            canvas = js.document.getElementById(\"canvas\")\n            if canvas is not None:\n                canvas.focus()\n        except Exception:                                      # noqa: BLE001\n            pass\n\n    def handle(self, events):\n        \"\"\"Nothing to do: the browser delivers the input to the elements.\n\n        This exists so panel.handle_events() can say \"the panel took it\"\n        without caring which view it has \u2014 which is what stops the pygame\n        events reaching the game behind a DOM panel.\n        \"\"\"\n        return\n\n\ndef _handler(fn):\n    \"\"\"A Python function a browser can call.\n\n    create_proxy, where Pyodide offers it: a bare Python callable handed to\n    addEventListener is garbage-collected while the browser still holds a\n    reference to it, and the listener then fails on a later click rather\n    than at the point of the mistake.\n    \"\"\"\n    try:\n        from pyodide.ffi import create_proxy                    # noqa: PLC0415\n        return create_proxy(fn)\n    except Exception:                                           # noqa: BLE001\n        return fn\n", "webrun.py": "\"\"\"Running a kaypy game inside a web page.\n\nThis is what a built web page calls. It is a real module in the package,\nrather than a few lines of Python living inside an HTML template, for three\nreasons: it can be tested (tests/test_webrun.py), a traceback through it names\na file that exists, and the page that a browser IDE builds and the page that\n`kaypy web` builds can call exactly the same code instead of each carrying\ntheir own slightly different copy.\n\nTHE TWO HALVES\n\nA game runs in two steps, and keeping them apart is the whole design:\n\n    run(source)      the program's top level, once, top to bottom\n    await drive()    the frame loop, until the game ends\n\n`run` is what `python game.py` does before atexit fires: kaypy() builds the\nengine, everything after it registers handlers, and then it returns \u2014 with the\ngame built and not yet moving. `drive` sets it going.\n\nThey are separate so that a mistake in the setup is reported as a mistake in\nthe setup, with the student's own traceback, instead of arriving tangled up in\nwhatever the frame loop happened to be doing sixty times a second.\n\nWHY THE TRACEBACK IS TRIMMED\n\nAn error in a game reaches Python with this module, asyncio and the engine\nstacked above the one line the student wrote. Printed whole, the line that\nmatters is somewhere in the middle of twenty, and the first thing a beginner\nreads is a frame inside `kaypy/engine.py` \u2014 which reliably produces \"I think\nthe engine is broken\" rather than \"I think I made a mistake\". So frames\nbelonging to Python itself, to asyncio and to kaypy are dropped, and what is\nleft is the student's own program.\n\nThe engine's frames are kept when there are no others, because an error raised\ninside the engine with nothing of the student's on the stack is a kaypy bug\nand hiding it would be dishonest.\n\"\"\"\nfrom __future__ import annotations\n\nimport builtins\nimport linecache\nimport os\nimport sys\nimport traceback\nimport types\n\n#: The name a game's own code is compiled under, and what a traceback calls it.\nMAIN = \"main.py\"\n\n\ndef _own_frame(frame_summary, package_dir):\n    \"\"\"Is this frame the student's own code?\"\"\"\n    name = frame_summary.filename\n    if name == MAIN:\n        return True\n    # Anything inside the engine, the standard library or asyncio is ours.\n    if name.startswith(package_dir):\n        return False\n    return not (name.startswith(\"<\") or os.sep + \"asyncio\" + os.sep in name\n                or name.startswith(sys.prefix))\n\n\ndef format_error(err):\n    \"\"\"A traceback with the machinery taken out of it.\n\n    Returns the text to print. The exception's own line \u2014 `NameError: name\n    'plyer' is not defined` \u2014 is always the last line, because that is the one\n    a student can act on and it should be where they stop reading.\n    \"\"\"\n    package_dir = os.path.dirname(os.path.abspath(__file__))\n    frames = traceback.extract_tb(err.__traceback__)\n    mine = [f for f in frames if _own_frame(f, package_dir)]\n\n    # Nothing of theirs on the stack means this is the engine's fault, and\n    # saying so plainly beats printing an empty traceback.\n    shown = mine or frames\n    out = [\"Traceback:\"] if mine else [\n        \"Traceback (this one looks like a bug in kaypy itself):\"]\n    for f in shown:\n        where = (\"line %d\" % f.lineno if f.filename == MAIN\n                 else \"%s, line %d\" % (os.path.basename(f.filename), f.lineno))\n        out.append(\"  %s, in %s\" % (where, f.name))\n        if f.line:\n            out.append(\"    \" + f.line.strip())\n    out.append(\"%s: %s\" % (type(err).__name__, err))\n    return \"\\n\".join(out)\n\n\ndef run(source, filename=MAIN):\n    \"\"\"Run a game's top level. Returns \"ok\" or \"error\".\n\n    The program gets a real module to live in rather than a bare dict,\n    because the handlers it registers go on referring to its globals long\n    after this function has returned \u2014 a lambda in onKeyDown() is still\n    looking things up in there on the four hundredth frame. A dict that went\n    out of scope would take them with it.\n    \"\"\"\n    try:\n        code = compile(source, filename, \"exec\")\n    except SyntaxError as err:\n        line = err.lineno or 0\n        text = (err.text or \"\").rstrip()\n        message = \"SyntaxError on line %d: %s\" % (line, err.msg)\n        if text:\n            message += \"\\n    \" + text.strip()\n        print(message, file=sys.stderr)\n        return \"error\"\n\n    # So a traceback can quote the line it is pointing at. The source is not\n    # on any disk the browser can see, so linecache has to be told.\n    linecache.cache[filename] = (len(source), None, source.splitlines(True), filename)\n\n    module = types.ModuleType(\"__main__\")\n    module.__dict__[\"__builtins__\"] = builtins\n    module.__file__ = filename\n    sys.modules[\"__main__\"] = module\n\n    try:\n        exec(code, module.__dict__)\n        return \"ok\"\n    except SystemExit:\n        return \"ok\"\n    except BaseException as err:                   # noqa: BLE001\n        print(format_error(err), file=sys.stderr)\n        return \"error\"\n\n\nasync def drive():\n    \"\"\"Run the frame loop until the game ends. Returns \"ok\" or \"error\".\n\n    Awaited, so it does not return until the game is actually over. The page\n    can therefore tell the difference between a game that is playing and one\n    that has finished, which is what lets it put a \"play again\" button up\n    rather than leaving a dead canvas.\n    \"\"\"\n    from . import engine as _engine\n\n    game = _engine._engine\n    if game is None:\n        print(\"No game started. A kaypy program needs kaypy() before anything \"\n              \"else \u2014 see the guide, or `kaypy new` for a starter.\",\n              file=sys.stderr)\n        return \"error\"\n\n    try:\n        await game.run_async()\n        return \"ok\"\n    except BaseException as err:                   # noqa: BLE001\n        # An error inside a handler surfaces here, long after the line that\n        # registered it. Report it once and stop, rather than sixty identical\n        # tracebacks a second.\n        game._running = False\n        print(format_error(err), file=sys.stderr)\n        return \"error\"\n"};

var PROGRAM = "\"\"\"Dungeon Dash \u2014 five levels, five moves, one boss.\n\nCollect every coin on a level and the door opens. Each door gives you a new\nmove, and the next level has a coin you cannot reach without it.\n\n    arrow keys   run\n    space        jump        (press again in the air once you have the\n                             double jump, or next to a wall for a wall jump)\n    x            dash        (from level 3)\n\nHOW THIS FILE IS PUT TOGETHER\n\nRead it top to bottom. It goes:\n\n    1. the window and the pictures\n    2. what each letter in a picture turns into\n    3. the player, and the moves\n    4. the coins and the door\n    5. the enemies\n    6. the boss\n    7. start the game\n\nThe levels are pictures made of letters. Nothing in the game knows where any\nparticular coin is: it reads the picture and builds whatever it finds. So you\ncan move a coin by moving an 'o', and you never have to touch the code.\n\"\"\"\n\nfrom kaypy import *\n\n# --------------------------------------------------------------- 1. setup\n\nTILE = 48          # a tile is 48 pixels square\nACROSS = 20        # tiles across\nDOWN = 13          # tiles down\n\nkaypy(width=TILE * ACROSS, height=TILE * DOWN, background=[22, 20, 30])\nsetGravity(2400)\n\n# Sprites. Every path is written out in full, on purpose: the editor scans\n# this file for the names of the pictures it needs, and it can only see them\n# if they are plain text. Build a path with a loop or a % and the scan finds\n# nothing, so the game runs with no pictures at all.\nIDLE_RUN = {\"idle\": {\"from\": 0, \"to\": 3, \"speed\": 8, \"loop\": True},\n            \"run\": {\"from\": 4, \"to\": 7, \"speed\": 10, \"loop\": True}}\nIDLE = {\"idle\": {\"from\": 0, \"to\": 3, \"speed\": 8, \"loop\": True}}\n\nloadSprite(\"knight\", \"dungeon/knight_m.png\", sliceX=9, anims=IDLE_RUN)\nloadSprite(\"goblin\", \"dungeon/goblin.png\", sliceX=8, anims=IDLE_RUN)\nloadSprite(\"chort\", \"dungeon/chort.png\", sliceX=8, anims=IDLE_RUN)\nloadSprite(\"demon\", \"dungeon/big_demon.png\", sliceX=8, anims=IDLE_RUN)\nloadSprite(\"coin\", \"dungeon/dungeon_coin.png\", sliceX=4, anims=IDLE)\nloadSprite(\"wall\", \"dungeon/wall_mid.png\")\nloadSprite(\"door_shut\", \"dungeon/doors_leaf_closed.png\")\nloadSprite(\"door_open\", \"dungeon/doors_leaf_open.png\")\nloadSprite(\"heart_full\", \"dungeon/ui_heart_full.png\")\nloadSprite(\"heart_empty\", \"dungeon/ui_heart_empty.png\")\n\nloadSound(\"ding\", \"sounds/small_beep.wav\")\nloadSound(\"thump\", \"sounds/thump.wav\")\nloadSound(\"swoosh\", \"sounds/swing.wav\")\nloadSound(\"boom\", \"sounds/small_boom.wav\")\nloadSound(\"open\", \"sounds/electric_portal_open.wav\")\nloadSound(\"screech\", \"sounds/rising_beep.wav\")\n\n# The pictures. One letter is one tile.\n#\n#   #  wall      o  coin     P  you start here\n#   D  door      g  goblin   c  chort      B  boss\n#\n# A space is empty air. See levels.py for the full note on drawing these.\n\nLEVEL_1 = [\n    \"####################\",\n    \"#                  #\",\n    \"#                  #\",\n    \"#             o   D#\",\n    \"#            #######\",\n    \"#        o         #\",\n    \"#       #####      #\",\n    \"#     o#           #\",\n    \"#   #              #\",\n    \"#  ###             #\",\n    \"#       #          #\",\n    \"#      P   o   g   #\",\n    \"####################\",\n]\n\nLEVEL_2 = [\n    \"####################\",\n    \"#   o              #\",\n    \"#                  #\",\n    \"#  ###       o     #\",\n    \"#      ##    ####  #\",\n    \"#   o       #      #\",\n    \"#  ###             #\",\n    \"#             o   D#\",\n    \"#           ########\",\n    \"#     o            #\",\n    \"#   #####          #\",\n    \"#  P      g    c   #\",\n    \"####################\",\n]\n\nLEVEL_3 = [\n    \"####################\",\n    \"#                  #\",\n    \"# o            o  D#\",\n    \"# ##       #########\",\n    \"#                  #\",\n    \"#       # o        #\",\n    \"#        #####     #\",\n    \"#                  #\",\n    \"#    o             #\",\n    \"#   ####           #\",\n    \"#                  #\",\n    \"#  P  g    o   c   #\",\n    \"####################\",\n]\n\nLEVEL_4 = [\n    \"####################\",\n    \"#                  #\",\n    \"#  o           o  D#\",\n    \"#  ##          #####\",\n    \"#              #   #\",\n    \"#     o        #   #\",\n    \"#    ###       #   #\",\n    \"#              #   #\",\n    \"#        o     #   #\",\n    \"#      ####    #   #\",\n    \"#              #   #\",\n    \"#  P     g   c #####\",\n    \"####################\",\n]\n\nLEVEL_5 = [\n    \"####################\",\n    \"#                  #\",\n    \"#                  #\",\n    \"#   o          o   #\",\n    \"#  ####      ####  #\",\n    \"#                  #\",\n    \"#                  #\",\n    \"#      o    o      #\",\n    \"#    ####  ####    #\",\n    \"#                  #\",\n    \"#                  #\",\n    \"#  P     B         #\",\n    \"####################\",\n]\n\nLEVELS = [LEVEL_1, LEVEL_2, LEVEL_3, LEVEL_4, LEVEL_5]\n\n# The move each level gives you when you finish it.\nABILITIES = [\"jump\", \"double jump\", \"dash\", \"wall jump\", \"everything\"]\n\n\n# --------------------------------------------------------- 2. the settings\n\nSPEED = 270\nJUMP = 850\nDASH_SPEED = 900\nDASH_TIME = 0.16\nWALL_JUMP_GRACE = 0.15  # how long after touching a wall you may still push off\n\nGOBLIN_SPEED = 1.4      # how fast a goblin patrols. This is fed to\n                        # wave(), so it is how fast the SWING is, not\n                        # pixels per second: bigger is faster, and\n                        # about 1.4 is one round trip every 4 seconds.\nGOBLIN_RANGE = 2        # how many tiles either side of where it started\nCHORT_SPEED = 150       # how fast a chort chases\nCHORT_SIGHT = 6         # how many tiles away it notices you\nPLATFORM_RANGE = 3      # how many tiles a moving platform slides\nPLATFORM_SPEED = 1.2    # how fast it slides\n\nBOSS_HP = 6\nBOSS_WALK = 70\nBOSS_CHARGE = 420\nBOSS_WAIT = 3.0         # seconds between charges\nBOSS_TELL = 0.6         # warning before it charges\nBOSS_CHARGE_TIME = 0.9\n\n\n# ------------------------------------------- 3. what each letter turns into\n#\n# This is the whole join between the picture and the game.\n#\n# addLevel() walks the picture. Every time it meets a letter it looks it up\n# here and builds an object out of the list of parts it finds. A letter that\n# is not listed is ignored, which is why a space does nothing.\n#\n# Add a letter here and you can start drawing it in the levels straight away.\n# The `lambda:` in front of each list just means \"do not build it yet, build\n# one every time you find this letter\".\n\nTILES = {\n    # The dungeon itself.\n    \"#\": lambda: [sprite(\"wall\"), scale(3), area(), body(isStatic=True),\n                  \"wall\"],\n\n    # A platform that slides. isStatic keeps gravity off it so you can stand\n    # on it; it still moves, because nothing stops you changing a static\n    # object's position yourself. See slide() further down.\n    \"-\": lambda: [sprite(\"wall\"), scale(3), area(), body(isStatic=True),\n                  \"wall\", \"platform\"],\n\n    # What you are collecting, and what it opens.\n    \"o\": lambda: [sprite(\"coin\"), scale(3), area(), anchor(\"center\"), \"coin\"],\n    \"D\": lambda: [sprite(\"door_shut\"), scale(1.5), area(), anchor(\"bot\"),\n                  \"door\"],\n\n    # You. The player is a tile like everything else, so moving the 'P' in a\n    # picture is the whole of moving where you start.\n    \"P\": lambda: [sprite(\"knight\"), scale(3), area(), body(jumpForce=JUMP),\n                  anchor(\"bot\"), health(3), \"player\"],\n\n    # The monsters. They share the tag \"enemy\" so that one piece of code can\n    # say what happens when you touch any of them, and each has its own tag\n    # as well so that its own behaviour can find it.\n    \"g\": lambda: [sprite(\"goblin\"), scale(3), area(), body(), anchor(\"bot\"),\n                  \"enemy\", \"goblin\"],\n    \"c\": lambda: [sprite(\"chort\"), scale(3), area(), body(), anchor(\"bot\"),\n                  \"enemy\", \"chort\"],\n\n    # opacity(1) is on the boss so it can fade in and out when it is about to\n    # charge. Without the component you can still set boss.opacity and\n    # nothing happens -- no error, no fading, just a warning nobody sees.\n    \"B\": lambda: [sprite(\"demon\"), scale(3), area(), body(), anchor(\"bot\"),\n                  opacity(1), health(BOSS_HP), \"enemy\", \"boss\"],\n}\n\n\n# ------------------------------------------ 4. what the game has to remember\n#\n# Five things change while you play, so they are variables. Any function that\n# CHANGES one has to say `global` first -- that is Python's way of asking\n# \"the one at the top of the file, not a new one of my own\". A function that\n# only reads them does not need to say anything.\n#\n# WHICH WAY THE PLAYER IS FACING IS NOT HERE.\n#\n# It does not need to be: player.flipX is already true when the sprite is\n# facing left, so that IS which way you are facing. Keeping a second copy of\n# it would just be one more thing that can disagree with the picture on\n# screen.\n\nholding_left = False  # is the left arrow being held down?\nholding_right = False # is the right arrow being held down?\njumps_left = 1        # air jumps still available\ndash_left = 0         # seconds of dashing still to go\nwall_left = 0         # seconds you may still wall jump for\ncoins_collected = 0\nlevel_over = False\n\n# THESE TWO ARE COUNTDOWNS, NOT DEADLINES.\n#\n# They used to hold \"the time the dash ends\", worked out as time() + 0.16,\n# and every frame asked whether time() had got there yet. That breaks when\n# the level changes, because time() STARTS AGAIN AT ZERO on a new level:\n# a dash begun 25 seconds into level 3 left behind a deadline of 25.16,\n# the next level's clock started at 0, and the player dashed helplessly\n# across the room for the next 25 seconds.\n#\n# A countdown has nothing to compare against, so it cannot be wrong about\n# what time it is. It also reads better: \"how much dash is left\".\n\n\n# The scene is CALLED \"play\", but the function must not be, because kaypy\n# already has a play() for sounds. Naming the function play() quietly\n# replaced it, so every play(\"ding\") in here called this function instead\n# with \"ding\" as the level number -- and the game died on\n#\n#     TypeError: list indices must be integers or slices, not str\n#\n# pointing at the line LEVELS[number], which is nowhere near the mistake.\n@scene(\"play\")\ndef build_level(number):\n    picture = LEVELS[number]\n\n    addLevel(picture, {\n        \"tileWidth\": TILE,\n        \"tileHeight\": TILE,\n        \"pos\": vec2(0, 0),\n        \"tiles\": TILES,\n    })\n\n    global holding_left, holding_right\n    global jumps_left, dash_left, wall_left, coins_collected, level_over\n\n    # addLevel built the player out of the 'P' in the picture, along with\n    # everything else. get() finds it again by its tag.\n    player = get(\"player\")[0]\n    start = vec2(player.pos.x, player.pos.y)\n\n    # Start of a level, so everything the game remembers goes back to the\n    # beginning. These are the variables declared at the top of the file.\n    # Nothing is held at the start of a level. See the note by the arrow\n    # keys below for why this matters.\n    holding_left = False\n    holding_right = False\n\n    jumps_left = 1\n    dash_left = 0\n    wall_left = 0\n    coins_collected = 0\n    level_over = False\n\n    # Which moves you have depends only on which level you are on.\n    can_double_jump = number >= 1\n    can_dash = number >= 2\n    can_wall_jump = number >= 3\n\n    total_coins = len(get(\"coin\"))\n\n    # ------------------------------------------------------- the moves\n\n    # THE ARROW KEYS, REMEMBERED RATHER THAN ASKED ABOUT.\n    #\n    # The obvious way to do this is onKeyDown, which asks the computer \"is\n    # the right arrow down right now?\" every frame. It was written that way\n    # first, and it had a horrible bug.\n    #\n    # Walking into the door opens a message, and a message pauses the game.\n    # Let go of the arrow key while it is paused and the release can be\n    # missed -- and then the computer goes on insisting the key is still\n    # down. The next level began with the player sprinting right into a wall\n    # and no way to stop, because nothing was pressing anything.\n    #\n    # So the game keeps its own note of which arrow is held, from the moment\n    # it is pressed to the moment it is let go, and forgets both at the start\n    # of every level. A release that goes missing can no longer follow you\n    # into the next one.\n\n    @onKeyPress(\"left\")\n    def press_left():\n        global holding_left\n        holding_left = True\n\n    @onKeyRelease(\"left\")\n    def let_go_left():\n        global holding_left\n        holding_left = False\n\n    @onKeyPress(\"right\")\n    def press_right():\n        global holding_right\n        holding_right = True\n\n    @onKeyRelease(\"right\")\n    def let_go_right():\n        global holding_right\n        holding_right = False\n\n    @onKeyPress(\"space\")\n    def jump():\n        global jumps_left, wall_left\n\n        if level_over:\n            return\n\n        # On the ground: an ordinary jump, and your air jump comes back.\n        if player.isGrounded():\n            player.jump(JUMP)\n            jumps_left = 1\n            return\n\n        # Next to a wall: push off it, away from the way you are facing,\n        # and turn round. The little bit of time in wall_left is\n        # deliberate -- without it you would have to press space on the\n        # exact frame you touch the wall, which nobody can do.\n        if can_wall_jump and wall_left > 0:\n            player.jump(JUMP)\n            if player.flipX:\n                player.move(SPEED * 2, 0)\n            else:\n                player.move(-SPEED * 2, 0)\n            player.flipX = not player.flipX\n            wall_left = 0\n            play(\"swoosh\")\n            return\n\n        # In the air with a jump left: the double jump.\n        if can_double_jump and jumps_left > 0:\n            player.jump(JUMP)\n            jumps_left = jumps_left - 1\n\n    @onKeyPress(\"x\")\n    def dash():\n        global dash_left\n\n        if level_over or not can_dash:\n            return\n        if dash_left > 0:          # already dashing\n            return\n        dash_left = DASH_TIME\n        play(\"swoosh\")\n\n    @onUpdate\n    def each_frame():\n        global jumps_left, dash_left, wall_left\n\n        if level_over:\n            return\n\n        # Count both timers down. dt() is how long this frame took, so\n        # subtracting it each frame counts real seconds.\n        if dash_left > 0:\n            dash_left = dash_left - dt()\n        if wall_left > 0:\n            wall_left = wall_left - dt()\n\n        # Walking. Both at once cancel out, which is what a real keyboard\n        # does anyway.\n        if holding_left:\n            player.move(-SPEED, 0)\n            player.flipX = True\n        if holding_right:\n            player.move(SPEED, 0)\n            player.flipX = False\n\n        # A dash is just \"move very fast for a moment\", the way you face.\n        if dash_left > 0:\n            if player.flipX:\n                player.move(-DASH_SPEED, 0)\n            else:\n                player.move(DASH_SPEED, 0)\n\n        if player.isGrounded():\n            jumps_left = 1\n\n        # Fell off the bottom of the world.\n        if player.pos.y > TILE * DOWN + 100:\n            hurt_player()\n\n    @player.onCollide(\"wall\")\n    def touched_wall(wall):\n        # Note down WHEN a wall was last touched, and for a fraction of a\n        # second afterwards that still counts. That is what makes a wall\n        # jump possible to hit.\n        #\n        # Which side the wall is on does not need noting: you got there by\n        # moving into it, so it is the way you are already facing.\n        global wall_left\n\n        if player.isGrounded():\n            return\n        wall_left = WALL_JUMP_GRACE\n\n    # ------------------------------------------------- coins and the door\n\n    label = add([\n        text(\"0 / \" + str(total_coins), size=24),\n        pos(16, 14),\n        fixed(),\n        z(100),\n    ])\n\n    @player.onCollide(\"coin\")\n    def got_coin(coin):\n        global coins_collected\n\n        coin.destroy()\n        coins_collected = coins_collected + 1\n        label.text = str(coins_collected) + \" / \" + str(total_coins)\n        play(\"ding\")\n\n        if coins_collected >= total_coins:\n            for door in get(\"door\"):\n                door.use(sprite(\"door_open\"))\n            play(\"open\")\n\n    @player.onCollide(\"door\")\n    def reached_door(door):\n        # The door is there the whole time. It only works once every coin is\n        # collected -- that is the whole gate.\n        global level_over\n\n        if coins_collected < total_coins:\n            return\n        level_over = True\n        if number + 1 < len(LEVELS):\n            say(\"Level \" + str(number + 1) + \" done!\\n\\nYou can now: \"\n                + ABILITIES[number + 1],\n                then=lambda answer: go(\"play\", number + 1))\n        else:\n            say(\"You win!\", then=lambda answer: go(\"play\", 0))\n\n    # ------------------------------------------------------- getting hurt\n\n    def hurt_player():\n        global level_over\n\n        if level_over:\n            return\n        player.hurt(1)\n        shake(10)\n        play(\"thump\")\n        if player.hp <= 0:\n            level_over = True\n            say(\"The dungeon wins this time.\",\n                then=lambda answer: go(\"play\", number))\n        else:\n            player.pos = vec2(start.x + TILE / 2, start.y + TILE)\n\n    @player.onCollide(\"enemy\")\n    def touched_enemy(enemy):\n        # Landing on top of something is a stomp, not a mistake. Anything\n        # else hurts.\n        if player.pos.y < enemy.pos.y - TILE / 2:\n            if enemy.is_(\"boss\"):\n                enemy.hurt(1)\n                player.jump(JUMP * 0.7)\n                play(\"boom\")\n                shake(6)\n            else:\n                enemy.destroy()\n                player.jump(JUMP * 0.7)\n                play(\"boom\")\n        else:\n            hurt_player()\n\n    # ------------------------------------------------------- 5. the enemies\n    #\n    # Each enemy gets its own onUpdate, which runs every frame for that one\n    # enemy.\n    #\n    # NOTHING IS STORED ON THE ENEMY ITSELF.\n    #\n    # A goblin needs to know where it started, and that is handed to its\n    # function as an ordinary argument with a default value -- home=g.pos.x\n    # is worked out once, now, and the function keeps it. The same trick as\n    # g=goblin on the line above, and for the same reason.\n\n    for goblin in get(\"goblin\"):\n\n        @goblin.onUpdate\n        def patrol(g=goblin, home=goblin.pos.x):\n            # g=goblin is not a typo. Without it every one of these\n            # functions would share the SAME goblin -- whichever one the\n            # loop finished on -- and all the others would stand still.\n            #\n            # wave() swings a number between two values forever, so this one\n            # line is the whole patrol. It is the same function the moving\n            # platforms use.\n            left = home - GOBLIN_RANGE * TILE\n            right = home + GOBLIN_RANGE * TILE\n            g.pos.x = wave(left, right, time() * GOBLIN_SPEED)\n\n            # Which way to face: work out where it will be in a moment, and\n            # if that is further left than it is now, it is walking left.\n            soon = wave(left, right, (time() + 0.05) * GOBLIN_SPEED)\n            g.flipX = soon < g.pos.x\n\n    for chort in get(\"chort\"):\n\n        @chort.onUpdate\n        def chase(c=chort):\n            if player.pos.dist(c.pos) > CHORT_SIGHT * TILE:\n                c.play(\"idle\")\n                return\n            c.play(\"run\")\n            if player.pos.x > c.pos.x:\n                c.move(CHORT_SPEED, 0)\n                c.flipX = False\n            else:\n                c.move(-CHORT_SPEED, 0)\n                c.flipX = True\n\n    # ---------------------------------------------- the moving platforms\n\n    for platform in get(\"platform\"):\n\n        @platform.onUpdate\n        def slide(p=platform, home=platform.pos.x):\n            was = p.pos.x\n            p.pos.x = wave(home - PLATFORM_RANGE * TILE / 2,\n                           home + PLATFORM_RANGE * TILE / 2,\n                           time() * PLATFORM_SPEED)\n\n            # CARRY WHOEVER IS STANDING ON IT.\n            #\n            # Without these lines the platform slides out from under your\n            # feet and you drop off, which feels broken rather than hard.\n            # You are \"on it\" if you are just above it and roughly over it.\n            moved = p.pos.x - was\n            above = player.pos.y <= p.pos.y + 4\n            over = abs(player.pos.x - p.pos.x) < TILE\n            if above and over and player.isGrounded():\n                player.pos.x = player.pos.x + moved\n\n    # ---------------------------------------------------------- 6. the boss\n    #\n    # The boss works on a rhythm rather than on remembered timers: the whole\n    # fight is \"where are we in the current cycle?\", which time() answers on\n    # its own. A cycle is walk, then a warning flash, then a charge.\n\n    BOSS_CYCLE = BOSS_WAIT + BOSS_TELL + BOSS_CHARGE_TIME\n\n    for boss in get(\"boss\"):\n\n        @boss.onUpdate\n        def fight(b=boss):\n            # How far through the current cycle we are. % gives the\n            # remainder, so this counts 0, 0.1, 0.2 ... up to BOSS_CYCLE and\n            # then starts again, forever.\n            point = time() % BOSS_CYCLE\n\n            if point < BOSS_WAIT:\n                # Walking. This is the only part that chooses a direction,\n                # so the charge below simply keeps going the way it ended up\n                # facing.\n                b.play(\"run\")\n                b.opacity = 1\n                b.flipX = player.pos.x < b.pos.x\n                if b.flipX:\n                    b.move(-BOSS_WALK, 0)\n                else:\n                    b.move(BOSS_WALK, 0)\n\n            elif point < BOSS_WAIT + BOSS_TELL:\n                # The warning. It stands still and flashes, so the charge can\n                # be learned instead of being a surprise.\n                b.play(\"idle\")\n                b.opacity = 0.4 + 0.6 * abs(wave(-1, 1, time() * 20))\n\n            else:\n                # The charge, straight ahead, fast.\n                b.play(\"run\")\n                b.opacity = 1\n                if b.flipX:\n                    b.move(-BOSS_CHARGE, 0)\n                else:\n                    b.move(BOSS_CHARGE, 0)\n\n        @boss.onDeath\n        def boss_died(b=boss):\n            global level_over\n\n            addKaboom(b.pos)\n            play(\"boom\")\n            shake(20)\n            b.destroy()\n            level_over = True\n            say(\"You beat the dungeon!\", then=lambda answer: go(\"play\", 0))\n\n    # ---------------------------------------------------------- the hearts\n\n    @onDraw\n    def draw_hearts():\n        # drawSprite paints one frame straight onto the screen without making\n        # a game object for it. A heart is a mark on the screen, not a thing\n        # in the dungeon, so it does not need to be an object.\n        heart = 0\n        while heart < 3:\n            if heart < player.hp:\n                name = \"heart_full\"\n            else:\n                name = \"heart_empty\"\n            drawSprite(name, pos=vec2(width() - 130 + heart * 40, 18),\n                       width=32, height=30, fixed=True)\n            heart = heart + 1\n\n\ngo(\"play\", 0)\n";

var LIB = "/lib";                 // where the engine goes
var PROJECT = "/project";         // the game's working directory

var statusEl = document.getElementById("status");
var errorEl = document.getElementById("error");
var canvas = document.getElementById("canvas");

function fail(message) {
  statusEl.hidden = true;
  errorEl.style.display = "block";
  errorEl.textContent += message;
}

function writeFile(py, path, contents) {
  py.FS.mkdirTree(path.slice(0, path.lastIndexOf("/")));
  py.FS.writeFile(path, contents);
}

function decode(b64) {
  var binary = atob(b64);
  var out = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
  return out;
}

(async function () {
  try {
    var py = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v314.0.6/full/" });

    // Set before anything runs. An error inside a handler arrives long after
    // the program finished, so this shows whatever turns up whenever it turns
    // up rather than checking once and never looking again.
    py.setStderr({ batched: function (s) { fail(s + "\n"); } });

    // print() goes to the browser's console, not onto the page.
    //
    // A published game should be the game. Anything drawn below the canvas
    // shows up inside the iframe on itch.io and everywhere else that hosts a
    // single HTML file, and the first thing it would have shown is not even
    // the game's doing: `import pygame` greets stdout with its version and
    // SDL build every time, so every exported game opened with a grey box
    // under it reading "pygame-ce 2.5.8 (SDL 2.32.10, Python 3.13)".
    //
    // Nothing is lost. Whoever wants print() output is debugging, and a
    // developer console is where they are already looking.
    py.setStdout({ batched: function (s) { console.log(s); } });

    statusEl.textContent = "Loading the game engine…";
    // Pyodide's own build. pygame-ce is a compiled C extension, so it cannot
    // come from PyPI — micropip could not install it here even if it tried.
    await py.loadPackage("pygame-ce");

    statusEl.textContent = "Unpacking…";
    Object.keys(ENGINE).forEach(function (rel) {
      writeFile(py, LIB + "/kaypy/" + rel, ENGINE[rel]);
    });

    // The assets land at exactly the paths the program names, under the
    // directory it is run from. Nothing in the program is rewritten.
    Object.keys(ASSETS).forEach(function (path) {
      writeFile(py, PROJECT + "/" + path, decode(ASSETS[path]));
    });

    py.runPython(
      "import sys, os\n" +
      "if " + JSON.stringify(LIB) + " not in sys.path:\n" +
      "    sys.path.insert(0, " + JSON.stringify(LIB) + ")\n" +
      "os.makedirs(" + JSON.stringify(PROJECT) + ", exist_ok=True)\n" +
      "os.chdir(" + JSON.stringify(PROJECT) + ")\n" +
      // Their own .py files next to the game are importable, which is what
      // makes a two-file game work. chdir alone would not do it: Python
      // searches sys.path, not the working directory.
      "if " + JSON.stringify(PROJECT) + " not in sys.path:\n" +
      "    sys.path.insert(0, " + JSON.stringify(PROJECT) + ")\n" +
      // No __pycache__. A stale .pyc in a virtual filesystem is a miserable
      // thing to debug and nobody can see the directory to clear it.
      "sys.dont_write_bytecode = True\n"
    );

    // Pyodide's opt-in for SDL: without it, a main loop that hands control
    // back to the browser each frame is treated as a fatal unwind. Documented
    // as experimental, and it is what makes a frame loop possible at all.
    try { py._api._skip_unwind_fatal_error = true; } catch (e) { /* older */ }
    if (py.canvas && py.canvas.setCanvas2D) py.canvas.setCanvas2D(canvas);

    canvas.hidden = false;
    statusEl.hidden = true;

    // Two steps, so a mistake in the setup is reported as a mistake in the
    // setup rather than arriving tangled up in the frame loop. Both live in
    // kaypy/webrun.py, which shipped inside ENGINE above.
    py.globals.set("_kaypy_source", PROGRAM);
    var status = py.runPython(
      "from kaypy import webrun\n" +
      "webrun.run(_kaypy_source)\n"
    );
    if (status === "ok") {
      await py.runPythonAsync("await webrun.drive()");
    }
  } catch (e) {
    fail(String((e && e.message) || e));
  }
})();
