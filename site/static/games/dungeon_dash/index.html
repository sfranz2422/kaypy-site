 them; see `_thickness` for the things that cannot.\"\"\"\n    point = pos if isinstance(pos, Vec2) else Vec2(pos[0], pos[1])\n    if fixed:\n        return point, Vec2(1.0, 1.0)\n    return camera.world_to_screen(point), camera.scale\n\n\ndef _thickness(zoom):\n    \"\"\"One number, for things that only have one.\n\n    A line's width, a corner radius, the size of a letter: none of these can\n    be two different numbers, however the camera is stretched, because\n    nothing in pygame can draw a line that is thicker across than along. The\n    smaller of the two axes is the safe answer \u2014 the larger makes an outline\n    swell out past the shape it is supposed to be edging.\"\"\"\n    return min(zoom.x, zoom.y)\n\n\ndef _colour(color, opacity):\n    from .helpers import rgb\n\n    r, g, b = rgb(color) if color is not None else (255, 255, 255)\n    if opacity >= 1:\n        return (int(r), int(g), int(b))\n    return (int(r), int(g), int(b), max(0, int(255 * opacity)))\n\n\ndef _put(screen, surf, at, anchor):\n    \"\"\"Blit so that `at` lands on the named anchor point of the surface.\n\n    Through AnchorComp's own resolver rather than a second table of names, so\n    `anchor=\"botright\"` means here exactly what it means on a game object \u2014\n    including raising the same error for a name that does not exist.\n    \"\"\"\n    from .comps.transform import AnchorComp\n\n    a = AnchorComp(anchor).anchor\n    ox = (a.x + 1) / 2 * surf.get_width()\n    oy = (a.y + 1) / 2 * surf.get_height()\n    screen.blit(surf, (at.x - ox, at.y - oy))\n\n\n# --------------------------------------------------------------- shapes\n\ndef drawRect(pos=None, width=0, height=0, color=None, opacity=1.0,\n             anchor=\"topleft\", radius=0, outline=0, fixed=False):\n    \"\"\"A rectangle. `radius` rounds the corners; `outline` draws only the edge.\"\"\"\n    screen, camera = _surface(\"drawRect\")\n    at, zoom = _place(pos or Vec2(0, 0), fixed, camera)\n    w, h = max(1, int(width * zoom.x)), max(1, int(height * zoom.y))\n    thick = _thickness(zoom)\n\n    surf = pygame.Surface((w, h), pygame.SRCALPHA)\n    pygame.draw.rect(surf, _colour(color, opacity), pygame.Rect(0, 0, w, h),\n                     width=int(outline * thick),\n                     border_radius=int(radius * thick))\n    _put(screen, surf, at, anchor)\n\n\ndef drawCircle(pos=None, radius=0, color=None, opacity=1.0, outline=0,\n               fixed=False):\n    \"\"\"A circle, centred on `pos`.\"\"\"\n    screen, camera = _surface(\"drawCircle\")\n    at, zoom = _place(pos or Vec2(0, 0), fixed, camera)\n    # A circle in a world stretched twice as wide is an ellipse, the same\n    # way a square in it is an oblong. Drawing it as a circle of some\n    # average radius would leave it the one shape on screen that did not\n    # agree with the camera.\n    rx = max(1, int(radius * zoom.x))\n    ry = max(1, int(radius * zoom.y))\n\n    surf = pygame.Surface((rx * 2, ry * 2), pygame.SRCALPHA)\n    box = pygame.Rect(0, 0, rx * 2, ry * 2)\n    edge = int(outline * _thickness(zoom))\n    if rx == ry:\n        pygame.draw.circle(surf, _colour(color, opacity), (rx, ry), rx,\n                           width=edge)\n    else:\n        pygame.draw.ellipse(surf, _colour(color, opacity), box, width=edge)\n    screen.blit(surf, (at.x - rx, at.y - ry))\n\n\ndef drawLine(p1=None, p2=None, width=1, color=None, opacity=1.0, fixed=False):\n    \"\"\"A line from one point to another.\"\"\"\n    screen, camera = _surface(\"drawLine\")\n    a, zoom = _place(p1 or Vec2(0, 0), fixed, camera)\n    b, _ = _place(p2 or Vec2(0, 0), fixed, camera)\n    thickness = max(1, int(width * _thickness(zoom)))\n\n    if opacity >= 1:\n        pygame.draw.line(screen, _colour(color, 1.0),\n                         (a.x, a.y), (b.x, b.y), thickness)\n        return\n    # A translucent line needs its own surface; pygame.draw ignores alpha on\n    # the display surface.\n    surf = pygame.Surface(screen.get_size(), pygame.SRCALPHA)\n    pygame.draw.line(surf, _colour(color, opacity),\n                     (a.x, a.y), (b.x, b.y), thickness)\n    screen.blit(surf, (0, 0))\n\n\ndef drawLines(points=None, width=1, color=None, opacity=1.0, close=False,\n              fixed=False):\n    \"\"\"A run of connected lines. `close` joins the last point back to the first.\"\"\"\n    pts = list(points or [])\n    if len(pts) < 2:\n        return\n    pairs = list(zip(pts, pts[1:]))\n    if close:\n        pairs.append((pts[-1], pts[0]))\n    for a, b in pairs:\n        drawLine(p1=a, p2=b, width=width, color=color, opacity=opacity,\n                 fixed=fixed)\n\n\n# ----------------------------------------------------------------- text\n\ndef drawText(text=\"\", pos=None, size=22, color=None, opacity=1.0,\n             anchor=\"topleft\", fixed=False):\n    \"\"\"Some words. Same font as the text() component.\"\"\"\n    from .engine import current_engine\n\n    screen, camera = _surface(\"drawText\")\n    at, zoom = _place(pos or Vec2(0, 0), fixed, camera)\n\n    font = current_engine()._get_font(max(1, int(size * _thickness(zoom))))\n    surf = font.render(str(text), True, _colour(color, 1.0)[:3])\n    if opacity < 1:\n        surf = surf.copy()\n        surf.set_alpha(max(0, int(255 * opacity)))\n    _put(screen, surf, at, anchor)\n\n\n# --------------------------------------------------------------- sprites\n\ndef drawSprite(sprite=\"\", pos=None, frame=0, width=None, height=None,\n               opacity=1.0, anchor=\"topleft\", angle=0, fixed=False):\n    \"\"\"One frame of a loaded sprite, without making an object for it.\"\"\"\n    from .engine import current_engine\n\n    screen, camera = _surface(\"drawSprite\")\n    at, zoom = _place(pos or Vec2(0, 0), fixed, camera)\n\n    asset = current_engine().assets.get_sprite(sprite)\n    index = max(0, min(int(frame), len(asset.frames) - 1))\n    surf = asset.frames[index]\n\n    w = (width if width is not None else surf.get_width()) * zoom.x\n    h = (height if height is not None else surf.get_height()) * zoom.y\n    if (int(w), int(h)) != surf.get_size():\n        surf = pygame.transform.scale(surf, (max(1, int(w)), max(1, int(h))))\n    if angle:\n        surf = pygame.transform.rotate(surf, -angle)\n    if opacity < 1:\n        surf = surf.copy()\n        surf.set_alpha(max(0, int(255 * opacity)))\n    _put(screen, surf, at, anchor)\n", "easings.py": "\"\"\"The easing curves \u2014 the shape of a tween's motion.\n\nA tween without one moves at a flat, constant rate, which is the single\nmotion that reads as \"a computer did this\". `easeOut...` arrives slowing\ndown, which is what most things in life do; `easeOutBack` and\n`easeOutElastic` overshoot and spring back.\n\nEvery curve maps 0\u20131 to 0\u20131, is exactly 0 at 0 and exactly 1 at 1, and is\nnamed as Kaplay names it, so a curve looked up in Kaplay's documentation is\nthe curve you get here. The formulas are the standard ones from\neasings.net, which is where Kaplay's came from too.\n\nReached as an object \u2014 `easings.easeOutBounce` \u2014 rather than as thirty-one\nloose names, because that is how Kaplay spells it and because\n`from kaypy import *` should not put `easeInOutQuint` in a student's\nnamespace.\n\"\"\"\nimport math\n\n_C1 = 1.70158\n_C2 = _C1 * 1.525\n_C3 = _C1 + 1\n_C4 = 2 * math.pi / 3\n_C5 = 2 * math.pi / 4.5\n\n\ndef linear(t):\n    return t\n\n\ndef easeInSine(t):\n    return 1 - math.cos(t * math.pi / 2)\n\n\ndef easeOutSine(t):\n    return math.sin(t * math.pi / 2)\n\n\ndef easeInOutSine(t):\n    return -(math.cos(math.pi * t) - 1) / 2\n\n\ndef easeInQuad(t):\n    return t * t\n\n\ndef easeOutQuad(t):\n    return 1 - (1 - t) ** 2\n\n\ndef easeInOutQuad(t):\n    return 2 * t * t if t < 0.5 else 1 - (-2 * t + 2) ** 2 / 2\n\n\ndef easeInCubic(t):\n    return t ** 3\n\n\ndef easeOutCubic(t):\n    return 1 - (1 - t) ** 3\n\n\ndef easeInOutCubic(t):\n    return 4 * t ** 3 if t < 0.5 else 1 - (-2 * t + 2) ** 3 / 2\n\n\ndef easeInQuart(t):\n    return t ** 4\n\n\ndef easeOutQuart(t):\n    return 1 - (1 - t) ** 4\n\n\ndef easeInOutQuart(t):\n    return 8 * t ** 4 if t < 0.5 else 1 - (-2 * t + 2) ** 4 / 2\n\n\ndef easeInQuint(t):\n    return t ** 5\n\n\ndef easeOutQuint(t):\n    return 1 - (1 - t) ** 5\n\n\ndef easeInOutQuint(t):\n    return 16 * t ** 5 if t < 0.5 else 1 - (-2 * t + 2) ** 5 / 2\n\n\ndef easeInExpo(t):\n    return 0 if t == 0 else 2 ** (10 * t - 10)\n\n\ndef easeOutExpo(t):\n    return 1 if t == 1 else 1 - 2 ** (-10 * t)\n\n\ndef easeInOutExpo(t):\n    if t == 0:\n        return 0\n    if t == 1:\n        return 1\n    return 2 ** (20 * t - 10) / 2 if t < 0.5 else (2 - 2 ** (-20 * t + 10)) / 2\n\n\ndef easeInCirc(t):\n    return 1 - math.sqrt(1 - t * t)\n\n\ndef easeOutCirc(t):\n    return math.sqrt(1 - (t - 1) ** 2)\n\n\ndef easeInOutCirc(t):\n    if t < 0.5:\n        return (1 - math.sqrt(1 - (2 * t) ** 2)) / 2\n    return (math.sqrt(1 - (-2 * t + 2) ** 2) + 1) / 2\n\n\ndef easeInBack(t):\n    return _C3 * t ** 3 - _C1 * t * t\n\n\ndef easeOutBack(t):\n    return 1 + _C3 * (t - 1) ** 3 + _C1 * (t - 1) ** 2\n\n\ndef easeInOutBack(t):\n    if t < 0.5:\n        return ((2 * t) ** 2 * ((_C2 + 1) * 2 * t - _C2)) / 2\n    return ((2 * t - 2) ** 2 * ((_C2 + 1) * (t * 2 - 2) + _C2) + 2) / 2\n\n\ndef easeInElastic(t):\n    if t == 0:\n        return 0\n    if t == 1:\n        return 1\n    return -(2 ** (10 * t - 10)) * math.sin((t * 10 - 10.75) * _C4)\n\n\ndef easeOutElastic(t):\n    if t == 0:\n        return 0\n    if t == 1:\n        return 1\n    return 2 ** (-10 * t) * math.sin((t * 10 - 0.75) * _C4) + 1\n\n\ndef easeInOutElastic(t):\n    if t == 0:\n        return 0\n    if t == 1:\n        return 1\n    if t < 0.5:\n        return -(2 ** (20 * t - 10) * math.sin((20 * t - 11.125) * _C5)) / 2\n    return (2 ** (-20 * t + 10) * math.sin((20 * t - 11.125) * _C5)) / 2 + 1\n\n\ndef easeOutBounce(t):\n    n1, d1 = 7.5625, 2.75\n    if t < 1 / d1:\n        return n1 * t * t\n    if t < 2 / d1:\n        t -= 1.5 / d1\n        return n1 * t * t + 0.75\n    if t < 2.5 / d1:\n        t -= 2.25 / d1\n        return n1 * t * t + 0.9375\n    t -= 2.625 / d1\n    return n1 * t * t + 0.984375\n\n\ndef easeInBounce(t):\n    return 1 - easeOutBounce(1 - t)\n\n\ndef easeInOutBounce(t):\n    if t < 0.5:\n        return (1 - easeOutBounce(1 - 2 * t)) / 2\n    return (1 + easeOutBounce(2 * t - 1)) / 2\n\n\nclass _Easings:\n    \"\"\"The curves, as attributes, with a readable error for a typo.\n\n    A misspelled curve would otherwise be an AttributeError naming a module,\n    which tells a student nothing about which names exist.\n    \"\"\"\n\n    def __getattr__(self, name):\n        raise AttributeError(\n            \"No easing called %r. They are named easeIn/easeOut/easeInOut \"\n            \"plus one of Sine, Quad, Cubic, Quart, Quint, Expo, Circ, Back, \"\n            \"Elastic, Bounce \u2014 or easings.linear for no easing at all.\" % name\n        )\n\n\neasings = _Easings()\nfor _name, _fn in list(globals().items()):\n    if _name.startswith(\"ease\") or _name == \"linear\":\n        setattr(easings, _name, _fn)\n\n#: Every curve by name, for anything that wants to enumerate them.\nALL = {n: getattr(easings, n) for n in dir(easings) if not n.startswith(\"_\")}\n", "engine.py": "\"\"\"The engine singleton. kaypy(...) creates it and starts the game the\nmoment the rest of the script finishes running \u2014 there is no run() call\nanywhere in the Kaplay guide.\n\nOn native CPython, atexit gets us this for free: kaypy() registers the\nframe loop and it fires once your script's top level finishes.\n\nIn a browser (sys.platform == \"emscripten\") that trick is no use, and\nkaypy() skips atexit entirely there. Two reasons, either one sufficient.\n\nThe plain one: a browser tab's Python interpreter does not exit, so an\natexit handler is a frame loop that never starts.\n\nThe historical one, kept because it explains why the check is a hard skip\nrather than a try/except: this used to run under pygbag, which replaced\nthe stdlib atexit module with its own (support/cross/aio/atexit.py in\n0.9.3) whose register() closed over an undefined `arg` instead of `args`\n\u2014 so merely *calling* atexit.register() there raised NameError before\nthe game had drawn a frame. tests/test_web_platform_guard.py still holds\nthat line down.\n\nWhatever starts the game on the web calls run_async() explicitly\ninstead. That is kaypy/webrun.py, which is what the page built by\n`kaypy web` calls, and what a browser IDE embedding kaypy calls too.\"\"\"\nfrom __future__ import annotations\nimport asyncio\nimport sys\nimport random as _random\n\nimport pygame\n\nfrom .vec2 import Vec2\nfrom .gameobj import GameObj\nfrom .assets import AssetManager\nfrom .events import EventManager\nfrom .timers import TimerManager\nfrom .camera import Camera\nfrom .physics import PhysicsSystem, CollisionSystem\nfrom .render import RenderSystem\nfrom .debugmod import debug\n\n_engine: \"Engine | None\" = None\n\n\ndef current_engine() -> \"Engine\":\n    if _engine is None:\n        raise RuntimeError(\"kaypy(...) must run before anything else in a Kaplay script\")\n    return _engine\n\n\nclass SoundHandle:\n    def __init__(self, sound, loop=False, paused=False, volume=1.0):\n        self._channel = None\n        self._volume = volume\n        self._paused = paused\n        if sound is not None:\n            self._channel = sound.play(loops=-1 if loop else 0)\n            if self._channel:\n                self._channel.set_volume(volume)\n                if paused:\n                    self._channel.pause()\n\n    @property\n    def paused(self):\n        return self._paused\n\n    @paused.setter\n    def paused(self, value):\n        self._paused = value\n        if self._channel:\n            if value:\n                self._channel.pause()\n            else:\n                self._channel.unpause()\n\n    @property\n    def volume(self):\n        return self._volume\n\n    @volume.setter\n    def volume(self, value):\n        self._volume = value\n        if self._channel:\n            self._channel.set_volume(value)\n\n\nclass Engine:\n    def __init__(self, width=800, height=600, background=(0, 0, 0),\n                 joystick=False):\n        global _engine\n        _engine = self\n\n        pygame.init()\n        try:\n            pygame.mixer.init()\n        except pygame.error:\n            pass  # no audio device (e.g. headless/CI) \u2014 sounds become silent no-ops\n\n        self._width = width\n        self._height = height\n        self._background = tuple(background)\n        self.screen = pygame.display.set_mode((width, height))\n        pygame.display.set_caption(\"kaypy\")\n        self.clock = pygame.time.Clock()\n\n        self.assets = AssetManager()\n        self.events = EventManager()\n        self.timers = TimerManager()\n        self.camera = Camera(width, height)\n        self.physics = PhysicsSystem()\n        self.collision = CollisionSystem()\n        self.render = RenderSystem()\n\n        # A panel belongs to a game, not to a page. In a browser IDE the\n        # page outlives the game \u2014 press Run twice and this constructor runs\n        # again \u2014 so a panel left up by the last run would still be on screen,\n        # holding the keyboard, over a game that no longer exists.\n        from . import panel as _panel\n        _panel.reset()\n\n        self._objs: list[GameObj] = []\n        self._scenes: dict[str, callable] = {}\n        self._current_scene = None\n        self._dt = 0.0\n        # Game time, not wall time: it advances with the frames, so it stops\n        # when the game does. A sine wave driven by wall time jumps when a\n        # paused game resumes.\n        self._elapsed = 0.0\n        self._running = True\n        self._started = False\n        self._paused = False\n        self._font_cache = {}\n\n        # An on-screen d-pad, for playing with a thumb. It holds keys down on\n        # the game's behalf, so nothing else in the engine has to know it\n        # exists \u2014 see kaypy/joystick.py.\n        self.joystick = None\n        if joystick:\n            from .joystick import Joystick\n            buttons = None if joystick is True else joystick\n            self.joystick = Joystick(width, height, buttons)\n        self.is_web = sys.platform == \"emscripten\"\n\n        if not self.is_web:\n            # Native only \u2014 see the module docstring for why this is\n            # unsafe under pygbag's own atexit replacement.\n            import atexit\n            atexit.register(self._atexit_run)\n\n    # ---- values ------------------------------------------------------------\n\n    def width(self):\n        return self._width\n\n    def height(self):\n        return self._height\n\n    def center(self) -> Vec2:\n        return Vec2(self._width / 2, self._height / 2)\n\n    def dt(self):\n        return self._dt\n\n    # ---- pause -------------------------------------------------------------\n    #\n    # Pausing freezes the world and leaves the picture up: timers, physics,\n    # collisions and every onUpdate stop, and the frame is still drawn, so\n    # the game sits there behind whatever you put on top of it.\n    #\n    # Input keeps being delivered while paused. That is deliberate \u2014 a pause\n    # menu that cannot hear the key that un-pauses it is not a pause menu \u2014\n    # and it is harmless because dt is zero, so a handler that moves the\n    # player moves it nowhere. See _main_loop.\n\n    def pause(self):\n        self._paused = True\n\n    def resume(self):\n        self._paused = False\n\n    def isPaused(self):\n        return self._paused\n\n    def elapsed(self):\n        return self._elapsed\n\n    def mousePos(self) -> Vec2:\n        x, y = pygame.mouse.get_pos()\n        return Vec2(x, y)\n\n    def toWorld(self, screen_pos) -> Vec2:\n        return self.camera.screen_to_world(screen_pos)\n\n    def setGravity(self, n):\n        self.physics.gravity = n\n\n    def setBackground(self, r, g=None, b=None):\n        \"\"\"The background colour, in any spelling rgb() accepts.\n\n        Three numbers, a hex string, one number for a grey, or one of the\n        named constants: setBackground(BLUE). Left as three required numbers\n        it would have been the one colour-taking name where a constant did\n        not work, which is worse than not having constants at all.\n        \"\"\"\n        from .helpers import rgb\n        self._background = rgb(r, g, b)\n\n    def setCamPos(self, pos):\n        self.camera.setPos(pos)\n\n    def setCamScale(self, n):\n        self.camera.setScale(n)\n\n    def shake(self, n=8):\n        self.camera.shake(n)\n\n    def _virtual_key(self, code, down):\n        \"\"\"The joystick pressed or released a key.\n\n        A real pygame event is posted so that onKeyPress and onKeyRelease \u2014\n        which read the event queue rather than asking what is held \u2014 fire\n        exactly as they would for the keyboard.\n        \"\"\"\n        try:\n            kind = pygame.KEYDOWN if down else pygame.KEYUP\n            pygame.event.post(pygame.event.Event(kind, key=code, mod=0,\n                                                 unicode=\"\"))\n        except pygame.error:\n            pass\n\n    def _get_font(self, size):\n        f = self._font_cache.get(size)\n        if f is None:\n            f = pygame.font.SysFont(None, size)\n            self._font_cache[size] = f\n        return f\n\n    # ---- object tree ---------------------------------------------------------\n\n    def add(self, comp_list) -> GameObj:\n        obj = GameObj(comp_list)\n        obj._engine = self\n        self._register(obj)\n        return obj\n\n    def _register(self, obj: GameObj):\n        self._objs.append(obj)\n\n    def _unregister(self, obj: GameObj):\n        try:\n            self._objs.remove(obj)\n        except ValueError:\n            pass\n\n    def get(self, tag: str):\n        return [o for o in self._objs if o.exists() and o.is_(tag)]\n\n    # ---- scenes ----------------------------------------------------------\n\n    def scene(self, name, fn):\n        self._scenes[name] = fn\n\n    def go(self, name, *args):\n        if name not in self._scenes:\n            raise KeyError(\n                f\"no scene called {name!r} \u2014 register it with scene({name!r}, fn) first\"\n            )\n        self._clear_scene()\n        self._current_scene = name\n        self._scenes[name](*args)\n\n    def _clear_scene(self):\n        # A panel does not survive go(). Everything it was asking about is\n        # being thrown away, and its callback would fire into the old scene.\n        from . import panel as _panel\n        _panel.reset()\n        self._paused = False\n\n        for obj in list(self._objs):\n            obj.destroy()\n        self._objs.clear()\n        self.events.clear()\n        self.timers.clear()\n        self.camera = Camera(self._width, self._height)\n\n    # ---- main loop ---------------------------------------------------------\n\n    def _atexit_run(self):\n        if self._started:\n            return\n        self.run()\n\n    def run(self):\n        \"\"\"Starts the frame loop by driving it with a fresh asyncio.run().\n        On native, kaypy scripts never need to call this themselves \u2014 it\n        fires automatically once the script body finishes (see the atexit\n        registration in __init__) \u2014 but it's safe (and a no-op the second\n        time) to call explicitly too. Not for use under pygbag: the web\n        build's generated main.py wrapper awaits run_async() directly\n        instead, inside the asyncio.run() IT owns (see tools/build_web.py).\"\"\"\n        if self._started:\n            return\n        try:\n            asyncio.run(self.run_async())\n        finally:\n            pygame.quit()\n\n    async def run_async(self):\n        \"\"\"The coroutine form of run() \u2014 awaits the frame loop directly,\n        without starting its own asyncio.run(). This is what the pygbag\n        web build's main.py wrapper calls, since pygbag needs to own the\n        outermost asyncio.run() itself.\"\"\"\n        if self._started:\n            return\n        self._started = True\n        await self._main_loop()\n\n    async def _main_loop(self):\n        import os\n        # Unset means no limit \u2014 a real game runs until it is closed.\n        #\n        # Read this way, rather than `int(os.environ.get(..., \"0\")) or None`,\n        # because that made \"0\" mean UNLIMITED: int(\"0\") is falsy, so `or\n        # None` replaced it. A test that set it to 0 meaning \"do not run a\n        # single frame\" got a loop that never returned, at interpreter exit,\n        # with no output and nothing to attach a traceback to. Every other\n        # caller passes a positive number and never noticed.\n        raw = os.environ.get(\"KAYPY_TEST_MAX_FRAMES\")\n        max_frames = int(raw) if raw not in (None, \"\") else None\n        frame_count = 0\n        # The limit below is checked after a frame has been drawn, so a bare\n        # `while` would still run one. Zero has to mean zero: a test that\n        # wants the loop not to run at all is usually one holding a game\n        # object still to look at it.\n        if max_frames == 0:\n            self._running = False\n            return\n        while self._running:\n            pg_events = pygame.event.get()\n            for e in pg_events:\n                if e.type == pygame.QUIT:\n                    self._running = False\n                elif e.type == pygame.KEYDOWN and e.key == pygame.K_F1:\n                    debug.inspect = not debug.inspect\n            if not self._running:\n                break\n\n            # Native: tick(60) sleeps to pace the loop at 60fps. Web: the\n            # browser already paces us (each `await asyncio.sleep(0)`\n            # below lands on the next animation frame), and tick(60)'s\n            # sleep can't yield to the browser, so it just burns the main\n            # thread and makes frame times *less* even \u2014 measured in a\n            # real build, dt alternated between 16ms and the 50ms cap\n            # below. So on web just measure, don't pace.\n            elapsed = self.clock.tick() if self.is_web else self.clock.tick(60)\n\n            # Paused means no time passes. dt is what every kind of movement\n            # in kaypy is scaled by \u2014 .move(), .moveTo(), gravity, tweens \u2014\n            # so zeroing it here is what actually holds the world still, and\n            # it holds things this loop never sees, like a .move() called\n            # from inside a key handler.\n            #\n            # _elapsed stops too, so time() does not run on. Otherwise a\n            # wave() or a tween would resume somewhere further along its\n            # curve than where it stopped, and a bobbing cloud would jump\n            # the moment the game came back.\n            if self._paused:\n                self._dt = 0.0\n            else:\n                self._dt = min(elapsed / 1000.0, 0.05)\n                self._elapsed += self._dt\n\n            # A panel owns the input while it is up, and the game does not\n            # see any of it. That is what makes it modal: a click meant for\n            # an answer must not also fire an onClick in the game behind it.\n            #\n            # Note this is decided by the panel, not by being paused. A\n            # hand-rolled pause menu \u2014 pause() plus onKeyPress(\"escape\") \u2014\n            # keeps working, because without a panel input goes where it\n            # always did. Input is dispatched even while paused on purpose:\n            # a pause menu has to be able to hear the key that un-pauses it,\n            # and that is safe because dt is zero, so a held arrow key still\n            # fires and moves the player exactly nowhere.\n            from . import panel as _panel\n            if not _panel.handle_events(pg_events):\n                # The joystick gets the events first, and holds keys down\n                # before the handlers that read them run this frame. It does\n                # not consume them: a game may well want the raw clicks too.\n                if self.joystick is not None:\n                    self.joystick.handle(pg_events, self._virtual_key)\n                    self.events.virtual_keys = self.joystick.held\n                self.events.process_pygame_events(pg_events, self._objs)\n            elif self.joystick is not None:\n                # A panel is up. Let go of anything the thumb was holding, or\n                # the player comes back to a character still walking left.\n                self.joystick.release_all(self._virtual_key)\n                self.events.virtual_keys = self.joystick.held\n\n            if not self._paused:\n                self.events.run_update_handlers(self._objs)\n\n                for obj in list(self._objs):\n                    if not obj.exists():\n                        continue\n                    for comp in list(obj._comps.values()):\n                        comp.update(obj)\n                    if \"update\" in obj._event_handlers:\n                        obj._fire(\"update\")\n\n                self.timers.update(self._dt)\n                # Movement and collision run together, in as many substeps as\n                # it takes to keep anything from jumping clean over a wall it\n                # should have hit (see PhysicsSystem.substeps_for). Normal\n                # frames need exactly one, so this costs nothing until\n                # something is genuinely moving fast.\n                substeps = self.physics.substeps_for(self._objs, self._dt)\n                sub_dt = self._dt / substeps\n                for _ in range(substeps):\n                    self.physics.step(self._objs, sub_dt)\n                    self.collision.step(self._objs)\n\n                # A second pass, for the few components whose job is to agree\n                # with where something else ENDED UP \u2014 follow(), and nothing\n                # else so far. Run in the ordinary update above, a follower\n                # reads the target's position from before physics moved it,\n                # and trails a frame behind whenever the target is doing\n                # anything interesting.\n                #\n                # The flag is checked rather than the method called, so a game\n                # without a follower in it pays an attribute lookup and no\n                # call at all.\n                for obj in list(self._objs):\n                    if not obj.exists():\n                        continue\n                    for comp in list(obj._comps.values()):\n                        if comp.wants_late:\n                            comp.late_update(obj)\n\n            self.screen.fill(self._background)\n            self.render.draw(self._objs, self.screen, self.camera, debug.inspect,\n                             self.events.draw_handlers)\n            # Over the game and the HUD, under a panel: a question is more\n            # important than the controls for the game it is interrupting.\n            if self.joystick is not None:\n                self.joystick.draw(self.screen, self)\n            # Last, so it is over everything \u2014 including anything the game\n            # drew in onDraw, which is where a HUD lives.\n            _panel.draw(self.screen, self)\n            pygame.display.flip()\n\n            frame_count += 1\n            shot_at = os.environ.get(\"KAYPY_SCREENSHOT_AT\")\n            shot_path = os.environ.get(\"KAYPY_SCREENSHOT_PATH\")\n            if shot_at and shot_path and frame_count == int(shot_at):\n                pygame.image.save(self.screen, shot_path)\n            # `is not None`, not a truthiness test: max_frames == 0 means run\n            # no frames, and `if max_frames` reads that as no limit \u2014 the same\n            # confusion between \"zero\" and \"unset\" that the parsing above had.\n            if max_frames is not None and frame_count >= max_frames:\n                self._running = False\n\n            await asyncio.sleep(0)\n\n\ndef rand(a=1.0, b=None):\n    if b is None:\n        return _random.uniform(0, a)\n    return _random.uniform(a, b)\n\n\ndef randi(a=1, b=None):\n    if b is None:\n        return _random.randint(0, a)\n    return _random.randint(a, b)\n\n\ndef choose(seq):\n    return _random.choice(seq)\n", "events.py": "\"\"\"Input handling: onKeyDown (held, every frame) / onKeyPress (once per\npress) / onKeyRelease (once per release), onClick (anywhere), and the\nplain per-frame onUpdate / tagged onUpdate(\"tag\", action).\"\"\"\nimport pygame\nfrom .callutil import call_flexible\n\n_LETTERS = \"abcdefghijklmnopqrstuvwxyz\"\n_DIGITS = \"0123456789\"\n\n# Built lazily, on first use, rather than at module import time.\n#\n# Native pygame-ce's pygame.K_LEFT and friends are plain constants, there the\n# moment you `import pygame` and before pygame.init() ever runs. A WASM build\n# of pygame need not be: one of them (pygbag 0.9.3's) did not populate them\n# until after init(). `import kaypy` reaches this module \u2014 via engine.py's\n# `from .events import EventManager` \u2014 long before a script's own kaypy()\n# call gets as far as pygame.init(), so building the map eagerly here crashed\n# every web export with `AttributeError: module 'pygame' has no attribute\n# 'K_LEFT'` before a single line of the game script ran.\n#\n# kaypy no longer builds through pygbag, and the browser build it uses now\n# does define them early. The laziness stays anyway: it costs nothing, it\n# makes the module's import order its own business rather than a property of\n# whichever WASM pygame is underneath, and tests/test_lazy_key_map.py holds\n# it. resolve_key()/key_name() are only ever called from\n# on_key_down/on_key_press/on_key_release (registered after kaypy() runs) or\n# from the frame loop (which only starts after kaypy() runs), so building on\n# first call is always safe.\n_KEY_MAP = None\n_REVERSE_KEY_MAP = None\n\n\ndef _ensure_key_maps():\n    global _KEY_MAP, _REVERSE_KEY_MAP\n    if _KEY_MAP is not None:\n        return\n    _KEY_MAP = {\n        \"left\": pygame.K_LEFT, \"right\": pygame.K_RIGHT,\n        \"up\": pygame.K_UP, \"down\": pygame.K_DOWN,\n        \"space\": pygame.K_SPACE, \"enter\": pygame.K_RETURN, \"return\": pygame.K_RETURN,\n        \"escape\": pygame.K_ESCAPE, \"tab\": pygame.K_TAB,\n        \"shift\": pygame.K_LSHIFT, \"ctrl\": pygame.K_LCTRL, \"control\": pygame.K_LCTRL,\n        \"alt\": pygame.K_LALT, \"backspace\": pygame.K_BACKSPACE,\n    }\n    for _c in _LETTERS:\n        _KEY_MAP[_c] = getattr(pygame, f\"K_{_c}\")\n    for _d in _DIGITS:\n        _KEY_MAP[_d] = getattr(pygame, f\"K_{_d}\")\n    _REVERSE_KEY_MAP = {code: name for name, code in _KEY_MAP.items()}\n\n\ndef resolve_key(name: str) -> int:\n    _ensure_key_maps()\n    key = name.lower()\n    if key not in _KEY_MAP:\n        raise KeyError(f\"unknown key name {name!r}\")\n    return _KEY_MAP[key]\n\n\ndef key_name(code: int) -> str:\n    _ensure_key_maps()\n    return _REVERSE_KEY_MAP.get(code, str(code))\n\n\n# pygame numbers mouse buttons 1, 2, 3 with MIDDLE in the middle, which is not\n# the order anyone guesses. Names are what a student writes and what KAPLAY's\n# documentation says, so names are what this takes.\n_BUTTONS = {\"left\": 1, \"middle\": 2, \"right\": 3}\n_BUTTON_NAMES = {code: name for name, code in _BUTTONS.items()}\n\n\ndef resolve_button(name) -> int:\n    \"\"\"A mouse button name to pygame's number. Defaults to the left one.\"\"\"\n    if name is None:\n        return _BUTTONS[\"left\"]\n    key = str(name).lower()\n    if key not in _BUTTONS:\n        raise KeyError(\n            f\"unknown mouse button {name!r} \u2014 use 'left', 'right' or 'middle'\")\n    return _BUTTONS[key]\n\n\ndef button_name(code: int) -> str:\n    return _BUTTON_NAMES.get(code, str(code))\n\n\nclass EventManager:\n    def __init__(self):\n        self.key_down_handlers = []\n        # (tag_a, tag_b, fn) \u2014 the object-free onCollide, fired by\n        # CollisionSystem when a NEW touch begins between two tags.\n        self.collide_tag_handlers = []\n        self.key_press_handlers = []\n        self.key_release_handlers = []\n        self.click_handlers = []\n        self.update_handlers = []  # (tag_or_None, fn)\n\n        # Key codes an on-screen joystick is holding. Consulted everywhere\n        # the real keyboard is, so a thumb on the d-pad is indistinguishable\n        # from a finger on the arrow key \u2014 which is the whole point of it.\n        self.virtual_keys = set()\n\n        self.mouse_down_handlers = []      # (button, fn)\n        self.mouse_press_handlers = []     # (button, fn)\n        self.mouse_release_handlers = []   # (button, fn)\n        self.mouse_move_handlers = []\n        self.draw_handlers = []\n\n        # Edge state, rebuilt every frame in process_pygame_events. A press\n        # and a release both last exactly one frame, which is what makes\n        # isMousePressed() answerable at all \u2014 \"is it down\" is a question SDL\n        # can answer any time, \"did it just go down\" is not.\n        self._pressed_now = set()\n        self._released_now = set()\n        self._moved_now = False\n        self._delta = (0, 0)\n\n    def clear(self):\n        self.key_down_handlers.clear()\n        self.collide_tag_handlers.clear()\n        self.key_press_handlers.clear()\n        self.key_release_handlers.clear()\n        self.click_handlers.clear()\n        self.update_handlers.clear()\n        self.mouse_down_handlers.clear()\n        self.mouse_press_handlers.clear()\n        self.mouse_release_handlers.clear()\n        self.mouse_move_handlers.clear()\n        self.draw_handlers.clear()\n\n    def on_collide_tags(self, tag_a, tag_b, fn):\n        self.collide_tag_handlers.append((tag_a, tag_b, fn))\n        return fn\n\n    def fire_tag_collision(self, a, b):\n        \"\"\"A new touch between a and b \u2014 tell anyone watching for the pair.\n\n        Checked both ways round, so onCollide(\"bullet\", \"enemy\") fires\n        whichever of the two the collision system happened to look at first.\n        The handler always gets them in the order the tags were named.\n        \"\"\"\n        for tag_a, tag_b, fn in list(self.collide_tag_handlers):\n            if a.is_(tag_a) and b.is_(tag_b):\n                call_flexible(fn, a, b)\n            elif b.is_(tag_a) and a.is_(tag_b):\n                call_flexible(fn, b, a)\n\n    def on_key_down(self, key, fn):\n        self.key_down_handlers.append((resolve_key(key), fn))\n        return fn\n\n    def on_key_press(self, key, fn):\n        self.key_press_handlers.append((resolve_key(key), fn))\n        return fn\n\n    def on_key_release(self, key, fn):\n        self.key_release_handlers.append((resolve_key(key), fn))\n        return fn\n\n    def on_click(self, fn):\n        self.click_handlers.append(fn)\n        return fn\n\n    # ---- mouse ---------------------------------------------------------\n    #\n    # onClick() was the whole mouse API for a long time, and it is enough for\n    # \"click the button\" and nothing else. Aiming at the cursor, dragging a\n    # piece, holding to charge, drawing a line \u2014 every one of those needs to\n    # know which button is down *now*, or that the mouse moved, and had no way\n    # to ask.\n    #\n    # Button names, not numbers, to match KAPLAY: `\"left\"`, `\"right\"`,\n    # `\"middle\"`. pygame numbers them 1, 2, 3 with middle in the middle, which\n    # is a detail nobody should have to remember.\n\n    def on_mouse_down(self, button, fn):\n        self.mouse_down_handlers.append((resolve_button(button), fn))\n        return fn\n\n    def on_mouse_press(self, button, fn):\n        self.mouse_press_handlers.append((resolve_button(button), fn))\n        return fn\n\n    def on_mouse_release(self, button, fn):\n        self.mouse_release_handlers.append((resolve_button(button), fn))\n        return fn\n\n    def on_mouse_move(self, fn):\n        self.mouse_move_handlers.append(fn)\n        return fn\n\n    def on_update(self, *args):\n        if len(args) == 1:\n            self.update_handlers.append((None, args[0]))\n            return args[0]\n        tag, fn = args\n        self.update_handlers.append((tag, fn))\n        return fn\n\n    def process_pygame_events(self, pg_events, objs):\n        # A press and a release are true for exactly one frame. Clearing them\n        # here, before this frame's events are read, is what makes that so \u2014\n        # forget it and isMousePressed() stays true until the next click,\n        # which looks like a game that fires twice.\n        self._pressed_now.clear()\n        self._released_now.clear()\n        self._moved_now = False\n        self._delta = (0, 0)\n\n        for e in pg_events:\n            if e.type == pygame.KEYDOWN:\n                for code, fn in self.key_press_handlers:\n                    if code == e.key:\n                        call_flexible(fn, key_name(code))\n            elif e.type == pygame.KEYUP:\n                for code, fn in self.key_release_handlers:\n                    if code == e.key:\n                        call_flexible(fn, key_name(code))\n            elif e.type == pygame.MOUSEBUTTONDOWN:\n                self._pressed_now.add(e.button)\n                for button, fn in self.mouse_press_handlers:\n                    if button == e.button:\n                        call_flexible(fn, button_name(e.button))\n                # onClick and obj.onClick are the left button only, which is\n                # what they have always meant and what KAPLAY means by them.\n                if e.button == _BUTTONS[\"left\"]:\n                    for fn in self.click_handlers:\n                        call_flexible(fn)\n                    for obj in objs:\n                        if (obj.exists() and obj.has(\"area\")\n                                and \"click\" in obj._event_handlers\n                                and obj.comp(\"area\").isHovering()):\n                            obj._fire(\"click\")\n            elif e.type == pygame.MOUSEBUTTONUP:\n                self._released_now.add(e.button)\n                for button, fn in self.mouse_release_handlers:\n                    if button == e.button:\n                        call_flexible(fn, button_name(e.button))\n            elif e.type == pygame.MOUSEMOTION:\n                self._moved_now = True\n                # Accumulated, not overwritten: SDL can deliver several\n                # motion events in one frame, and a handler that saw only the\n                # last one would under-report a fast drag.\n                self._delta = (self._delta[0] + e.rel[0],\n                               self._delta[1] + e.rel[1])\n                for fn in self.mouse_move_handlers:\n                    call_flexible(fn)\n\n        pressed = pygame.key.get_pressed()\n        for code, fn in self.key_down_handlers:\n            if pressed[code] or code in self.virtual_keys:\n                call_flexible(fn, key_name(code))\n\n        if self.mouse_down_handlers:\n            held = pygame.mouse.get_pressed(num_buttons=3)\n            for button, fn in self.mouse_down_handlers:\n                if held[button - 1]:\n                    call_flexible(fn, button_name(button))\n\n    # ---- what a game can ask about the mouse right now -----------------\n\n    def is_mouse_down(self, button=None):\n        try:\n            return bool(pygame.mouse.get_pressed(num_buttons=3)\n                        [resolve_button(button) - 1])\n        except (pygame.error, IndexError):\n            return False\n\n    def is_mouse_pressed(self, button=None):\n        return resolve_button(button) in self._pressed_now\n\n    def is_mouse_released(self, button=None):\n        return resolve_button(button) in self._released_now\n\n    def is_mouse_moved(self):\n        return self._moved_now\n\n    def mouse_delta(self):\n        return self._delta\n\n    def run_update_handlers(self, objs):\n        for tag, fn in self.update_handlers:\n            if tag is None:\n                call_flexible(fn)\n            else:\n                for obj in objs:\n                    if obj.exists() and obj.is_(tag):\n                        call_flexible(fn, obj)\n", "gameobj.py": "\"\"\"GameObj: the entity, built out of a list of components (and tags).\n\nKaplay literally merges each component's properties onto the object\n(Object.assign). We fake that with attribute delegation in __getattr__,\nwhich is also what produces the \"has no attribute\" error the guide's\ntroubleshooting section describes when a component is missing.\n\"\"\"\nfrom __future__ import annotations\n\n_next_id = 0\n\n\ndef _new_id():\n    global _next_id\n    _next_id += 1\n    return _next_id\n\n\nclass Comp:\n    \"\"\"Base class for all components. Subclasses set `id` and may\n    implement add/update/draw hooks, plus any methods/attributes that\n    should appear directly on the owning GameObj.\n    \"\"\"\n    id: str = \"\"\n\n    #: Does this component need to run AFTER physics and collision, rather\n    #: than before with everything else?\n    #:\n    #: Almost nothing does. The one thing that does is a component whose\n    #: whole job is to agree with another object's final position \u2014 follow()\n    #: \u2014 because update() runs before physics moves anything, so a follower\n    #: reading a position there reads last frame's. On a health bar over a\n    #: jumping player that is a visible lag of a dozen pixels, appearing only\n    #: when the player is in the air, which is a miserable thing to debug.\n    #:\n    #: The engine only makes the extra pass for components that ask, so a\n    #: game with no followers in it pays nothing.\n    wants_late: bool = False\n\n    def add(self, obj: \"GameObj\"):\n        \"\"\"Called once, when the component is attached to obj.\"\"\"\n\n    def update(self, obj: \"GameObj\"):\n        \"\"\"Called every frame, if the engine has one running.\"\"\"\n\n    def late_update(self, obj: \"GameObj\"):\n        \"\"\"Called every frame after physics, if wants_late is set.\"\"\"\n\n    def draw(self, obj: \"GameObj\", ctx):\n        \"\"\"Called every frame during rendering.\"\"\"\n\n    def destroy(self, obj: \"GameObj\"):\n        \"\"\"Called once, when obj is destroyed.\"\"\"\n\n\nclass GameObj:\n    def __init__(self, comp_list=None):\n        self._id = _new_id()\n        self._comps: dict[str, Comp] = {}\n        self.tags: set[str] = set()\n        self.children: list[\"GameObj\"] = []\n        self.parent: \"GameObj | None\" = None\n        self._destroyed = False\n        self._engine = None  # set by Engine.add / obj.add\n        self._event_handlers: dict[str, list] = {}\n        if comp_list:\n            self.use_all(comp_list)\n\n    # ---- component wiring -------------------------------------------------\n\n    def use(self, comp):\n        \"\"\"Attach a single component, tag string, or dict of your own values.\"\"\"\n        if isinstance(comp, str):\n            self.tags.add(comp)\n            return\n        if isinstance(comp, dict):\n            self._use_values(comp)\n            return\n        if not isinstance(comp, Comp):\n            raise TypeError(\n                f\"add([...]) expects components, tag strings, or a dict of \"\n                f\"your own values \u2014 got {comp!r}\"\n            )\n        self._comps[comp.id] = comp\n        comp.add(self)\n\n    def _use_values(self, values):\n        \"\"\"Put your own values on the object, from a dict in the list.\n\n            add([sprite(\"bean\"), pos(10, 10), {\"hits\": 0, \"dir\": 1}])\n\n        KAPLAY allows a plain object among the components and merges its keys\n        onto the game object, so this is the same thing in Python, and their\n        examples translate. It saves a line \u2014 the alternative is to name the\n        object and then assign \u2014 and, more usefully, it puts a thing's state\n        in the same list as the rest of what it is.\n\n        WHY TWO KINDS OF KEY ARE REFUSED\n\n        A key a component already owns would shadow it. `{\"pos\": vec2(0, 0)}`\n        alongside `pos(10, 10)` looks like it sets the position and instead\n        replaces the component's own attribute with a bare value, after which\n        the object is half a game object and dies somewhere else entirely.\n        Silently winning that race is the worst outcome; saying so here is a\n        one-line fix.\n\n        A key that is not a valid Python name \u2014 `{\"my flag\": True}` \u2014 can be\n        set and never read, because `obj.my flag` is a syntax error. Storing\n        it would be a value that exists and cannot be used.\n\n        For a flag that says what something IS, a tag is usually better than\n        an attribute: `get(\"enemy\")` finds them all and `onCollide(\"enemy\")`\n        already works on it. Attributes are for per-object state \u2014 `hits`,\n        `cooldown`, `dir`.\n        \"\"\"\n        import keyword\n\n        for name, value in values.items():\n            if not isinstance(name, str) or not name.isidentifier() \\\n                    or keyword.iskeyword(name):\n                raise ValueError(\n                    f\"add([... {{{name!r}: ...}}]) \u2014 {name!r} cannot be a \"\n                    f\"name on a game object, so nothing could ever read it \"\n                    f\"back. Use a plain name like \\\"hits\\\" or \\\"dir\\\".\"\n                )\n            if name.startswith(\"_\"):\n                raise ValueError(\n                    f\"add([... {{{name!r}: ...}}]) \u2014 names starting with an \"\n                    f\"underscore are the engine's own. Pick another.\"\n                )\n            owner = next((c for c in self._comps.values()\n                          if hasattr(c, name)), None)\n            if owner is not None:\n                raise ValueError(\n                    f\"add([... {{{name!r}: ...}}]) \u2014 {type(owner).__name__} \"\n                    f\"already gives this object '{name}', and setting it here \"\n                    f\"would break that component.\\n\"\n                    f\"    Rename yours, or set it after add() if you really \"\n                    f\"mean to change the component's value.\"\n                )\n            object.__setattr__(self, name, value)\n\n    def use_all(self, comp_list):\n        # Dicts go on last, whatever order they were written in, so that the\n        # clash check in _use_values sees every component. Written first in\n        # the list \u2014 add([{\"pos\": 1}, pos(10, 10)]) \u2014 a dict would otherwise\n        # be checked against no components at all, and the plain attribute it\n        # set would then shadow the real pos() completely, because an\n        # attribute in __dict__ is found before __getattr__ ever runs.\n        values = [c for c in comp_list if isinstance(c, dict)]\n        for c in comp_list:\n            if not isinstance(c, dict):\n                self.use(c)\n        for c in values:\n            self.use(c)\n\n    def has(self, comp_id: str) -> bool:\n        return comp_id in self._comps\n\n    def comp(self, comp_id: str):\n        return self._comps.get(comp_id)\n\n    # ---- KAPLAY-style attribute delegation ---------------------------------\n\n    def __getattr__(self, name):\n        # __getattr__ only fires when normal attribute lookup fails,\n        # so this never shadows things set in __init__/__dict__.\n        comps = self.__dict__.get(\"_comps\", {})\n        for c in comps.values():\n            if hasattr(c, name):\n                return getattr(c, name)\n        raise AttributeError(\n            f\"GameObj has no attribute '{name}' \u2014 \"\n            f\"did you forget a component that provides it?\"\n        )\n\n    def __setattr__(self, name, value):\n        # Allow plain-assignment mutation of component fields, e.g.\n        # player.flipX = True (Lesson 6). Only redirect if the name is\n        # not one of GameObj's own declared fields and a component owns it.\n        if name.startswith(\"_\") or name in (\n            \"tags\", \"children\", \"parent\",\n        ):\n            object.__setattr__(self, name, value)\n            return\n        comps = self.__dict__.get(\"_comps\")\n        if comps:\n            for c in comps.values():\n                if hasattr(c, name):\n                    # Refuse to replace a component's METHOD with a value.\n                    # `rock.size = 3` looks like storing a number on your own\n                    # object; it actually overwrites circle()'s size() method,\n                    # and the game then dies somewhere else entirely with\n                    # \"'int' object is not callable\" \u2014 in the collision system,\n                    # nowhere near the line that did it. Found by writing\n                    # examples/asteroids.py and losing a while to exactly that.\n                    if callable(getattr(c, name)) and not callable(value):\n                        raise AttributeError(\n                            f\"'{name}' is a method that {type(c).__name__} \"\n                            f\"gives this object, so assigning to it would \"\n                            f\"break the component. Pick another name for your \"\n                            f\"own value \u2014 rock.{name}_value, or something \"\n                            f\"that says what it is.\"\n                        )\n                    setattr(c, name, value)\n                    return\n        object.__setattr__(self, name, value)\n\n    # ---- tree ---------------------------------------------------------------\n\n    def add(self, comp_list):\n        \"\"\"Add a child object. Children are positioned/drawn relative to\n        their parent and moved along with it (Lesson 8).\"\"\"\n        child = GameObj(comp_list)\n        child.parent = self\n        child._engine = self._engine\n        self.children.append(child)\n        if self._engine:\n            self._engine._register(child)\n        return child\n\n    def destroy(self):\n        if self._destroyed:\n            return\n        self._destroyed = True\n        for c in list(self._comps.values()):\n            c.destroy(self)\n        for child in list(self.children):\n            child.destroy()\n        if self.parent:\n            try:\n                self.parent.children.remove(self)\n            except ValueError:\n                pass\n        if self._engine:\n            self._engine._unregister(self)\n\n    def exists(self) -> bool:\n        return not self._destroyed\n\n    def is_(self, tag: str) -> bool:\n        return tag in self.tags\n\n    # ---- events (mirrors the free onX functions, but scoped to this obj) --\n\n    def _on(self, event, tag_or_fn, fn=None):\n        if fn is None:\n            handler = tag_or_fn\n            tag = None\n        else:\n            tag = tag_or_fn\n            handler = fn\n        self._event_handlers.setdefault(event, []).append((tag, handler))\n        return handler\n\n    # Each of these takes a function, or is used as a decorator over one:\n    #     player.onCollide(\"coin\", pick_up)\n    #     @player.onCollide(\"coin\")\n    #     def pick_up(coin): ...\n    # See callutil.register_or_decorate for why both forms exist.\n\n    def onUpdate(self, fn=None):\n        from .callutil import register_or_decorate\n        return register_or_decorate(fn, lambda f: self._on(\"update\", f))\n\n    def onClick(self, fn=None):\n        if not self.has(\"area\"):\n            raise RuntimeError(\"onClick() needs area() on this object\")\n        from .callutil import register_or_decorate\n        return register_or_decorate(fn, lambda f: self._on(\"click\", f))\n\n    def onCollide(self, tag, fn=None):\n        if not self.has(\"area\"):\n            raise RuntimeError(\"onCollide() needs area() on this object\")\n        from .callutil import register_or_decorate\n        return register_or_decorate(fn, lambda f: self._on(\"collide\", tag, f))\n\n    def onCollideUpdate(self, tag, fn=None):\n        if not self.has(\"area\"):\n            raise RuntimeError(\"onCollideUpdate() needs area() on this object\")\n        from .callutil import register_or_decorate\n        return register_or_decorate(fn, lambda f: self._on(\"collideUpdate\", tag, f))\n\n    def onCollideEnd(self, tag, fn=None):\n        if not self.has(\"area\"):\n            raise RuntimeError(\"onCollideEnd() needs area() on this object\")\n        from .callutil import register_or_decorate\n        return register_or_decorate(fn, lambda f: self._on(\"collideEnd\", tag, f))\n\n    def _fire(self, event, tag=None, *args):\n        from .callutil import call_flexible\n        for h_tag, handler in list(self._event_handlers.get(event, [])):\n            if h_tag is None or h_tag == tag:\n                call_flexible(handler, *args)\n", "geometry.py": "\"\"\"Shared geometry helpers used by both collision (area()) and rendering,\nso 'does this touch that' and 'where does this draw' never disagree.\"\"\"\nimport pygame\nfrom .vec2 import Vec2\n\n\ndef get_size(obj):\n    if obj.has(\"sprite\"):\n        base = obj.comp(\"sprite\").size()\n    elif obj.has(\"rect\"):\n        base = obj.comp(\"rect\").size()\n    elif obj.has(\"circle\"):\n        base = obj.comp(\"circle\").size()\n    elif obj.has(\"text\"):\n        base = obj.comp(\"text\").size()\n    else:\n        base = (0, 0)\n    if obj.has(\"scale\"):\n        sc = obj.comp(\"scale\").scale\n        base = (base[0] * sc.x, base[1] * sc.y)\n    return base\n\n\ndef get_world_pos(obj) -> Vec2:\n    \"\"\"Position in world space, folding in parent offsets (children are\n    positioned relative to their parent, and move when it moves).\"\"\"\n    p = obj.comp(\"pos\").pos if obj.has(\"pos\") else Vec2(0, 0)\n    if obj.parent is not None:\n        return p + get_world_pos(obj.parent)\n    return p\n\n\ndef get_topleft(obj) -> Vec2:\n    p = get_world_pos(obj)\n    w, h = get_size(obj)\n    if obj.has(\"anchor\"):\n        a = obj.comp(\"anchor\").anchor\n    else:\n        # \"Without it, pos() means the top-left corner.\"\n        a = Vec2(-1, -1)\n    offset_x = (a.x + 1) / 2 * w\n    offset_y = (a.y + 1) / 2 * h\n    return Vec2(p.x - offset_x, p.y - offset_y)\n\n\ndef get_world_rect(obj) -> \"pygame.FRect\":\n    \"\"\"Float-precision rect, used for collision. AABB resolution snaps\n    resting objects to sub-pixel contact, and pygame.Rect truncates to\n    ints \u2014 enough to make a resting object's ground contact flicker in\n    and out of existence one pixel at a time. FRect avoids that.\"\"\"\n    tl = get_topleft(obj)\n    w, h = get_size(obj)\n    return pygame.FRect(tl.x, tl.y, max(w, 0), max(h, 0))\n", "helpers.py": "\"\"\"The small Kaplay names \u2014 the ones a copied example reaches for.\n\nNone of these is load-bearing on its own. Together they are the difference\nbetween a Kaplay example found on the internet running as written and failing\non its third line with a NameError, which is the thing kaypy exists to avoid:\n\"KAPLAY's documentation still tells you what to write\" is only true while the\nnames in it exist.\n\nEvery one is Kaplay's own name with Kaplay's own arguments and its own return\ntype. Where Kaplay is loose about types \u2014 `rgb()` taking three numbers or one\nhex string \u2014 that looseness is copied too, because a student pasting an\nexample should not have to know which spelling their source used.\n\"\"\"\nimport math\nimport random as _random\n\n\ndef time():\n    \"\"\"Seconds since kaypy() started. Kaplay's clock, not the wall clock.\n\n    Pauses when the game does, which is the whole point of not using\n    `time.time()` \u2014 a sine wave driven by wall time jumps when a game is\n    paused and resumed.\n    \"\"\"\n    from .engine import current_engine\n    return current_engine().elapsed()\n\n\ndef destroy(obj):\n    \"\"\"Remove one object. `obj.destroy()` does the same thing.\"\"\"\n    if obj is not None and hasattr(obj, \"destroy\"):\n        obj.destroy()\n\n\ndef destroyAll(tag):\n    \"\"\"Remove every object carrying a tag. Returns how many went.\"\"\"\n    from .engine import current_engine\n    doomed = current_engine().get(tag)\n    for obj in doomed:\n        obj.destroy()\n    return len(doomed)\n\n\ndef isKeyDown(key):\n    \"\"\"Is this key held right now?\n\n    The polling counterpart to `onKeyDown`. Some logic reads better asked\n    than answered: `if isKeyDown(\"shift\")` inside a handler you already have,\n    rather than a second handler that sets a flag.\n    \"\"\"\n    import pygame\n    from .engine import current_engine\n    from .events import resolve_key\n\n    try:\n        code = resolve_key(key)\n    except KeyError:\n        return False\n    # The on-screen joystick counts. isKeyDown() and onKeyDown have to agree\n    # about what is held, or a game written with one would behave differently\n    # from the same game written with the other.\n    try:\n        if code in current_engine().events.virtual_keys:\n            return True\n    except Exception:                                          # noqa: BLE001\n        pass\n    try:\n        return bool(pygame.key.get_pressed()[code])\n    except (IndexError, pygame.error):\n        return False\n\n\n# The eight named colours, as plain (r, g, b) tuples \u2014 the same names and the\n# same values Kaplay uses, because they are simply the corners of the RGB\n# cube and every graphics library has agreed on them for decades.\n#\n# TUPLES, NOT A COLOUR CLASS\n#\n# Everything in kaypy that takes a colour already takes a tuple: rgb() returns\n# one, background= is one, outline() takes one. A constant that is just a\n# tuple therefore works in every one of those places on the day it is added,\n# with nothing to teach and nothing to convert. A student can also read it \u2014\n# printing RED gives (255, 0, 0), which is the lesson.\nRED = (255, 0, 0)\nGREEN = (0, 255, 0)\nBLUE = (0, 0, 255)\nYELLOW = (255, 255, 0)\nMAGENTA = (255, 0, 255)\nCYAN = (0, 255, 255)\nWHITE = (255, 255, 255)\nBLACK = (0, 0, 0)\n\ndef rgb(r=255, g=None, b=None):\n    \"\"\"A colour, as a plain (r, g, b) tuple.\n\n    Kaplay takes three numbers or one hex string, so this does too:\n    `rgb(255, 128, 0)`, `rgb(\"#ff8800\")`, `rgb(\"#f80\")`, or `rgb(200)` for a\n    grey. Two numbers is not a colour anyone meant, so it says so rather than\n    inventing the third.\n    \"\"\"\n    if isinstance(r, str):\n        text = r.lstrip(\"#\")\n        if len(text) == 3:\n            text = \"\".join(c * 2 for c in text)\n        if len(text) != 6:\n            raise ValueError(\n                \"rgb(%r): a hex colour looks like '#ff8800' or '#f80'\" % r)\n        try:\n            return tuple(int(text[i:i + 2], 16) for i in (0, 2, 4))\n        except ValueError:\n            raise ValueError(\n                \"rgb(%r): that is not hex \u2014 try '#ff8800'\" % r) from None\n    if isinstance(r, (tuple, list)):\n        return tuple(int(c) for c in r)[:3]\n    if g is None and b is None:\n        return (int(r), int(r), int(r))          # rgb(200) is a grey\n    if b is None:\n        raise ValueError(\n            \"rgb() takes three numbers, one hex string, or one number for a \"\n            \"grey \u2014 rgb(%r, %r) is missing the blue.\" % (r, g))\n    return (int(r), int(g), int(b))\n\n\ndef lerp(a, b, t):\n    \"\"\"Blend from a to b. Works on numbers and on vec2.\"\"\"\n    from .vec2 import Vec2\n\n    if isinstance(a, Vec2) or isinstance(b, Vec2):\n        return Vec2(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t)\n    return a + (b - a) * t\n\n\ndef clamp(value, low, high):\n    \"\"\"Keep a number inside a range. Tolerates the bounds being swapped.\"\"\"\n    if low > high:\n        low, high = high, low\n    return max(low, min(high, value))\n\n\ndef chance(probability):\n    \"\"\"True that often. `chance(0.2)` is true one time in five.\"\"\"\n    return _random.random() < probability\n\n\ndef wave(low, high, t, func=math.sin):\n    \"\"\"A value swinging between low and high, forever.\n\n        y = wave(100, 200, time() * 2)\n\n    Kaplay's own signature. The fourth argument lets you swap the shape of\n    the swing; `math.cos` starts at the top instead of the middle.\n    \"\"\"\n    return low + (func(t) + 1) / 2 * (high - low)\n\n\ndef deg2rad(degrees):\n    return math.radians(degrees)\n\n\ndef rad2deg(radians):\n    return math.degrees(radians)\n", "joystick.py": "\"\"\"An on-screen d-pad and buttons, for playing with a thumb.\n\n    kaypy(width=800, height=600, joystick=True)\n\nThat is the whole change. The overlay pretends to be the keyboard: touching\nthe d-pad is exactly as if `left` were held, and the buttons are `space` and\n`z`. Every game already written \u2014 every lesson in the guide \u2014 becomes\nplayable on a phone without a line of it changing.\n\nWHY IT PRETENDS TO BE KEYS RATHER THAN HAVING ITS OWN API\n\nBecause an API nobody has called yet is an API no existing game supports. A\n`joystickDir()` would be more honest about what this is, and would mean every\ngame needed rewriting before a student could play it on the bus. Firing the\nsame handlers the keyboard fires means the thirteen lessons, the starter, and\nwhatever a class wrote last week all work on touch immediately.\n\nThe cost is that a game cannot tell a thumb from a keyboard. That seems a\nsmall price, and mostly a feature.\n\nWHY IT IS DRAWN ON THE CANVAS AND NOT BUILT OUT OF HTML\n\nUnlike a panel \u2014 which is words to read, a link to follow and a box to type\nin, all things a browser does far better than a canvas \u2014 a d-pad is a picture\nyou put your thumb on. There is nothing to select, nothing to read aloud,\nnothing to zoom. Drawing it means it works identically in a browser and in a\nwindow on a desktop, from one piece of code, and it sits inside the game's\nown coordinates so it scales with the canvas for free.\n\nMULTI-TOUCH, AND WHY IT IS NOT OPTIONAL\n\nA platformer needs run and jump at the same time. Tracked by mouse position\nalone there is one pointer, so holding right and pressing jump would release\nright \u2014 which makes exactly the games this is for unplayable. So fingers are\ntracked individually by their own ids, and the mouse is treated as one more\nfinger so the thing can still be tried on a laptop.\n\"\"\"\nfrom __future__ import annotations\n\nimport pygame\n\nfrom .events import resolve_key\n\n#: What the two action buttons send when nothing else is asked for. `space`\n#: because that is what every lesson in the guide jumps with; `z` because it\n#: is reachable on a keyboard too, so a game built for touch is still\n#: playable on a laptop without remapping anything.\nDEFAULT_BUTTONS = (\"space\", \"z\")\n\n#: The mouse, as a finger. Real finger ids come from SDL and are arbitrary\n#: integers, so this is a value they will not collide with.\nMOUSE_FINGER = \"mouse\"\n\n\nclass Joystick:\n    \"\"\"The overlay: where it is, what is held, and how to draw it.\"\"\"\n\n    def __init__(self, width, height, buttons=None):\n        self.screen_w = width\n        self.screen_h = height\n\n        if buttons is None:\n            buttons = DEFAULT_BUTTONS\n        elif isinstance(buttons, str):\n            buttons = (buttons,)\n        self.button_keys = tuple(buttons)\n\n        # Sized off the screen so it is thumb-sized on a phone and not\n        # comical on a projector. Clamped because a very small canvas would\n        # otherwise end up with a d-pad bigger than the game.\n        base = max(48, min(120, int(min(width, height) * 0.22)))\n        self.pad_r = base\n        self.btn_r = int(base * 0.42)\n        margin = int(base * 0.45)\n\n        self.pad_centre = (margin + self.pad_r, height - margin - self.pad_r)\n\n        # The action buttons, bottom right, offset from each other so a thumb\n        # can reach both without covering either.\n        bx = width - margin - self.btn_r\n        by = height - margin - self.btn_r\n        self.buttons = []\n        for i, key in enumerate(self.button_keys):\n            cx = bx - i * int(self.btn_r * 2.4)\n            cy = by - (0 if i % 2 == 0 else int(self.btn_r * 1.1))\n            self.buttons.append({\"key\": key, \"centre\": (cx, cy),\n                                 \"label\": key[:1].upper()})\n\n        # finger id -> the set of key codes that finger is holding.\n        self._fingers = {}\n        # Key codes held by any finger, as of this frame.\n        self.held = set()\n\n    # ---- what is under a point ------------------------------------------\n\n    def _dirs_at(self, x, y):\n        \"\"\"Which directions a point on the d-pad means.\n\n        A ring, split into eight. Diagonals hold two keys at once, because a\n        thumb between up and right means up and right \u2014 anything else makes a\n        platformer feel broken in a way players cannot describe.\n        \"\"\"\n        cx, cy = self.pad_centre\n        dx, dy = x - cx, y - cy\n        dist = (dx * dx + dy * dy) ** 0.5\n        if dist > self.pad_r * 1.15:\n            return set()\n        # A dead zone in the middle, so resting a thumb there is not \"left\".\n        if dist < self.pad_r * 0.28:\n            return set()\n\n        out = set()\n        if abs(dx) > self.pad_r * 0.22:\n            out.add(\"right\" if dx > 0 else \"left\")\n        if abs(dy) > self.pad_r * 0.22:\n            out.add(\"down\" if dy > 0 else \"up\")\n        return out\n\n    def _button_at(self, x, y):\n        for b in self.buttons:\n            cx, cy = b[\"centre\"]\n            if (x - cx) ** 2 + (y - cy) ** 2 <= (self.btn_r * 1.2) ** 2:\n                return b[\"key\"]\n        return None\n\n    def _keys_at(self, x, y):\n        keys = set(self._dirs_at(x, y))\n        b = self._button_at(x, y)\n        if b:\n            keys.add(b)\n        return keys\n\n    # ---- input ------------------------------------------------------------\n\n    def handle(self, events, post):\n        \"\"\"Take the frame's events. `post` is called with (key_code, down)\n        for each change, so the engine can fire onKeyPress / onKeyRelease.\"\"\"\n        for e in events:\n            kind = e.type\n            if kind == pygame.FINGERDOWN:\n                self._set(e.finger_id, self._at_normalised(e), post)\n            elif kind == pygame.FINGERMOTION:\n                self._set(e.finger_id, self._at_normalised(e), post)\n            elif kind == pygame.FINGERUP:\n                self._set(e.finger_id, set(), post)\n            elif kind == pygame.MOUSEBUTTONDOWN and e.button == 1:\n                self._set(MOUSE_FINGER, self._keys_at(*e.pos), post)\n            elif kind == pygame.MOUSEMOTION and e.buttons and e.buttons[0]:\n                self._set(MOUSE_FINGER, self._keys_at(*e.pos), post)\n            elif kind == pygame.MOUSEBUTTONUP and e.button == 1:\n                self._set(MOUSE_FINGER, set(), post)\n\n    def _at_normalised(self, e):\n        \"\"\"Finger events carry 0..1 across the window, not pixels.\"\"\"\n        return self._keys_at(e.x * self.screen_w, e.y * self.screen_h)\n\n    def _set(self, finger, key_names, post):\n        codes = set()\n        for name in key_names:\n            try:\n                codes.add(resolve_key(name))\n            except Exception:                                  # noqa: BLE001\n                pass\n\n        was = self._fingers.get(finger, set())\n        if codes:\n            self._fingers[finger] = codes\n        else:\n            self._fingers.pop(finger, None)\n\n        after = set()\n        for held in self._fingers.values():\n            after |= held\n\n        # Only the edges are announced. A key held across two frames must not\n        # fire onKeyPress twice \u2014 that is the difference between a jump and a\n        # double jump nobody asked for.\n        for code in after - self.held:\n            post(code, True)\n        for code in self.held - after:\n            post(code, False)\n        self.held = after\n\n    def release_all(self, post):\n        \"\"\"Let go of everything. Used when the overlay goes away, so a key\n        cannot be left stuck down with nothing holding it.\"\"\"\n        self._fingers.clear()\n        for code in list(self.held):\n            post(code, False)\n        self.held = set()\n\n    # ---- drawing ----------------------------------------------------------\n\n    def draw(self, screen, engine):\n        w, h = screen.get_size()\n        if (w, h) != (self.screen_w, self.screen_h):\n            # The canvas can be resized under us in a browser.\n            self.__init__(w, h, self.button_keys)\n\n        layer = pygame.Surface((w, h), pygame.SRCALPHA)\n        cx, cy = self.pad_centre\n\n        pygame.draw.circle(layer, (255, 255, 255, 40), (cx, cy), self.pad_r)\n        pygame.draw.circle(layer, (255, 255, 255, 90), (cx, cy), self.pad_r, 3)\n\n        # The four directions, lit when held, so a player can see what the\n        # game thinks their thumb is doing.\n        arm = int(self.pad_r * 0.62)\n        for name, dx, dy in ((\"left\", -1, 0), (\"right\", 1, 0),\n                             (\"up\", 0, -1), (\"down\", 0, 1)):\n            try:\n                lit = resolve_key(name) in self.held\n            except Exception:                                  # noqa: BLE001\n                lit = False\n            colour = (120, 220, 120, 210) if lit else (255, 255, 255, 110)\n            tip = (cx + dx * arm, cy + dy * arm)\n            side = int(self.pad_r * 0.20)\n            a = (cx + dx * side - dy * side, cy + dy * side - dx * side)\n            b = (cx + dx * side + dy * side, cy + dy * side + dx * side)\n            pygame.draw.polygon(layer, colour, [tip, a, b])\n\n        font = engine._get_font(int(self.btn_r * 1.1))\n        for btn in self.buttons:\n            bx, by = btn[\"centre\"]\n            try:\n                lit = resolve_key(btn[\"key\"]) in self.held\n            except Exception:                                  # noqa: BLE001\n                lit = False\n            pygame.draw.circle(layer, (120, 220, 120, 190) if lit\n                               else (255, 255, 255, 55), (bx, by), self.btn_r)\n            pygame.draw.circle(layer, (255, 255, 255, 120), (bx, by),\n                               self.btn_r, 3)\n            label = font.render(btn[\"label\"], True, (20, 24, 34) if lit\n                                else (255, 255, 255))\n            layer.blit(label, (bx - label.get_width() // 2,\n                               by - label.get_height() // 2))\n\n        screen.blit(layer, (0, 0))\n", "kaboom.py": "\"\"\"addKaboom(pos): a small procedural explosion (expanding, fading\nrings) so effects work without requiring a bundled 'kaboom' sprite.\"\"\"\n\n\ndef addKaboom(position, scale=1.0):\n    from .engine import current_engine\n    from .comps.pos import pos as pos_comp\n    from .comps.shapes import circle\n    from .comps.transform import color as color_comp, opacity as opacity_comp, anchor as anchor_comp, z as z_comp\n\n    engine = current_engine()\n    rings = [\n        (28 * scale, (255, 220, 80), 0.35),\n        (20 * scale, (255, 140, 30), 0.30),\n        (12 * scale, (255, 255, 255), 0.22),\n    ]\n    made = []\n    for radius, col, life in rings:\n        obj = engine.add([\n            pos_comp(position.x, position.y),\n            anchor_comp(\"center\"),\n            circle(radius),\n            color_comp(*col),\n            opacity_comp(1.0),\n            z_comp(1000),\n        ])\n        made.append(obj)\n        _attach_fade(engine, obj, life)\n    return made[0]\n\n\ndef _attach_fade(engine, obj, life):\n    state = {\"t\": 0.0}\n\n    def step():\n        state[\"t\"] += engine.dt()\n        frac = min(state[\"t\"] / life, 1.0)\n        obj.opacity = max(0.0, 1.0 - frac)\n        if frac >= 1.0:\n            obj.destroy()\n\n    obj.onUpdate(step)\n", "level.py": "\"\"\"addLevel(): draw a map as a picture made of characters. Each entry in\ntiles is a function returning a component list \u2014 called once per tile,\nso every tile gets its own object rather than all sharing one.\"\"\"\nfrom .vec2 import Vec2, vec2\nfrom .comps.pos import pos as pos_comp\n\n\nclass Level:\n    def __init__(self, config):\n        self.tileWidth = config.get(\"tileWidth\", 64)\n        self.tileHeight = config.get(\"tileHeight\", 64)\n        origin = config.get(\"pos\", Vec2(0, 0))\n        self.origin = origin if isinstance(origin, Vec2) else vec2(*origin)\n        self.objs = []\n\n    def tile2Pos(self, col, row) -> Vec2:\n        return Vec2(\n            self.origin.x + col * self.tileWidth,\n            self.origin.y + row * self.tileHeight,\n        )\n\n    def get(self, tag):\n        return [o for o in self.objs if o.exists() and o.is_(tag)]\n\n\ndef addLevel(layout, config):\n    from .engine import current_engine\n    engine = current_engine()\n    level = Level(config)\n    tiles_map = config.get(\"tiles\", {})\n\n    for row_idx, row_str in enumerate(layout):\n        for col_idx, ch in enumerate(row_str):\n            if ch == \" \":\n                continue\n            maker = tiles_map.get(ch)\n            if maker is None:\n                continue\n            comp_list = maker()\n            p = level.tile2Pos(col_idx, row_idx)\n            obj = engine.add([pos_comp(p.x, p.y), *comp_list])\n            level.objs.append(obj)\n\n    return level\n", "panel.py": "\"\"\"say() and ask() \u2014 a panel over a paused game.\n\n    say(\"You found the key!\")\n    ask(\"Which keyword starts a loop?\", [\"if\", \"for\", \"def\"], answer=1)\n\nBoth pause the game, put a panel over it, take the answer, and start the game\nagain. While a panel is up it owns the keyboard and the mouse, so the game\nunderneath cannot be played by accident through it.\n\nWHY THE CONTENT IS STRUCTURED AND NOT HTML\n\nThis is the one design decision the rest of the file follows from. A panel is\ndescribed as text, choices and links \u2014 never as markup \u2014 because kaypy runs\nin two places that share nothing:\n\n    python game.py      a pygame window. There is no DOM. None.\n    a web page          a canvas, and a whole browser around it.\n\nStructured content can be rendered by both: as real HTML over the canvas in a\nbrowser, where the text is selectable and a link is a real <a>; and drawn with\npygame on a desktop, where a link opens the system browser instead. An\nHTML-shaped API would be lovely in one of those places and impossible in the\nother, and \"the same file runs both places\" is the whole of what kaypy is for.\n\nThe cost is real and worth stating: you cannot put arbitrary markup in a\npanel. Text, a link, and a question is what there is.\n\nWHY IT CALLS YOU BACK INSTEAD OF RETURNING AN ANSWER\n\n    answer = ask(\"2 + 2?\")        # NOT how this works\n\nIn a browser, Python runs on the same thread as everything else the page\ndoes. Waiting there for a click would stop the page \u2014 including the click\nbeing waited for \u2014 so the tab would hang, not pause. On a desktop the same\nline would work fine, which is the worst kind of difference between the two:\none that only shows up in front of a class.\n\nSo the answer arrives in a function, which is the shape the rest of kaypy\nalready uses for anything that happens later:\n\n    @ask(\"Which keyword starts a loop?\", [\"if\", \"for\", \"def\"], answer=1)\n    def checked(correct):\n        if correct:\n            door.destroy()\n\nWHAT THE FUNCTION IS GIVEN\n\n    say(...)                    nothing\n    ask(..., answer=...)        True or False \u2014 was it right?\n    ask(...) with no answer=    what they picked or typed, as a string\n\nWhich of the last two you get is decided by whether you passed `answer=`,\nand nothing else. A function that takes no arguments is fine in every case.\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\nimport webbrowser\n\nimport pygame\n\n# The panel currently up, or None, and the ones waiting behind it.\n#\n# ONE AT A TIME, BUT NONE THROWN AWAY\n#\n# Only one panel is ever on screen: two at once would have to decide which\n# owns the keyboard, and there is no answer to that a beginner would enjoy\n# discovering. So a second panel opened while one is up waits its turn.\n#\n# It used to be closed instead, on the assumption that a panel goes away\n# because somebody answered it. That holds when you call ask() from inside a\n# handler, and it is false for the most obvious way to write a quiz:\n#\n#     @ask(\"What is your name?\")\n#     def greeted(reply): ...\n#\n#     @ask(\"Which keyword starts a loop?\", [\"if\", \"for\", \"def\"], answer=1)\n#     def checked(correct): ...\n#\n# Both decorators run as the file is read, microseconds apart and long before\n# anyone can answer anything. The first panel was created and immediately\n# discarded by the second, so only the second question was ever asked and\n# `greeted` never ran \u2014 with nothing printed and nothing raised to say so.\n_current = None\n_queue = []\n\n\ndef _engine():\n    from .engine import current_engine\n    return current_engine()\n\n\nclass Panel:\n    \"\"\"What is on screen, and what to do with the answer.\n\n    Deliberately dumb: it holds the content and the state, and knows nothing\n    about how it is drawn. The two renderers (this file's _DesktopView and\n    webpanel.p
